- case_id: L06
  opening: 이름은 장미경이고, 나는 예순세 살 여자이다. 사흘 전부터 어지러워서 병원에 왔다.
  vital_signs: "혈압 : 136/82 mmHg\n맥박 : 74 회/분\n호흡 : 16 회/분\n체온 : 36.4°C"
  script: |
    사흘 전 아침에 일어나려고 고개를 돌리는데 천장이 빙빙 돌았다. 그 뒤로 침대에서 오른쪽으로 돌아눕거나, 고개를 들어 높은 곳을 볼 때 세상이 도는 것처럼 어지럽다.
    한 번 어지러우면 삼십 초 정도 지나 저절로 멈춘다. 가만히 있으면 괜찮다. 어지러울 때 속이 메스껍지만 토하지는 않았다.
    귀가 먹먹하거나 잘 안 들리지는 않는다. 귀에서 소리가 나지도 않는다. 두통은 없다. 팔다리에 힘이 빠지거나 저리지 않고, 말이 어눌하거나 물체가 두 개로 보인 적도 없다. 쓰러지거나 정신을 잃은 적은 없다.
    이 년 전에도 비슷하게 어지러웠는데 일주일쯤 지나 저절로 좋아졌다. 최근 감기를 앓지는 않았다. 머리를 다친 적은 없다.
    고혈압이 있어 약을 먹고 있다. 당뇨는 없다. 약 알레르기는 없다. 담배는 안 피우고 술도 안 마신다. 가족 중에 뇌졸중을 앓은 사람은 없다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-)
    의식·지남력 평가 (Mental status): 명료, 지남력 3/3점
    활력징후 측정 (Vital signs): 136/82mmHg, 74회/분, 16회/분, 36.4°C
    기립성 혈압 측정 (Orthostatic BP): 누운 자세 136/82, 선 자세 132/80, 맥박 변화 4회/분
    안구진탕 확인 (Nystagmus): 자발 안구진탕(-), 주시유발 안구진탕(-)
    두부 충동 검사 (Head impulse test): 정상(-/-)
    딕스-홀파이크 검사 (Dix-Hallpike test): 우측 양성(+), 잠복기 5초 후 회선성 상향 안구진탕 20초, 좌측 음성(-)
    청력 선별검사 (Hearing screening): 손가락 비비기 정상(+/+)
    소뇌 협조운동 검사 (Cerebellar coordination): 손가락-코 검사 정상, 교대운동 정상
    롬베르그 검사 (Romberg test): 음성(-)
    보행 관찰 (Gait): 정상
    사지 근력 검사 (Limb muscle power): 상하지 근력 5/5
  key:
    diagnosis: Benign paroxysmal positional vertigo
    history: [onset, timing, prior, pmh, meds, smoking, alcohol, fh,
              {vertigo_type: "(빙빙|돌|어떻게 어지)", positional: "(자세|고개|누울|돌아|일어날)", duration: "(얼마나 오래|몇 초|몇 분|지속)",
               hearing: "(귀|청력|들리)", tinnitus: "(이명|소리)", neuro: "(힘이 빠|저리|말이|둘로|두 개로|겹쳐)", nausea: "(메스꺼|구역|토)",
               headache: "(두통|머리가 아프)", syncope: "(쓰러|정신을 잃|기절)"}]
    exams: [딕스-홀파이크 검사 (Dix-Hallpike test), 안구진탕 확인 (Nystagmus), 소뇌 협조운동 검사 (Cerebellar coordination),
            롬베르그 검사 (Romberg test)]

- case_id: L07
  opening: 이름은 박성훈이고, 나는 마흔두 살 남자이다. 일주일 전부터 허리가 아프고 왼쪽 다리가 저려서 병원에 왔다.
  vital_signs: "혈압 : 128/80 mmHg\n맥박 : 76 회/분\n호흡 : 16 회/분\n체온 : 36.5°C"
  script: |
    일주일 전에 택배 상자를 들다가 허리가 뜨끔했다. 그날부터 허리 아래쪽이 아프고, 이틀 뒤부터는 왼쪽 엉덩이에서 허벅지 뒤, 종아리 바깥쪽을 따라 발등까지 찌릿하게 뻗친다. 아픈 정도는 열 중에 칠이다.
    오래 앉아 있거나 기침, 재채기를 하면 다리 쪽이 더 아프다. 누워서 무릎을 구부리면 조금 낫다. 왼쪽 발등이 저리고 감각이 둔하다. 왼쪽 엄지발가락에 힘이 조금 빠진 것 같다.
    소변이나 대변을 보는 데 문제는 없다. 항문 주위 감각이 이상하지 않다. 열은 없고 살이 빠지지도 않았다. 밤에 아파서 깨지는 않는다.
    전에도 허리가 가끔 뻐근했지만 이렇게 다리까지 아픈 건 처음이다. 진통제를 먹어도 별로 좋아지지 않았다. 지병은 없다. 약 알레르기는 없다.
    택배 기사로 일해서 무거운 물건을 자주 든다. 담배는 하루 반 갑 피운다. 술은 주말에 맥주를 마신다. 가족 중에 특별한 병은 없다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-), 허리를 굽힌 자세
    활력징후 측정 (Vital signs): 128/80mmHg, 76회/분, 16회/분, 36.5°C
    척추 시진·압통 (Spine inspection and tenderness): 요추 측만(-), 요천추부 근육 압통(+), 극돌기 압통(-)
    요추 운동 범위 (Lumbar range of motion): 전굴 시 통증으로 제한(+)
    하지직거상 검사 (Straight leg raise): 좌측 40도에서 양성(+), 우측 음성(-)
    사지 근력 검사 (Limb muscle power): 좌측 엄지발가락 신전 4/5, 그 외 5/5
    감각 검사 (Sensory examination): 좌측 발등 감각 저하(+)
    심부건반사 (Deep tendon reflex): 슬개건 2+/2+, 아킬레스건 2+/2+
    보행 관찰 (Gait): 좌측 하지 통증으로 절뚝임, 발뒤꿈치 보행 약간 어려움(좌)
    복부 촉진 (Abdominal palpation): 압통(-)
    하지 말초 진찰 (Peripheral pulse and edema): 족배동맥 맥박 정상(+/+), 부종(-/-)
  key:
    diagnosis: Lumbar disc herniation with L5 radiculopathy
    history: [onset, location, radiation, severity, aggravating, relieving, prior, pmh, meds, smoking, job,
              {trigger: "(무거운|들다가|다치|계기)", numbness: "(저리|감각)", weakness: "(힘이 빠|약해)",
               bladder_bowel: "(소변|대변|항문)", red_flag: "(열|살이 빠|체중|밤에)"}]
    exams: [하지직거상 검사 (Straight leg raise), 감각 검사 (Sensory examination), 사지 근력 검사 (Limb muscle power),
            심부건반사 (Deep tendon reflex)]

- case_id: L08
  opening: 이름은 강동원이고, 나는 예순여섯 살 남자이다. 이 주 전부터 가슴이 자주 두근거려서 병원에 왔다.
  vital_signs: "혈압 : 142/86 mmHg\n맥박 : 112 회/분 불규칙\n호흡 : 18 회/분\n체온 : 36.6°C"
  script: |
    이 주 전부터 가슴이 두근거리는 일이 자주 생긴다. 한 번 시작하면 몇 시간씩 가고, 지금도 조금 두근거린다. 심장이 빨랐다 느렸다 제멋대로 뛰는 느낌이다.
    두근거릴 때 계단을 오르면 숨이 조금 차다. 가슴이 아프지는 않다. 어지럽거나 쓰러진 적은 없다. 지난 주말에 술을 많이 마신 다음 날 특히 심했다. 커피는 하루 한 잔 마신다.
    더위를 타거나 살이 빠지지는 않았다. 손이 떨리지 않는다. 한쪽 팔다리에 힘이 빠지거나 말이 어눌해진 적은 없다. 다리가 붓지는 않는다.
    고혈압이 있어서 약을 먹고 있다. 당뇨는 없다. 심장병을 진단받은 적은 없다. 약 알레르기는 없다. 아버지가 뇌졸중을 앓으셨다.
    담배는 십 년 전에 끊었다. 술은 일주일에 서너 번, 한 번에 소주 한 병 이상 마신다. 은퇴하고 집에 있다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-)
    활력징후 측정 (Vital signs): 142/86mmHg, 112회/분 불규칙, 18회/분, 36.6°C
    요골동맥 맥박 촉진 (Radial pulse palpation): 112회/분, 불규칙하게 불규칙함
    갑상선 촉진 (Thyroid palpation): 비대(-), 결절(-)
    경정맥 확인 (Jugular venous pressure): 경정맥 확장(-)
    폐 청진 (Lung auscultation): 폐포음, 수포음(-/-)
    심음 청진 (Heart auscultation): 불규칙한 리듬, 심첨-요골 맥박 결손 10회/분, 심잡음(-)
    자세성 떨림 (Postural tremor): 떨림(-/-)
    하지 말초 진찰 (Peripheral pulse and edema): 부종(-/-)
  key:
    diagnosis: Atrial fibrillation
    history: [onset, timing, pmh, meds, smoking, alcohol, fh,
              {regularity: "(규칙|불규칙|제멋대로)", duration: "(얼마나 오래|몇 시간|몇 분|지속)", trigger: "(술|커피|카페인|유발)",
               syncope: "(쓰러|정신을 잃|기절|어지)", chest_pain: "(가슴.*아프|흉통)", dyspnea: "숨",
               thyroid: "(더위|살이 빠|체중|떨리)", stroke: "(힘이 빠|말이|어눌)"}]
    exams: [요골동맥 맥박 촉진 (Radial pulse palpation), 심음 청진 (Heart auscultation), 갑상선 촉진 (Thyroid palpation)]

- case_id: L09
  opening: 이름은 문지혜이고, 나는 마흔여섯 살 여자이다. 반년 전부터 너무 피곤해서 병원에 왔다.
  vital_signs: "혈압 : 128/86 mmHg\n맥박 : 56 회/분\n호흡 : 16 회/분\n체온 : 36.1°C"
  script: |
    반년 전부터 늘 피곤하다. 밤에 아홉 시간을 자도 아침에 일어나기 힘들고 낮에도 졸리다. 머리가 멍하고 깜빡깜빡 잊는다. 쉬어도 피로가 풀리지 않는다.
    남들보다 추위를 많이 타서 여름에도 긴소매를 입는다. 먹는 양은 그대로인데 반년 사이에 몸무게가 오 키로그람 늘었다. 변비가 생겨서 사흘에 한 번 본다. 피부가 건조해지고 머리카락이 많이 빠진다. 목소리가 조금 쉬었다.
    생리량이 예전보다 많아지고 기간도 길어졌다. 마지막 생리는 이 주 전이다. 기분이 조금 처지지만 즐거운 일에 흥미가 없어진 정도는 아니다. 코를 골거나 자다가 숨이 멎는다는 말은 들은 적 없다.
    열이나 식은땀은 없다. 숨이 차거나 가슴이 두근거리지 않는다. 지병은 없고 먹는 약도 없다. 약 알레르기는 없다. 어머니가 갑상선 약을 드신다.
    담배는 안 피우고 술은 가끔 한 잔 마신다. 초등학교 교사로 일한다.
  exams:
    전반적 외관 시진 (General appearance): 얼굴 부석함(+), 무표정
    활력징후 측정 (Vital signs): 128/86mmHg, 56회/분, 16회/분, 36.1°C
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(-/-), 황달(-/-)
    갑상선 촉진 (Thyroid palpation): 양측 미만성 비대(+), 단단함, 결절(-), 압통(-)
    경부 림프절 촉진 (Cervical lymph node palpation): 촉지(-/-)
    피부 온도·발한 촉진 (Skin temperature and diaphoresis): 차고 건조함(+)
    심음 청진 (Heart auscultation): S1·S2 규칙적 서맥 56회/분, 심잡음(-)
    폐 청진 (Lung auscultation): 폐포음, 수포음(-/-)
    심부건반사 (Deep tendon reflex): 이완기 지연(+/+)
    하지 말초 진찰 (Peripheral pulse and edema): 비함요부종(+/+)
  key:
    diagnosis: Hypothyroidism (Hashimoto thyroiditis)
    history: [onset, severity, pmh, meds, fh, lmp, smoking, alcohol,
              {sleep: "(잠|수면|졸리)", mood: "(기분|우울|흥미)", weight: "(몸무게|체중|살)", cold: "추위",
               bowel: "(변|변비)", skin_hair: "(피부|머리카락|털)", voice: "목소리", menses: "(생리량|생리|월경)"}]
    exams: [갑상선 촉진 (Thyroid palpation), 심부건반사 (Deep tendon reflex),
            피부 온도·발한 촉진 (Skin temperature and diaphoresis), 하지 말초 진찰 (Peripheral pulse and edema)]
