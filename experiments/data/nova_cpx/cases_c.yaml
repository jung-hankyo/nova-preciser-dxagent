- case_id: M08
  playbook: ear_symptoms
  opening: 이름은 윤성민이고, 나는 서른한 살 남자이다. 사흘 전부터 오른쪽 귀가 아파서 병원에 왔다.
  vital_signs: "혈압 : 124/78 mmHg\n맥박 : 74 회/분\n호흡 : 14 회/분\n체온 : 36.8°C"
  script: |
    사흘 전부터 오른쪽 귀 안쪽이 욱신욱신 아프다. 귀 통증은 열 중에 육 정도이다. 아픈 게 점점 심해지고 있다. 음식을 씹거나 하품할 때 귀가 더 아프다. 귓바퀴를 잡아당기거나 귀 앞을 누르면 많이 아프다. 오른쪽으로 누우면 아파서 잠에서 깬다.
    아프기 일주일 전부터 귀 안이 가려웠다. 오른쪽 귀가 꽉 막힌 듯 먹먹하다. 소리는 조금 작게 들린다. 어제부터 귀에서 하얀 진물이 조금 나온다. 진물에서 냄새는 심하지 않다.
    열은 없다. 어지럽지는 않다. 귀에서 삐 소리가 나지는 않는다. 얼굴에 힘이 빠지거나 비뚤어진 적은 없다. 귀에 물집이 생기지는 않았다. 최근에 감기에 걸리거나 목이 아픈 적은 없다.
    한 달 전부터 일주일에 세 번 실내 수영장에 다닌다. 샤워하고 나면 면봉으로 귀를 자주 판다. 회사에서 하루 종일 이어폰을 끼고 일한다. 약국에서 산 진통제를 먹으면 조금 덜 아프다.
    어릴 때 중이염을 앓은 적이 있다. 귀 수술을 받은 적은 없다. 당뇨나 다른 지병은 없다. 매일 먹는 약은 없다. 약 알레르기는 없다. 가족 중에 특별한 병은 없다.
    담배는 피우지 않는다. 술은 일주일에 한 번 맥주를 마신다. 게임 회사에서 개발자로 일한다. 아내와 둘이 산다. 수영을 계속해도 되는지 궁금하다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-)
    활력징후 측정 (Vital signs): 124/78mmHg, 74회/분, 14회/분, 36.8°C
    이경 검사 (Otoscopy): 우측 외이도 발적·부종(+), 외이도 협착(+), 흰색 분비물과 부스러기(+), 보이는 고막 정상, 천공(-), 좌측 정상
    이주 압통 확인 (Tragal tenderness): 우측 이주 압통(+), 귓바퀴 견인통(+), 좌측(-)
    유양돌기 압통 확인 (Mastoid tenderness): 압통(-/-), 발적(-)
    경부 림프절 촉진 (Cervical lymph node palpation): 우측 귀앞 림프절 0.5cm 압통(+), 그 외 촉지(-)
    안면 근력 검사 (Facial muscle strength (CN VII)): 정상, 좌우 대칭
    피부 시진 (Skin inspection): 귓바퀴 수포(-), 홍반(-)
    턱관절 촉진 (Temporomandibular joint palpation): 압통(-), 개구 시 딸깍음(-)
    인두 시진 (Pharynx inspection): 발적(-), 편도 비대(-)
    속삭임 청력 검사 (Whispered voice test): 우측 경도 감소, 좌측 정상
    웨버 검사 (Weber test): 우측으로 편위
    린네 검사 (Rinne test): 양측 양성(공기전도>골전도)
