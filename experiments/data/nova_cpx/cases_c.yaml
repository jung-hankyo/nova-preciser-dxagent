- case_id: M09
  playbook: neck_mass
  opening: 이름은 장석호이고, 나는 예순한 살 남자이다. 두 달 전부터 오른쪽 목에 혹이 만져져서 병원에 왔다.
  vital_signs: "혈압 : 136/84 mmHg\n맥박 : 80 회/분\n호흡 : 16 회/분\n체온 : 36.7°C"
  script: |
    두 달 전 면도하다가 오른쪽 턱 밑 목에서 혹을 처음 만졌다. 처음에는 메추리알만 했는데 지금은 탁구공만큼 커졌다. 혹은 딱딱하고 잘 움직이지 않는다. 혹을 눌러도 아프지 않다. 혹이 빨개지거나 고름이 나온 적은 없다.
    석 달 전부터 오른쪽 목구멍이 따끔거리고 아프다. 음식을 삼킬 때 목이 아프다. 고기 같은 딱딱한 음식은 잘 안 넘어간다. 한 달 전부터 오른쪽 귀가 가끔 쑤신다. 가끔 침에 피가 조금 섞여 나온다. 목소리는 크게 변하지 않았다. 숨쉬기 힘든 적은 없다.
    석 달 사이에 몸무게가 육 킬로그램 줄었다. 열은 없다. 밤에 식은땀을 흘리지는 않는다. 최근에 감기를 앓지는 않았다. 이가 아프거나 잇몸이 붓지는 않았다. 코가 막히거나 코피가 난 적은 없다. 동네 의원에서 항생제를 일주일 먹었지만 혹은 그대로였다.
    결핵을 앓은 적은 없다. 주변에 결핵 환자는 없다. 십 년 전부터 고혈압약을 먹는다. 당뇨는 없다. 수술이나 입원한 적은 없다. 약 알레르기는 없다. 가족 중에 암에 걸린 사람은 없다.
    담배는 스무 살 때부터 하루 한 갑씩 피우고 있다. 술은 거의 매일 소주 한 병씩 마신다. 개인택시를 운전한다. 아내와 둘이 산다. 혹시 암이 아닐까 걱정된다.
  exams:
