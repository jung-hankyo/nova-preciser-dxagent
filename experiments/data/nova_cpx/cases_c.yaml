               claudication: "(다리|걸을 때)", thyroid: "(추위|갑상선|변비|살이 찌|체중|몸무게)",
               nephrotic: "(붓|부종|거품)", premature_cad: "(심장|심근경색|협심증|돌아가)",
               diet: "(음식|식습관|기름|식사)", exercise: "운동"}]
