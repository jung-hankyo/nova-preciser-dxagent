            허리둘레 측정 (Waist circumference)]

- case_id: M06
  playbook: sore_throat
  opening: 이름은 한지민이고, 나는 스무 살 여자이다. 일주일 전부터 목이 아파서 병원에 왔다.
  vital_signs: "혈압 : 112/70 mmHg\n맥박 : 98 회/분\n호흡 : 16 회/분\n체온 : 38.3°C"
  script: |
    일주일 전부터 목이 따끔거리다가 점점 심하게 아파졌다. 침이나 음식을 삼킬 때 목이 더 아프다. 목 통증은 열 중에 칠 정도이다. 목이 아파서 밥은 잘 못 먹지만 물은 마신다.
    엿새 전부터 열이 났다. 열은 높을 때 삼십팔 도 오 부까지 올랐다. 너무 피곤해서 하루 종일 누워 있다. 양쪽 목 옆과 뒤쪽에 멍울이 여러 개 만져진다. 멍울을 누르면 조금 아프다. 아침에 일어나면 눈두덩이가 붓는다. 왼쪽 윗배가 가끔 묵직하다.
    기침이나 콧물은 거의 없다. 목소리는 변하지 않았다. 입을 벌리는 데는 문제가 없다. 침을 흘리거나 숨쉬기 힘든 적은 없다.
    엿새 전 동네 의원에서 편도염이라며 항생제를 받았다. 항생제를 먹은 지 나흘째 되는 날 몸통과 팔에 붉은 반점이 생겼다. 반점은 조금 가렵다. 반점이 생긴 뒤로 약은 먹지 않았다. 전에는 약 알레르기가 없었다.
    한 달 전쯤 남자친구가 목감기를 오래 앓았다. 성관계는 남자친구와만 한다. 콘돔은 항상 사용한다. 마지막 생리는 열흘 전이었다. 임신 가능성은 없다고 생각한다.
    지병은 없다. 수술이나 입원한 적은 없다. 담배는 피우지 않는다. 술은 한 달에 두세 번 마신다. 대학교 이 학년이고 기숙사에서 지낸다. 가족 중에 특별한 병은 없다. 시험 기간인데 너무 피곤해서 걱정이다.
  exams:
    전반적 외관 시진 (General appearance): 피곤해 보임, 급성 병색(+)
    활력징후 측정 (Vital signs): 112/70mmHg, 98회/분, 16회/분, 38.3°C
    인두 시진 (Pharynx inspection): 양측 편도 3도 비대, 회백색 삼출물(+/+), 연구개 점상출혈(+), 목젖 편위(-)
    경부 림프절 촉진 (Cervical lymph node palpation): 양측 전경부·후경부 1~2cm 림프절 여러 개(+/+), 경도 압통(+), 유동성(+)
    겨드랑이 림프절 촉진 (Axillary lymph node palpation): 1cm 미만 림프절 촉지(+/+), 압통(-)
    간·비장 촉진 (Liver and spleen palpation): 비장 좌늑골하연 2cm 촉지(+), 간 비대(-)
    복부 촉진 (Abdominal palpation): 좌상복부 경도 압통(+), 반발압통(-)
    안검 부종 시진 (Eyelid edema): 양측 경도 부종(+/+)
    피부 시진 (Skin inspection): 몸통과 양팔에 홍반성 반점구진 발진(+), 수포(-), 점막 침범(-)
    결막·공막 시진 (Conjunctiva and sclera inspection): 충혈(-/-), 황달(-/-)
