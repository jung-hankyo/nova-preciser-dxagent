- case_id: M05
  playbook: dyslipidemia
  opening: 이름은 정은경이고, 나는 마흔두 살 여자이다. 건강검진에서 콜레스테롤이 높다고 해서 병원에 왔다.
  vital_signs: "혈압 : 118/76 mmHg\n맥박 : 70 회/분\n호흡 : 14 회/분\n체온 : 36.5°C"
  script: |
    삼 주 전 직장 건강검진에서 콜레스테롤이 높다는 결과를 받았다. 총콜레스테롤은 삼백삼십이라고 적혀 있었다. 나쁜 콜레스테롤은 이백사십오라고 했다. 중성지방과 좋은 콜레스테롤은 정상이라고 했다. 혈당은 정상이라고 들었다.
    삼 년 전 검진에서도 콜레스테롤이 높다고 했지만 음식만 조심했다. 콜레스테롤 약을 먹어 본 적은 없다. 몸에 불편한 증상은 없다. 걷거나 계단을 오를 때 가슴이 아픈 적은 없다. 숨이 찬 적은 없다. 오래 걸을 때 다리가 아프지는 않다. 말이 어눌하거나 팔다리에 힘이 빠진 적은 없다.
    추위를 더 타지는 않는다. 최근에 살이 찌지는 않았다. 변비는 없다. 몸이 붓거나 소변에 거품이 많지는 않다. 눈이 노래지거나 피부가 가려운 적은 없다. 키는 백육십이고 몸무게는 오십사 킬로그램이다. 기름진 음식은 적게 먹는 편이다. 일주일에 세 번 삼십 분씩 걷는다.
    가족 중에 아버지가 마흔다섯 살에 심근경색으로 스텐트 시술을 받았다. 큰아버지는 쉰두 살에 갑자기 돌아가셨다. 남동생도 콜레스테롤이 높다는 말을 들었다. 어머니는 건강하시다. 초등학생 아이가 둘 있는데 콜레스테롤 검사는 안 해 봤다.
    고혈압이나 당뇨는 없다. 매일 먹는 약은 없다. 피임약이나 스테로이드는 먹지 않는다. 출산 말고는 수술이나 입원한 적이 없다. 약 알레르기는 없다. 마지막 생리는 열흘 전이었다. 생리는 규칙적이다. 남편이 정관수술을 해서 임신 계획은 없다.
    담배는 피운 적이 없다. 술은 한 달에 한두 번 맥주 한 잔을 마신다. 초등학교 교사로 일한다. 아버지처럼 심장병이 생길까 봐 걱정된다. 약을 평생 먹어야 하는지 궁금하다.
  exams:
    전반적 외관 시진 (General appearance): 정상 체격, 급성 병색(-)
    활력징후 측정 (Vital signs): 118/76mmHg, 70회/분, 14회/분, 36.5°C
    신체 계측 (Anthropometry): 키 160cm, 체중 54kg, BMI 21.1
    허리둘레 측정 (Waist circumference): 74cm
    황색종 시진 (Xanthoma inspection): 양측 아킬레스건 비후 및 결절(+/+), 손등 신전건 결절(-), 안검황색종(-)
    각막환 확인 (Corneal arcus): 양측 각막 주변부 회백색 고리(+/+)
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(-/-), 황달(-/-)
    갑상선 촉진 (Thyroid palpation): 종대(-), 결절(-)
    경동맥 잡음 청진 (Carotid bruit): 잡음(-/-)
    심음 청진 (Heart auscultation): S1·S2 규칙적, 심잡음(-)
    폐 청진 (Lung auscultation): 폐포음, 수포음(-/-)
    복부 촉진 (Abdominal palpation): 압통(-), 간 비대(-)
