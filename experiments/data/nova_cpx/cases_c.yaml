- case_id: M10
  playbook: neck_pain
  opening: 이름은 오현정이고, 나는 마흔다섯 살 여자이다. 삼 주 전부터 목 뒤가 아프고 오른팔이 저려서 병원에 왔다.
  vital_signs: "혈압 : 122/78 mmHg\n맥박 : 76 회/분\n호흡 : 16 회/분\n체온 : 36.6°C"
  script: |
    삼 주 전 아침에 자고 일어나니 목 뒤가 뻐근하게 아팠다. 이 주 전부터는 오른쪽 날개뼈 안쪽에서 팔 뒤쪽을 타고 손가락까지 찌릿하게 뻗친다. 오른손 가운뎃손가락이 저리고 감각이 둔하다. 아픈 정도는 열 중에 칠 정도이다. 밤에도 아파서 두세 번 깬다.
    고개를 뒤로 젖히거나 오른쪽으로 돌리면 팔이 더 찌릿하다. 기침이나 재채기를 할 때도 팔이 더 저리다. 오른손을 머리 위에 올리고 있으면 조금 편하다. 오른팔로 물건을 밀거나 팔꿈치를 펼 때 힘이 덜 들어간다.
    넘어지거나 목을 다친 적은 없다. 열은 없다. 살이 빠지지는 않았다. 걸을 때 휘청거리지는 않는다. 단추를 채우거나 젓가락질하는 데는 문제가 없다. 왼팔과 다리는 저리지 않다. 대소변을 보는 데는 문제가 없다. 어지럼증은 없다. 가슴 통증은 없다.
    몇 년 전부터 가끔 목이 뻐근했지만 팔이 저린 것은 처음이다. 약국 진통제를 먹으면 잠깐 덜하다. 한의원에서 침을 두 번 맞았지만 그대로이다.
    지병은 없다. 매일 먹는 약은 없다. 수술이나 입원한 적은 없다. 약 알레르기는 없다. 마지막 생리는 이 주 전이었다. 임신 가능성은 없다. 가족 중에 특별한 병은 없다.
    담배는 피우지 않는다. 술은 한 달에 한두 번 와인을 한 잔 마신다. 회계 사무소에서 하루 아홉 시간 넘게 컴퓨터로 일한다. 남편, 중학생 딸과 함께 산다. 팔에 힘이 더 빠질까 봐 걱정된다. 수술을 해야 하는지 궁금하다.
