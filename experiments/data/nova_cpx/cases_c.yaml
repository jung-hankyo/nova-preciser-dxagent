- case_id: M07
  playbook: nasal_symptoms
  opening: 이름은 이준우이고, 나는 열다섯 살 남자이다. 석 달 전부터 코가 막히고 재채기를 자주 해서 병원에 왔다.
  vital_signs: "혈압 : 116/72 mmHg\n맥박 : 76 회/분\n호흡 : 16 회/분\n체온 : 36.6°C"
  script: |
    석 달 전부터 거의 매일 코가 막히고 재채기가 난다. 재채기는 아침에 일어나면 열 번 넘게 연달아 나온다. 맑은 콧물이 물처럼 흐른다. 코 안이 자주 가렵다. 눈도 가렵고 눈물이 난다. 코는 양쪽이 번갈아 막힌다.
    밤에는 코가 막혀서 입으로 숨을 쉰다. 엄마가 내가 밤에 코를 곤다고 했다. 자다가 자주 깬다. 수업 시간에 졸리고 집중이 잘 안 된다. 콧물이 목 뒤로 넘어가서 헛기침을 자주 한다.
    누런 콧물은 나오지 않는다. 코피가 난 적은 없다. 냄새는 잘 맡는다. 얼굴이나 이마가 아프지는 않다. 열은 없다. 숨이 차거나 쌕쌕거린 적은 없다.
    석 달 전부터 집에서 고양이를 키운다. 지난 주말에 할머니 댁에서 이틀 지낼 때는 훨씬 덜했다. 초등학생 때부터 봄가을이면 재채기와 콧물이 났다. 이번처럼 매일 심한 것은 처음이다.
    약국에서 산 알레르기약을 먹었더니 졸려서 그만 먹었다. 약국에서 산 코 스프레이를 사흘 뿌렸을 때는 잠깐 뚫렸다. 매일 먹는 약은 없다. 어릴 때 아토피 피부염이 있었다. 약 알레르기는 없다. 수술이나 입원한 적은 없다.
    가족 중에 엄마도 비염이 있다. 아빠는 담배를 피우지만 집 밖에서 피운다. 나는 담배를 피우지 않는다. 술은 마시지 않는다. 중학교 삼 학년이고 부모님, 여동생과 아파트에 산다. 곧 시험인데 코 때문에 잠을 못 자서 힘들다. 고양이를 다른 집에 보내야 하는지 걱정이다.
