# Local CPX-style practice cases M01-M10, written for this project in the kit's case format (see cases_a.yaml
# for the conventions). One case per presentation playbook: fever, hemoptysis, syncope, high_bp, dyslipidemia,
# sore_throat, nasal_symptoms, ear_symptoms, neck_mass, neck_pain. Serious or can't-miss causes: M02, M03, M05, M09.

- case_id: M01
  playbook: fever
  opening: 이름은 박영순이고, 나는 예순일곱 살 여자이다. 닷새 전부터 열이 나고 온몸이 쑤셔서 병원에 왔다.
  vital_signs: "혈압 : 116/70 mmHg\n맥박 : 98 회/분\n호흡 : 18 회/분\n체온 : 38.9°C\n산소포화도 : 97%"
  script: |
    닷새 전 저녁부터 오한이 들면서 열이 나기 시작했다. 집에서 재 보니 열이 삼십구 도까지 올랐다. 해열제를 먹으면 잠깐 내렸다가 몇 시간 뒤 다시 오른다. 이렇게 열이 오래 난 것은 처음이다.
    머리가 지끈지끈 아프다. 두통은 열 중에 육 정도이다. 온몸이 몸살처럼 쑤시고 기운이 없다. 입맛이 없고 속이 조금 메스껍다. 토하거나 설사하지는 않았다.
    이틀 전부터 배와 가슴에 붉은 반점이 생겨서 팔로 번졌다. 반점은 가렵지 않다. 마른기침이 조금 난다. 가래는 없다. 숨이 차지는 않는다. 목이 아프거나 콧물이 나지는 않는다.
    소변볼 때 아프지 않다. 소변 양은 평소와 비슷하다. 옆구리나 허리는 아프지 않다. 잇몸이나 코에서 피가 난 적은 없다. 몸에 멍이 든 곳은 없다. 목이 뻣뻣하거나 정신이 흐려진 적은 없다.
    이 주 전쯤 사흘 동안 밭에서 고구마를 캤다. 그 무렵 뒷산에 가서 밤도 주웠다. 일하다가 풀밭에 앉아서 쉬기도 했다. 벌레에 물린 기억은 없다. 몸에 딱지나 상처가 있는지는 잘 모르겠다. 논에 들어가거나 물에 젖어 일한 적은 없다. 해외여행은 다녀온 적이 없다. 남편도 같이 일했는데 남편은 아프지 않다.
    오 년 전부터 고혈압약으로 암로디핀을 먹고 있다. 당뇨는 없다. 수술이나 입원한 적은 없다. 약 알레르기는 없다. 가족 중에 특별한 병은 없다.
    담배는 피운 적이 없다. 술은 마시지 않는다. 남편과 둘이 시골에서 농사를 지으며 산다. 열이 계속 안 떨어져서 큰 병이 아닌지 걱정된다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(+), 의식 명료
    활력징후 측정 (Vital signs): 116/70mmHg, 98회/분, 18회/분, 38.9°C, SpO2 97%
    의식·지남력 평가 (Mental status): 명료, 지남력 정상
    결막·공막 시진 (Conjunctiva and sclera inspection): 충혈(-/-), 창백(-/-), 황달(-/-)
    인두 시진 (Pharynx inspection): 발적(-), 편도 비대(-)
    경부 림프절 촉진 (Cervical lymph node palpation): 촉지(-/-)
    경부 강직 (Neck stiffness): 강직(-)
    폐 청진 (Lung auscultation): 폐포음, 수포음(-/-), 천명음(-/-)
    심음 청진 (Heart auscultation): S1·S2 규칙적 빈맥, 심잡음(-)
    복부 촉진 (Abdominal palpation): 압통(-), 반발압통(-)
    간·비장 촉진 (Liver and spleen palpation): 간비종대(-)
    늑골척추각 압통 (Costovertebral angle tenderness): 압통(-/-)
    피부 시진 (Skin inspection): 체간과 양팔에 홍반성 반점구진 발진(+), 수포(-), 소양감(-)
    가피 확인 (Eschar search): 좌측 서혜부 8mm 검은 가피(+), 주위 홍반 테두리(+)
    서혜부 림프절 촉진 (Inguinal lymph node palpation): 좌측 1.5cm 압통성 림프절(+), 우측 촉지(-)
    점상출혈 확인 (Petechiae and purpura): 점상출혈(-), 자반(-)
  key:
    diagnosis: Scrub typhus (tsutsugamushi disease)
    differential: [Hemorrhagic fever with renal syndrome, Leptospirosis, Severe fever with thrombocytopenia syndrome,
                   Acute pyelonephritis]
    history: [onset, timing, pmh, meds, smoking, alcohol, job,
              {chills: "(오한|춥|떨리)", headache: "(머리|두통)", myalgia: "(근육|몸살|쑤시|온몸)",
               rash: "(발진|반점|두드러기|피부)", eschar: "(딱지|상처|벌레|진드기|물린)",
               outdoor: "(밭|산에|풀|농사|야외|등산|성묘|벌초|들일)", urine: "(소변|오줌)", bleeding: "(피가|출혈|멍)",
               gi: "(설사|토하|구토|메스)", travel: "(여행|해외)", cough: "기침"}]
    exams: [가피 확인 (Eschar search), 피부 시진 (Skin inspection), 서혜부 림프절 촉진 (Inguinal lymph node palpation),
            경부 강직 (Neck stiffness), 늑골척추각 압통 (Costovertebral angle tenderness)]

- case_id: M02
  playbook: hemoptysis
  opening: 이름은 김태윤이고, 나는 스물여섯 살 남자이다. 사흘 전부터 가래에 피가 섞여 나와서 병원에 왔다.
  vital_signs: "혈압 : 118/72 mmHg\n맥박 : 92 회/분\n호흡 : 18 회/분\n체온 : 37.8°C\n산소포화도 : 97%"
  script: |
    사흘 전부터 기침할 때 가래에 빨간 피가 실처럼 섞여 나온다. 피 섞인 가래는 하루에 두세 번 나온다. 피의 양은 한 번에 찻숟가락 하나도 안 된다. 피를 토하거나 덩어리로 쏟은 적은 없다. 전에는 피가 나온 적이 없다.
    기침은 오 주 전부터 났고 점점 심해졌다. 처음에는 마른기침이었는데 요즘은 누런 가래가 나온다. 삼 주 전부터 오후나 저녁이 되면 미열이 난다. 밤에 자다가 식은땀이 나서 옷이 젖는다. 두 달 사이에 몸무게가 오 킬로그램 빠졌다. 입맛이 없고 쉽게 피곤하다.
    가슴 통증은 없다. 숨이 차지는 않는다. 코피나 잇몸 출혈은 없다. 몸에 멍이 잘 들지는 않는다. 다리가 붓거나 종아리가 아픈 적은 없다.
    가족 중에는 같이 살던 할아버지가 작년에 결핵 치료를 받으셨다. 나는 결핵을 앓은 적이 없다. 결핵 검사를 받아 본 적도 없다. 동네 의원에서 감기약을 열흘 먹었지만 낫지 않았다.
    지병은 없다. 매일 먹는 약은 없다. 약 알레르기는 없다. 수술이나 입원한 적은 없다. 해외에 다녀온 적은 없다. 부모님은 건강하시다.
    담배는 하루 반 갑씩 칠 년째 피운다. 술은 일주일에 한두 번 맥주를 마신다. 회사에서 프로그래머로 일한다. 지금은 혼자 원룸에 산다. 피가 나오니까 큰 병일까 봐 무섭다.
  exams:
    전반적 외관 시진 (General appearance): 마른 체격, 만성 병색(+)
    활력징후 측정 (Vital signs): 118/72mmHg, 92회/분, 18회/분, 37.8°C, SpO2 97%
    체중 측정 (Body weight): 63kg, BMI 20.1
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(-/-), 황달(-/-)
    비강 시진 (Nasal inspection): 출혈 부위(-), 종괴(-)
    구강 점막 시진 (Oral mucosa inspection): 잇몸 출혈(-), 궤양(-)
    경부 림프절 촉진 (Cervical lymph node palpation): 촉지(-/-)
    쇄골상 림프절 촉진 (Supraclavicular lymph node palpation): 촉지(-/-)
    흉곽 시진 (Chest inspection): 대칭, 보조호흡근 사용(-)
    흉부 타진 (Chest percussion): 공명음, 둔탁음(-/-)
    폐 청진 (Lung auscultation): 우측 상부 수포음(+), 기침 후 더 뚜렷함, 천명음(-/-)
    심음 청진 (Heart auscultation): S1·S2 규칙적, 심잡음(-)
    곤봉지 확인 (Digital clubbing): 곤봉지(-)
    종아리 둘레 측정 (Calf circumference): 좌우 차이(-), 압통(-)
  key:
    diagnosis: Pulmonary tuberculosis (active, right upper lobe)
    differential: [Bronchiectasis, Lung abscess or necrotizing pneumonia, Lung cancer, Pulmonary embolism]
    history: [onset, character, pmh, meds, fh, smoking, alcohol, job,
              {amount: "(양이|양은|얼마나 많|숟가락|컵)", sputum: "가래", fever: "(열이|열은|열도|열나|체온|미열)",
               night_sweat: "땀", weight_loss: "(체중|몸무게|살이)", tb_contact: "(결핵|주변|접촉)",
               hematemesis: "(토하|구토|토혈)", nose_gum: "(코피|잇몸|코에서)", chest_pain: "(가슴|흉통)",
               dyspnea: "(숨이|숨차|호흡)"}]
    exams: [폐 청진 (Lung auscultation), 활력징후 측정 (Vital signs), 비강 시진 (Nasal inspection),
            쇄골상 림프절 촉진 (Supraclavicular lymph node palpation)]

- case_id: M03
  playbook: syncope
  opening: 이름은 최말순이고, 나는 일흔여섯 살 여자이다. 어제 계단을 오르다가 정신을 잃고 쓰러져서 병원에 왔다.
  vital_signs: "혈압 : 118/86 mmHg\n맥박 : 70 회/분\n호흡 : 16 회/분\n체온 : 36.4°C"
  script: |
    어제 오후에 지하철역 계단을 오르다가 정신을 잃고 쓰러졌다. 그때 장바구니를 들고 계단을 빨리 올라가고 있었다. 쓰러지기 직전에 눈앞이 캄캄해지면서 머리가 핑 돌았다. 쓰러지기 전에 속이 메스껍거나 식은땀이 나지는 않았다. 쓰러지기 전에 가슴이 두근거리지는 않았다.
    옆에 있던 사람 말로는 일 분도 안 되어 깨어났다고 한다. 깨어난 뒤에는 바로 정신이 맑았고 헷갈리지 않았다. 팔다리를 떨거나 혀를 깨물지는 않았다. 소변을 지리지는 않았다. 넘어지면서 오른쪽 무릎이 까졌다. 머리는 부딪히지 않았다.
    한 달 전에도 계단을 오르다가 어지러워서 주저앉은 적이 있다. 오래 서 있거나 앉았다가 일어날 때 어지러운 적은 없다. 석 달 전부터 언덕이나 계단을 오르면 가슴이 조이듯 아프다. 가슴 통증은 쉬면 오 분 안에 사라진다. 반년 전부터 조금만 걸어도 숨이 찬다. 누우면 숨이 차거나 다리가 붓지는 않는다.
    오 년 전 건강검진에서 심장에서 잡음이 들린다는 말을 들었다. 그때 정밀 검사는 받지 않았다. 십 년 전부터 혈압약을 하루 한 알 먹는다. 최근에 약을 바꾸거나 새로 먹는 약은 없다. 당뇨는 없다. 어제 점심도 평소처럼 먹었다. 검은 변을 보거나 피를 토한 적은 없다. 말이 어눌하거나 한쪽 팔다리에 힘이 빠진 적은 없다.
    수술이나 입원한 적은 없다. 약 알레르기는 없다. 담배는 피운 적이 없다. 술은 마시지 않는다. 엘리베이터가 없는 아파트 사 층에 남편과 둘이 산다. 가족 중에 갑자기 돌아가신 사람은 없다. 또 쓰러질까 봐 혼자 밖에 나가기가 무섭다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-), 의식 명료
    활력징후 측정 (Vital signs): 118/86mmHg, 70회/분, 16회/분, 36.4°C
    기립성 혈압 측정 (Orthostatic BP): 누운 자세 120/86mmHg 70회/분 → 선 자세 3분 116/84mmHg 74회/분, 어지럼(-)
    의식·지남력 평가 (Mental status): 명료, 지남력 정상
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(-/-), 황달(-/-)
    요골동맥 맥박 촉진 (Radial pulse palpation): 규칙적, 맥박이 약하고 늦게 상승함(+)
    경동맥 잡음 청진 (Carotid bruit): 양측 경동맥으로 전달되는 수축기 잡음(+/+)
    경정맥압 측정 (Jugular venous pressure): 경정맥 확장(-)
    심음 청진 (Heart auscultation): 우측 제2늑간 흉골연 거친 점증-점감형 수축기 심잡음 Gr.3/6, 늦은 정점, S2 감약, S4(+)
    폐 청진 (Lung auscultation): 폐포음, 수포음(-/-)
    하지 함요부종 확인 (Pitting edema of the legs): 부종(-/-)
    사지 근력 검사 (Limb muscle power): 사지 5/5
    회내근 표류 검사 (Pronator drift): 표류(-)
    혀 시진 (Tongue inspection): 깨문 상처(-)
    피부 시진 (Skin inspection): 우측 무릎 찰과상(+)
  key:
    diagnosis: Exertional syncope due to severe aortic stenosis
    differential: [Arrhythmic syncope (complete AV block or ventricular tachycardia), Hypertrophic obstructive cardiomyopathy,
                   Orthostatic hypotension, Seizure]
    history: [prior, pmh, meds, fh, smoking, alcohol,
              {situation: "(무엇을 하|뭘 하|뭐 하|어떤 상황|당시|하고 계|하던 중)", prodrome: "(직전|전조|쓰러지기 전|캄캄|미리)",
               exertion: "(계단|운동|걸을|움직|힘든 일|활동)", chest_pain: "(가슴.*아프|흉통|가슴 통증|조이)",
               palpitation: "(두근|맥박|심장이 빨리)", dyspnea: "(숨이|숨차|호흡)",
               loc_duration: "(얼마 동안|몇 분|몇 초|금방 깨|정신을 잃은 시간|의식을 잃은 시간)",
               seizure: "(경련|떨|혀를|지리|거품|헷갈|멍하)", injury: "(다친|다치|부딪|상처)",
               murmur: "(잡음|심장.*(검사|이상|병))", neuro: "(마비|힘이 빠|어눌|감각)",
               orthostatic: "(일어날 때|일어서|오래 서|자세)"}]
    exams: [심음 청진 (Heart auscultation), 경동맥 잡음 청진 (Carotid bruit), 기립성 혈압 측정 (Orthostatic BP),
            요골동맥 맥박 촉진 (Radial pulse palpation)]

- case_id: M04
  playbook: high_bp
  opening: 이름은 이상철이고, 나는 쉰두 살 남자이다. 회사 건강검진에서 혈압이 높다고 해서 병원에 왔다.
  vital_signs: "혈압 : 156/98 mmHg\n맥박 : 78 회/분\n호흡 : 16 회/분\n체온 : 36.5°C"
  script: |
    이 주 전 회사 건강검진에서 혈압이 백오십팔에 구십팔이 나왔다. 다시 재도 비슷하게 높다고 들었다. 그 뒤로 집에서 혈압계로 아침저녁 재 보니 대부분 백오십이 넘었다. 삼 년 전 검진에서는 혈압이 조금 높으니 조심하라는 말만 들었다. 혈압약을 먹은 적은 없다.
    가끔 아침에 뒷목이 뻐근하다. 머리가 심하게 아픈 적은 없다. 눈이 침침하거나 잘 안 보인 적은 없다. 가슴 통증은 없다. 숨이 차지는 않는다. 가슴이 두근거린 적은 없다. 갑자기 얼굴이 붉어지며 땀이 쏟아진 적은 없다. 팔다리에 힘이 빠지거나 쥐가 자주 나지는 않는다.
    소변은 밤에 한 번 정도 본다. 소변에 거품이 많거나 피가 섞인 적은 없다. 발이 붓지는 않는다. 코를 골지만 자다가 숨을 멈춘다는 말은 듣지 못했다. 최근 일 년 동안 몸무게는 크게 변하지 않았다. 진통제나 감기약은 먹지 않는다. 한약이나 건강식품도 먹지 않는다.
    당뇨는 없다고 들었다. 콜레스테롤은 약간 높다는 말을 들었다. 콩팥병이나 갑상선 병을 앓은 적은 없다. 수술이나 입원한 적은 없다. 약 알레르기는 없다.
    담배는 하루 반 갑씩 이십오 년째 피운다. 술은 일주일에 세 번, 한 번에 소주 한 병을 마신다. 국물과 찌개를 좋아해서 짜게 먹는 편이다. 운동은 거의 하지 않는다. 영업부장이라 스트레스가 많고 저녁 회식이 잦다.
    가족 중에 아버지가 고혈압이 있었다. 아버지는 예순다섯 살에 뇌경색으로 쓰러지셨다. 어머니는 당뇨가 있다. 아내와 고등학생 아들과 함께 산다. 혈압약을 한번 먹으면 평생 먹어야 하는지 걱정된다.
