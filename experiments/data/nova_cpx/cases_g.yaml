- case_id: S09
  playbook: headache
  opening: 이름은 한지수이고, 나는 서른여섯 살 여자이다. 임신 삼십삼 주인데, 어제부터 머리가 아파서 병원에 왔다.
  vital_signs: "혈압 : 164/108 mmHg\n맥박 : 96 회/분\n호흡 : 18 회/분\n체온 : 36.8°C"
  script: |
    지금 임신 삼십삼 주이고 첫 임신이다. 시험관 시술로 임신했다. 어제 오후부터 이마 양쪽이 지끈지끈 아프다. 아픈 정도는 열 중에 칠이다. 타이레놀을 두 번 먹었는데 듣지 않는다. 평소에는 두통이 거의 없었다.
    오늘 아침부터 눈앞이 뿌옇고 번쩍이는 것이 보인다. 오늘 새벽부터 명치와 오른쪽 윗배가 뻐근하게 아프다. 속이 메스꺼워서 한 번 토했다.
    일주일 전부터 얼굴과 손이 붓고 반지가 안 들어간다. 다리도 많이 붓는다. 일주일 사이에 몸무게가 이 키로그람 늘었다. 소변 양이 평소보다 조금 준 것 같다. 숨이 차지는 않다. 경련을 하거나 정신을 잃은 적은 없다. 열은 없다.
    태동은 평소처럼 잘 느껴진다. 배가 규칙적으로 뭉치는 느낌은 없다. 질 출혈은 없다. 양수가 새는 느낌은 없다.
    임신 전에는 혈압이 정상이었다. 이 주 전 산전 진찰 때 혈압이 조금 높다고 해서 집에서 재 보라고 했다. 어젯밤 집에서 잰 혈압은 백육십에 백이었다. 임신성 당뇨 검사는 정상이라고 들었다.
    당뇨, 콩팥병, 루푸스 같은 병을 앓은 적은 없다. 먹는 약은 철분제뿐이다. 약 알레르기는 없다. 수술이나 입원한 적은 없다. 어머니가 나를 임신했을 때 임신중독증이 있었다고 들었다.
    담배는 피우지 않는다. 임신한 뒤로 술은 마시지 않는다. 회사원이고 남편과 둘이 산다. 아기가 잘못될까 봐 걱정이다.
