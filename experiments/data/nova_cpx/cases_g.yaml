    간·비장 촉진 (Liver and spleen palpation): 간비대(-), 비장비대(-)
    심음 청진 (Heart auscultation): S1·S2 규칙적, 심잡음(-)
    폐 청진 (Lung auscultation): 폐포음 정상, 수포음(-/-)
