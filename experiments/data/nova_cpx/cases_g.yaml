    사지 근력 검사 (Limb muscle power): 협조는 떨어지나 좌우 대칭, 편측 마비(-)
    바빈스키 징후 (Babinski sign): (-/-)
    동공 반사 (Pupillary reflex): 양측 정상, 대칭
