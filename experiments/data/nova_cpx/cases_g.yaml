- case_id: S06
  playbook: insomnia
  opening: 이름은 오정민이고, 나는 마흔여섯 살 남자이다. 두 달 전부터 잠을 제대로 못 자서 병원에 왔다. 수면제를 받고 싶다.
  vital_signs: "혈압 : 128/82 mmHg\n맥박 : 84 회/분\n호흡 : 16 회/분\n체온 : 36.4°C"
  script: |
    두 달 전부터 잠은 드는데 새벽 세 시쯤 깨서 다시 잠들지 못한다. 하루에 서너 시간밖에 못 잔다. 처음에 동네 의원에서 받은 수면제를 먹어 봤지만 별 효과가 없었다.
    넉 달 전에 십 년 동안 하던 식당이 문을 닫았다. 빚이 많이 생겼다. 두 달 전에 아내가 아이들을 데리고 친정으로 갔다. 지금은 원룸에서 혼자 산다.
    석 달 전부터 하루 종일 기분이 가라앉고 우울하다. 좋아하던 낚시도 이제는 아무 재미가 없다. 입맛이 없어서 두 달 사이 몸무게가 육 키로그람 빠졌다. 기운이 없다. 집중이 잘 안 된다. 가족에게 짐만 되는 것 같아 미안하다. 앞으로 나아질 거라는 희망이 없다.
    한 달 전부터 죽고 싶다는 생각이 거의 매일 든다. 구체적인 계획도 세웠다. 그 뒤로 의원 두 곳에서 받은 수면제를 먹지 않고 모아 두었다. 모아 둔 수면제는 서른 알쯤 된다. 이번 주말에 소주와 함께 수면제를 한꺼번에 먹으려고 한다. 아이들에게 남길 편지도 써 두었다. 실제로 시도한 적은 아직 없다. 아이들 생각을 하면 조금 망설여진다. 이런 이야기를 누구에게도 한 적이 없다.
    기분이 들뜨거나 잠을 안 자도 힘이 넘쳤던 적은 없다. 헛것이 보이거나 이상한 소리가 들리지는 않는다. 전에 우울증 치료를 받은 적은 없다. 앓는 병은 없다. 다른 약은 먹지 않는다. 약 알레르기는 없다. 수술이나 입원한 적은 없다.
    어머니가 오래 우울증 약을 드셨다. 가족 중에 스스로 목숨을 끊은 사람은 없다.
    술은 잠이 안 와서 매일 밤 소주 한 병을 마신다. 석 달 전보다 술이 늘었다. 담배는 하루 반 갑을 피운다. 지금은 일을 하지 않는다. 수면제를 더 세게 처방해 주면 좋겠다.
  exams:
    전반적 외관 시진 (General appearance): 면도 안 함, 위생 상태 불량, 눈맞춤 회피, 정신운동 지연(+)
    활력징후 측정 (Vital signs): 128/82mmHg, 84회/분, 16회/분, 36.4°C
    의식·지남력 평가 (Mental status): 명료, 지남력 정상, 말이 느리고 작음
    정동 평가 (Affect): 우울한 정동, 둔마, 눈물 글썽임(+)
    병식 평가 (Insight): 부분적, 잠만 문제라고 생각함
    인지기능 선별검사 (Cognitive screening): 집중력 경도 저하, 기억력 정상
    주간 진정·불안 관찰 (Daytime sedation and anxiety): 진정(-), 불안 경도(+)
    체중 측정 (Body weight): 64kg (두 달 전 70kg)
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(-/-), 황달(-/-)
