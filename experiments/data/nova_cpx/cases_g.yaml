- case_id: S08
  playbook: cough
  opening: 이름은 신재원이고, 나는 마흔일곱 살 남자이다. 두 달 전부터 기침이 나고 속이 쓰려서 병원에 왔다.
  vital_signs: "혈압 : 132/84 mmHg\n맥박 : 76 회/분\n호흡 : 16 회/분\n체온 : 36.6°C\n산소포화도 : 98%"
  script: |
    두 달 반 전부터 마른기침이 계속 난다. 기침은 밤에 누우면 심해진다. 자다가 기침 때문에 깬다. 밥을 많이 먹은 뒤에도 기침이 난다. 가래는 거의 없다. 아침에는 목이 쉬고 목에 뭔가 걸린 느낌이 들어 헛기침을 자주 한다.
    같은 무렵부터 명치가 타는 듯이 쓰리다. 쓰린 느낌이 가슴 가운데로 치밀어 오른다. 쓰린 정도는 열 중에 사 정도이다. 식사하고 한두 시간 뒤나 누우면 더 쓰리다. 신물이 목까지 넘어오고 입이 쓰다. 약국에서 산 제산제를 먹으면 잠깐 나아진다.
    저녁을 밤 열 시쯤 늦게 먹고 바로 눕는 일이 많다. 커피는 하루 세 잔 마신다. 음식을 삼키기 어렵거나 삼킬 때 아프지는 않다. 토한 적은 없다. 변 색깔이 검지는 않다. 몸무게는 이 년 사이 칠 키로그람 늘었다.
    열은 없다. 밤에 식은땀이 나지는 않는다. 숨이 차거나 쌕쌕거리는 소리는 없다. 콧물이나 코가 목 뒤로 넘어가는 느낌은 없다. 걷거나 계단을 오를 때 가슴이 아프지는 않다. 감기를 앓고 나서 기침이 시작된 것은 아니다.
    결핵을 앓은 적은 없고 주변에 결핵 환자도 없다. 천식이나 알레르기 비염은 없다. 혈압약이나 다른 먹는 약은 없다. 약 알레르기는 없다. 이 년 전 건강검진 위내시경에서 위염이 조금 있다고 들었다. 수술이나 입원한 적은 없다.
    아버지가 일흔 살에 위암 수술을 받았다. 담배는 하루 반 갑씩 이십 년 피우다가 오 년 전에 끊었다. 술은 일주일에 세 번 회식에서 소주 두 병씩 마신다. 영업직 회사원이다. 기침이 오래가서 폐에 큰 병이 있는 건 아닌지 걱정이다.
