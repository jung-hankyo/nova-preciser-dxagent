# Local CPX-style practice cases (S series): situations a contest station can bring that the common presentations do
# not cover cleanly (uncovered complaints, a counselling request, a minor, a guardian answering, high suicide risk, an
# emergency behind a common complaint, two complaints at once, pregnancy, a red flag only the history reveals).
# Original text in the kit's case form; `key` is our own answer key (see cases_a.yaml).

- case_id: S01
  playbook: null
  opening: 이름은 최성훈이고, 나는 마흔여덟 살 남자이다. 코를 심하게 골고 낮에 자꾸 졸려서 병원에 왔다.
  vital_signs: "혈압 : 146/94 mmHg\n맥박 : 78 회/분\n호흡 : 16 회/분\n체온 : 36.5°C\n산소포화도 : 96%"
  script: |
    일 년 전부터 아내가 내 코골이가 아주 심해졌다고 한다. 코 고는 소리가 너무 커서 아내는 다른 방에서 잔다. 아내 말로는 자다가 숨을 한참 멈췄다가 컥 하면서 다시 쉰다고 한다. 자다가 숨이 막혀서 놀라 깬 적이 여러 번 있다.
    밤에 소변을 보러 두세 번 깬다. 밤 열두 시에 자서 아침 일곱 시에 일어나는데도 개운하지 않다. 아침에 일어나면 머리가 무겁고 입이 바싹 마른다.
    낮에 너무 졸려서 회의 중에도 꾸벅꾸벅 존다. 한 달 전에는 운전하다가 신호를 기다리며 졸아서 앞차를 박을 뻔했다. 요즘은 집중이 잘 안 되고 짜증이 늘었다.
    잠드는 데는 어려움이 없다. 잠들 때 가위에 눌리거나 웃을 때 갑자기 힘이 빠지는 일은 없다. 자기 전에 다리가 불편하지는 않다. 기분이 우울하지는 않다. 코가 자주 막히지는 않는다.
    삼 년 사이에 몸무게가 십 키로그람 늘었다. 추위를 타거나 변비가 생기지는 않았다.
    이 년 전에 고혈압을 진단받아 혈압약 두 가지를 먹고 있다. 그래도 혈압이 잘 안 떨어진다고 들었다. 당뇨는 없다. 수면제나 안정제는 먹지 않는다. 약 알레르기는 없다. 수술이나 입원한 적은 없다. 아버지도 코를 심하게 고셨다.
    담배는 하루 반 갑씩 이십오 년째 피운다. 술은 일주일에 세 번 저녁에 소주 한 병씩 마신다. 술을 마신 날은 코골이가 더 심하다고 한다.
    영업직 회사원이라 하루에 두세 시간씩 운전한다. 아내와 고등학생 아들과 함께 산다. 운전하다가 사고를 낼까 봐 걱정이다.
  exams:
    전반적 외관 시진 (General appearance): 비만 체형, 하품을 자주 함, 급성 병색(-)
    활력징후 측정 (Vital signs): 146/94mmHg, 78회/분, 16회/분, 36.5°C, SpO2 96%
    신체 계측 (Anthropometry): 키 172cm, 체중 92kg, BMI 31.1kg/m², 목둘레 43cm
    허리둘레 측정 (Waist circumference): 104cm
    의식·지남력 평가 (Mental status): 명료, 지남력 정상
    비강 시진 (Nasal inspection): 비중격 경도 좌측 만곡, 하비갑개 비대(-), 용종(-)
    인두 시진 (Pharynx inspection): 목젖·연구개 늘어짐(+), 편도 비대 1도, Mallampati 4등급
    구강 점막 시진 (Oral mucosa inspection): 혀 비대(+), 하악 후퇴(-)
    갑상선 촉진 (Thyroid palpation): 비대(-), 결절(-)
    경정맥압 측정 (Jugular venous pressure): 상승(-)
    폐 청진 (Lung auscultation): 폐포음 정상, 수포음(-/-), 천명음(-/-)
    심음 청진 (Heart auscultation): S1·S2 규칙적, 심잡음(-)
    하지 말초 진찰 (Peripheral pulse and edema): 족배동맥 맥박 정상(+/+), 부종(-/-)
  key:
    diagnosis: Obstructive sleep apnea
    differential: [Insufficient sleep syndrome, Narcolepsy, Hypothyroidism, Obesity hypoventilation syndrome]
    history: [onset, timing, pmh, meds, fh, smoking, alcohol, job,
              {snoring: "(코골|코를 ?골|코 ?고)", apnea: "(숨을? ?멈|숨이 ?멎|무호흡|숨이 ?막|숨 막)",
               sleepiness: "(졸|낮에|주간)", drowsy_driving: "운전", sleep_hours: "(몇 시간|수면 시간|몇 시에|잠은 얼마)",
               morning_headache: "(두통|머리가? ?(아프|무겁))", nocturia: "(소변|화장실)", weight: "(체중|몸무게|살이)",
               narcolepsy: "(가위|힘이 ?빠|탈력)", mood: "(우울|기분)", sedatives: "(수면제|안정제)"}]
