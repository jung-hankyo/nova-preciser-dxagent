- case_id: S02
  playbook: null
  opening: 이름은 윤미영이고, 나는 마흔세 살 여자이다. 넉 달 전부터 찬 것을 만지면 손가락이 하얗게 변해서 병원에 왔다.
  vital_signs: "혈압 : 116/74 mmHg\n맥박 : 72 회/분\n호흡 : 16 회/분\n체온 : 36.4°C"
  script: |
    넉 달 전 날이 추워질 무렵부터 찬물에 손을 넣으면 손가락이 하얗게 변한다. 냉장고에서 재료를 꺼낼 때도 그렇다. 하얗게 됐다가 파랗게 변하고, 풀리면서 빨개지고 화끈거린다.
    양손 둘째, 셋째, 넷째 손가락이 주로 그렇고 엄지는 괜찮다. 한 번 생기면 십오 분에서 이십 분 정도 간다. 그럴 때 손가락이 저리고 아프며 아픈 정도는 열 중에 오이다. 긴장할 때도 생긴다. 따뜻한 물에 손을 담그면 풀린다. 전에는 이런 일이 없었고 올해 처음 생겼다.
    한 달 전에 오른쪽 둘째 손가락 끝에 작은 상처가 생겼는데 잘 낫지 않고 아프다. 요즘 아침마다 손가락이 소시지처럼 붓고 뻣뻣하다. 손가락 피부가 두꺼워지고 당기는 느낌이라 주먹이 잘 안 쥐어진다.
    석 달 전부터 속이 쓰리고 신물이 올라온다. 밥을 먹으면 가슴 아래쪽에 음식이 걸리는 느낌이 든다. 계단을 올라도 숨이 차지는 않는다. 기침은 없다. 관절이 붓거나 아프지는 않다.
    얼굴에 발진이 생기거나 햇빛에 피부가 예민해지지는 않았다. 입안이 헐지는 않는다. 머리카락이 많이 빠지지는 않는다. 입이나 눈이 마르지는 않는다. 근육에 힘이 빠지지는 않는다. 열은 없다. 몸무게 변화는 없다.
    앓는 병은 없다. 먹는 약은 없다. 혈압약이나 편두통약을 먹은 적은 없다. 약 알레르기는 없다. 수술이나 입원한 적은 없다. 가족 중에 류마티스 같은 병이 있는 사람은 없다.
    담배는 피운 적이 없다. 술은 거의 마시지 않는다. 학교 급식실 조리원이라 찬물과 차가운 재료를 자주 만진다. 진동이 심한 공구를 쓰지는 않는다. 마지막 생리는 이 주 전이었고 주기는 규칙적이다.
    손가락 상처가 덧나서 일을 못 하게 될까 봐 걱정이다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-), 입 주위 주름 경도
    활력징후 측정 (Vital signs): 116/74mmHg, 72회/분, 16회/분, 36.4°C
    피부 시진 (Skin inspection): 양손 손가락 피부 두꺼워지고 광택(+), 우측 둘째 손가락 끝 3mm 궤양(+), 손끝 함몰 흉터(+), 얼굴·손바닥 모세혈관확장(+), 얼굴 발진(-)
    피부 온도·발한 촉진 (Skin temperature and diaphoresis): 양손 손가락 끝 차가움(+), 발한 정상
    손톱 주름 모세혈관 관찰 (Nailfold capillaroscopy): 확장된 모세혈관(+), 모세혈관 소실 부위(+)
    손 관절 촉진 (Hand joint palpation): 손가락 전반적 부종(+), 관절 압통(-), 활막염(-), 주먹 쥐기 불완전
    손목 관절 촉진 (Wrist joint palpation): 부종(-), 압통(-)
    요골동맥 맥박 촉진 (Radial pulse palpation): 양측 정상, 대칭
    양팔 혈압 비교 (Blood pressure in both arms): 우측 116/74mmHg, 좌측 114/72mmHg
    구강 점막 시진 (Oral mucosa inspection): 궤양(-), 건조(-), 입 벌림 경도 제한(+)
    폐 청진 (Lung auscultation): 폐포음 정상, 양측 하부 수포음(-/-)
    심음 청진 (Heart auscultation): S1·S2 규칙적, P2 항진(-), 심잡음(-)
    사지 근력 검사 (Limb muscle power): 근위부·원위부 근력 정상(5/5)
    하지 말초 진찰 (Peripheral pulse and edema): 족배동맥 맥박 정상(+/+), 부종(-/-)
  key:
    diagnosis: Secondary Raynaud phenomenon due to limited cutaneous systemic sclerosis
    differential: [Primary Raynaud phenomenon, Systemic lupus erythematosus, Mixed connective tissue disease,
                   Hand-arm vibration syndrome]
    history: [onset, character, location, timing, aggravating, relieving, prior, pmh, meds, fh, smoking, job,
              {color_change: "(색|하얗|하얘|파랗|퍼렇|빨개|창백)", ulcer: "(상처|궤양|헐어|딱지)",
               skin_tight: "(피부|두꺼|당기|굳)", finger_swelling: "(붓|부어|부종)",
               gi: "(속쓰|속이 ?쓰|신물|삼키|넘어가|걸리|역류)", joint: "관절",
               lupus_screen: "(발진|햇빛|햇볕|입안|구내염|탈모|머리카락)", sicca: "(입이 ?마르|눈이 ?마르|건조|뻑뻑)",
               dyspnea: "(숨이|숨 ?차|숨차)", vibration: "(진동|공구)"}]
    exams: [피부 시진 (Skin inspection), 손 관절 촉진 (Hand joint palpation), 요골동맥 맥박 촉진 (Radial pulse palpation),
            폐 청진 (Lung auscultation)]

- case_id: S03
  playbook: null
  opening: 이름은 장동수이고, 나는 쉰다섯 살 남자이다. 담배를 끊고 싶어서 병원에 왔다.
  vital_signs: "혈압 : 138/86 mmHg\n맥박 : 80 회/분\n호흡 : 16 회/분\n체온 : 36.5°C\n산소포화도 : 96%"
  script: |
    스무 살 때부터 삼십오 년째 담배를 피우고 있다. 지금은 하루에 한 갑씩 피운다. 아침에 눈을 뜨면 오 분 안에 첫 담배를 피운다. 아침 첫 담배를 참기가 가장 힘들다.
    식사 후나 커피를 마실 때 꼭 피운다. 길이 막혀 짜증 날 때 더 피운다. 금연 구역에서는 참기가 힘들다. 감기로 누워 있을 때도 담배를 피웠다. 작년에 궐련형 전자담배로 바꿔 봤지만 다시 일반 담배를 피운다.
    전에 두 번 담배를 끊어 보려고 했다. 오 년 전에는 혼자 참아서 열흘 끊었다가 다시 피웠다. 끊었을 때 짜증이 나고 잠이 안 오고 자꾸 먹어서 살이 쪘다. 금연 약이나 니코틴 패치를 써 본 적은 없다.
    지난달에 친구가 폐암 진단을 받아서 겁이 났다. 손주가 태어나서 담배 냄새를 풍기고 싶지 않다. 이번에는 꼭 끊고 싶고 한 달 안에 시작하고 싶다.
    아침에 기침과 함께 누런 가래가 조금 나온다. 계단을 세 층쯤 오르면 숨이 조금 찬다. 가슴이 아프거나 피를 토한 적은 없다. 몸무게가 줄지는 않았다.
    오 년 전부터 고혈압약을 먹고 있다. 당뇨는 없다. 우울증이나 정신과 치료를 받은 적은 없다. 경련을 한 적은 없다. 약 알레르기는 없다. 수술이나 입원한 적은 없다. 폐암 검사는 받아 본 적이 없다.
    아버지는 담배를 많이 피우셨고 일흔 살에 폐암으로 돌아가셨다.
    술은 일주일에 두 번 소주 한 병씩 마신다. 술을 마시면 담배를 더 많이 피운다. 아내는 담배를 피우지 않는다. 개인택시를 운전하는데 동료 기사들이 대부분 담배를 피운다.
    어떻게 하면 끊을 수 있는지, 도움이 되는 약이 있는지 알고 싶다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-), 손가락 니코틴 착색(+)
    활력징후 측정 (Vital signs): 138/86mmHg, 80회/분, 16회/분, 36.5°C, SpO2 96%
    신체 계측 (Anthropometry): 키 170cm, 체중 72kg, BMI 24.9kg/m²
    구강 점막 시진 (Oral mucosa inspection): 치아 착색(+), 백반(-), 궤양(-)
    경부 림프절 촉진 (Cervical lymph node palpation): 촉지(-/-)
    쇄골상 림프절 촉진 (Supraclavicular lymph node palpation): 촉지(-/-)
    흉곽 시진 (Chest inspection): 대칭, 술통형 가슴(-), 보조호흡근 사용(-)
    폐 청진 (Lung auscultation): 호기 약간 연장, 수포음(-/-), 천명음(-/-)
    곤봉지 확인 (Digital clubbing): (-)
    심음 청진 (Heart auscultation): S1·S2 규칙적, 심잡음(-)
    경동맥 잡음 청진 (Carotid bruit): 잡음(-/-)
    하지 말초 진찰 (Peripheral pulse and edema): 족배동맥 맥박 정상(+/+), 부종(-/-)
