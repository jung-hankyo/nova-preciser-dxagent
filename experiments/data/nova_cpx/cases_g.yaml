- case_id: S07
  playbook: chest_pain
  opening: 이름은 강태호이고, 나는 예순세 살 남자이다. 한 시간 전에 갑자기 가슴이 아파서 병원에 왔다.
  vital_signs: "혈압 : 178/100 mmHg\n맥박 : 106 회/분\n호흡 : 22 회/분\n체온 : 36.5°C\n산소포화도 : 96%"
  script: |
    한 시간 전에 무거운 화분을 들어 옮기다가 갑자기 가슴이 찢어지는 것처럼 아팠다. 처음 아플 때부터 가장 심했다. 아픈 정도는 열 중에 십이다.
    가슴 한가운데서 시작해서 등 쪽 날개뼈 사이로 뻗친다. 지금은 아픈 곳이 허리 쪽으로 내려가는 것 같다. 가만히 있어도 계속 아프다. 숨을 쉬거나 자세를 바꿔도 아픈 건 똑같다. 누르면 아픈 곳은 없다.
    식은땀이 나고 속이 메스껍다. 처음 아플 때 눈앞이 캄캄해지면서 쓰러질 것 같았다. 왼팔이 저리고 차가운 느낌이 든다. 숨이 조금 차다. 기침은 없다. 열은 없다. 다리에 힘이 빠지지는 않았다. 말이 어눌하거나 얼굴이 돌아가지는 않았다.
    전에 이렇게 아팠던 적은 없다. 평소에 운동하거나 계단을 오를 때 가슴이 아프지는 않았다. 최근에 오래 비행기를 타거나 누워 지낸 적은 없다. 다리가 붓지는 않는다.
    십오 년 전에 고혈압을 진단받았다. 일 년 전에 혈압약을 끊었다. 당뇨는 없다. 콜레스테롤이 높다고 들었지만 약은 먹지 않는다. 지금 먹는 약은 없다. 약 알레르기는 없다. 수술이나 입원한 적은 없다.
    아버지는 고혈압이 있었고 뇌출혈로 돌아가셨다. 담배는 하루 한 갑씩 사십 년 피웠다. 술은 일주일에 세 번 소주 한 병씩 마신다. 아파트 경비원으로 일한다. 심장마비가 온 건 아닌지 무섭다.
