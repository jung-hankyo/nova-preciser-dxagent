- case_id: S10
  playbook: back_pain
  opening: 이름은 문성진이고, 나는 마흔두 살 남자이다. 이 주 전부터 허리가 아파서 병원에 왔다.
  vital_signs: "혈압 : 136/84 mmHg\n맥박 : 88 회/분\n호흡 : 16 회/분\n체온 : 36.7°C"
  script: |
    이 주 전에 무거운 택배 상자를 들다가 허리를 삐끗한 뒤로 허리가 아프다. 허리 아래쪽 가운데가 묵직하게 아프다. 아픈 정도는 열 중에 칠이다.
    일주일 전부터 양쪽 엉덩이와 허벅지 뒤쪽으로 통증이 뻗친다. 왼쪽은 종아리와 발바닥까지 저리다. 기침이나 재채기를 하면 허리와 다리가 더 아프다. 누워 있으면 조금 낫다.
    어제부터 항문 주위와 엉덩이 사이에 감각이 둔하다. 휴지로 닦을 때 느낌이 잘 안 난다. 어제부터 소변이 잘 안 나와서 한참 힘을 줘야 나온다. 소변을 보고 나도 시원하지 않다. 오늘 아침에는 나도 모르게 소변이 새서 속옷이 젖었다. 이틀째 대변을 못 봤다. 대변이 마려운 느낌도 잘 모르겠다. 왼쪽 발에 힘이 빠져서 걸을 때 발끝이 끌린다.
    열은 없다. 몸무게가 빠지지는 않았다. 넘어지거나 부딪힌 적은 없다. 암을 앓은 적은 없다. 스테로이드 약을 오래 먹은 적은 없다.
    오 년 전에 허리 디스크라고 진단받고 주사 치료를 받았다. 그때는 다리만 저렸고 소변 문제는 없었다. 약국에서 진통제를 사 먹었지만 듣지 않는다. 당뇨나 고혈압은 없다. 약 알레르기는 없다. 수술한 적은 없다. 가족 중에 특별한 병은 없다.
    담배는 하루 한 갑씩 이십 년 피웠다. 술은 일주일에 한두 번 맥주 두 캔을 마신다. 택배 기사로 하루 종일 무거운 상자를 나른다. 아내와 두 아이와 함께 산다. 일을 쉴 수 없어서 주사를 맞고 빨리 낫고 싶다.
