- case_id: S05
  playbook: fever
  opening: 이름은 김옥순이고, 여든두 살 여자이다. 딸 박혜진, 쉰다섯 살이 보호자로 함께 왔다. 딸은 어머니가 이틀 전부터 열이 나고 어제부터 정신이 오락가락해서 병원에 모시고 왔다.
  vital_signs: "혈압 : 102/58 mmHg\n맥박 : 112 회/분\n호흡 : 22 회/분\n체온 : 38.8°C\n산소포화도 : 95%"
  script: |
    딸이 대답한다. 어머니는 이틀 전부터 열이 나고 오한으로 덜덜 떠셨다. 집에서 잰 체온은 삼십팔 도 칠 부였다. 해열제를 드리면 잠깐 내렸다가 다시 오른다.
    어제 저녁부터 엉뚱한 소리를 하시고 나를 언니라고 부르셨다. 밤새 잠을 안 주무시고 집에 가야 한다며 돌아다니셨다. 벽에 벌레가 기어 다닌다고 하셨다. 낮에는 자꾸 조시고 불러야 겨우 눈을 뜨신다. 정신이 맑았다가 다시 흐려지기를 반복한다.
    평소에는 혼자 사시면서 밥도 하시고 시장도 다니셨다. 평소 기억력은 나이에 비해 괜찮은 편이었다.
    나흘 전부터 소변을 자주 보시고 볼 때 따갑다고 하셨다. 소변 색이 탁하고 냄새가 심하다. 어제부터 소변을 옷에 지리신다. 오른쪽 옆구리가 아프다고 하셨다.
    이틀 동안 식사를 거의 못 하셨다. 물도 잘 안 드신다. 어제 한 번 토하셨다. 설사는 없다. 기침이나 가래는 없다. 숨차 하시지는 않는다.
    넘어지거나 머리를 다치신 적은 없다. 한쪽 팔다리에 힘이 빠지거나 말이 어눌해지지는 않았다. 경련은 없었다. 목이 뻣뻣하다고 하지는 않으셨다.
    십오 년 전부터 고혈압약과 당뇨약을 드신다. 오늘 아침 집에서 잰 혈당은 이백오십이었다. 요즘 새로 드시기 시작한 약은 없다. 수면제나 감기약을 따로 드리지는 않았다. 작년에 방광염으로 치료받으셨다. 약 알레르기는 없다. 십 년 전에 백내장 수술을 받으셨다.
    담배는 안 피우신다. 술도 안 드신다. 가족 중에 특별한 병은 없다. 나는 근처에 살면서 매일 들른다. 갑자기 치매가 온 건 아닌지 걱정된다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(+), 기면, 불러야 눈을 뜸
    의식·지남력 평가 (Mental status): 기면, 시간·장소 지남력 장애(+), 딸은 알아봄
    주의력 검사 (Attention test): 요일 거꾸로 말하기 못함, 주의력 저하(+)
    활력징후 측정 (Vital signs): 102/58mmHg, 112회/분, 22회/분, 38.8°C, SpO2 95%
    구강 점막 시진 (Oral mucosa inspection): 건조(+)
    피부 긴장도 확인 (Skin turgor): 감소(+)
    경부 강직 (Neck stiffness): 강직(-)
    폐 청진 (Lung auscultation): 폐포음 정상, 수포음(-/-)
    심음 청진 (Heart auscultation): S1·S2 규칙적 빈맥, 심잡음(-)
    복부 촉진 (Abdominal palpation): 치골상부 압통(+), 반발압통(-)
