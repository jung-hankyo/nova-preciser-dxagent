- case_id: S04
  playbook: abdominal_pain
  opening: 이름은 이서연이고, 나는 열여섯 살 여자이다. 오늘 아침부터 아랫배가 아파서 병원에 왔다.
  vital_signs: "혈압 : 94/58 mmHg\n맥박 : 116 회/분\n호흡 : 20 회/분\n체온 : 36.8°C"
  script: |
    오늘 아침 학교에서 갑자기 왼쪽 아랫배가 칼로 찌르듯이 아프기 시작했다. 지금은 아랫배 전체가 아프다. 아픈 정도는 열 중에 팔이다. 아픈 게 계속된다. 걷거나 움직이면 더 아프다. 누워서 무릎을 구부리고 있으면 조금 낫다.
    일주일 전부터 왼쪽 아랫배가 가끔 살살 아팠다. 한 시간 전부터 오른쪽 어깨 끝이 뻐근하다. 일어서면 어지럽고 화장실에서 쓰러질 뻔했다. 대변이 마려운 느낌이 계속 든다. 속이 메스껍지만 토하지는 않았다. 설사는 없다.
    열은 없다. 소변볼 때 아프지는 않다. 냉이 늘거나 냄새가 나지는 않는다.
    마지막 생리는 칠 주 전에 시작했다. 생리는 원래 불규칙해서 삼십오 일에서 사십오 일마다 한다. 그래서 생리가 늦어도 별로 신경 쓰지 않았다. 닷새 전부터 갈색 피가 속옷에 조금씩 묻어 나온다. 요즘 가슴이 붓고 아프다.
    육 개월 전부터 사귀는 남자친구와 성관계를 한다. 콘돔을 쓰지 않은 적이 몇 번 있다. 임신 테스트는 무서워서 해 보지 않았다. 임신한 적은 없다. 산부인과 진료를 받아 본 적은 없다.
    앓는 병은 없다. 먹는 약은 없다. 아침에 타이레놀 한 알을 먹었는데 소용없었다. 약 알레르기는 없다. 수술이나 입원한 적은 없다. 가족 중에 특별한 병은 없다. 담배는 피우지 않는다. 술은 마시지 않는다.
    고등학교 일학년이고 부모님과 함께 산다. 엄마는 내가 남자친구와 성관계한 것을 모른다. 엄마한테는 말하지 말아 주었으면 좋겠다. 혹시 임신이면 어떡하나 무섭다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(+), 창백(+), 식은땀(+), 배를 감싸고 웅크림
    활력징후 측정 (Vital signs): 94/58mmHg, 116회/분, 20회/분, 36.8°C
