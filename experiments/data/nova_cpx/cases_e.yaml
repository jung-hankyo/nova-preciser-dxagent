    닷새 전부터 그러기 시작했다. 아프기 시작한 것은 닷새 전부터이다. 처음에는 오른쪽 등과 옆구리가 화끈거리고 바늘로 찌르듯이 아팠다. 지금은 화끈거리면서 따끔따끔하게 아프다. 처음에는 담이 결린 줄 알고 등에 파스를 붙였다. 물집은 이틀 전에 생겼다. 아픈 자리를 따라 붉은 반점이 생기고 그 위에 좁쌀 같은 물집이 모여서 났다. 물집은 등에서 오른쪽 가슴 밑까지 띠처럼 이어져 있다. 왼쪽에는 아무것도 없다. 물집이 점점 늘어나고 일부는 탁해졌다. 아픈 정도는 열 중에 칠이다. 옷이 스치기만 해도 아프다. 밤에 더 아파서 잠은 잘 못 잔다. 조금 가려운 느낌도 있다. 다른 곳에는 물집이 없다. 얼굴이나 눈에는 이상이 없다.
    열은 없지만 몸이 조금 으슬으슬하다. 기침이나 숨찬 것은 없다. 걷거나 힘을 쓸 때 가슴이 조이지는 않는다. 밥을 먹은 뒤에 배가 아프지는 않다. 새로 먹은 약이나 음식은 없다. 파스는 이틀 전에 뗐다. 전에도 이런 물집이 생긴 적은 없다. 어릴 때 수두를 앓았다고 들었다. 예방접종은 해마다 독감 주사만 맞는다.
    앓고 있는 병은 당뇨와 고혈압이다. 팔 년 전부터 당뇨가 있어서 약을 먹고 있다. 고혈압도 있어서 혈압약을 먹는다. 평소에 먹는 약이 당뇨약과 혈압약 두 가지 있다. 스테로이드나 면역을 떨어뜨리는 약은 먹지 않는다. 암을 앓은 적은 없다. 약 알레르기는 없다. 수술이나 입원한 적은 없다. 마지막 생리는 쉰두 살 때였다. 가족 중에 특별한 병은 없다. 담배는 피우지 않고 술도 마시지 않는다.
    직업이 없고 집안일을 한다. 남편과 함께 산다. 낮에는 열 달 된 손주 아이를 돌봐 준다. 가장 걱정되는 것은 손주에게 옮기는 것이다. 아파서 잠을 못 자겠다.
