- case_id: M27
  playbook: weight_gain
  opening: 이름은 오말순이고, 나는 예순세 살 여자이다. 넉 달 전부터 살이 많이 쪄서 병원에 왔다.
  vital_signs: "혈압 : 158/94 mmHg\n맥박 : 82 회/분\n호흡 : 16 회/분\n체온 : 36.5°C"
  script: |
    넉 달 전부터 그러기 시작했다. 넉 달 전부터 살이 찌기 시작했다. 체중은 넉 달 사이에 칠 키로그람이 늘었다. 몸무게가 오십팔 키로그람에서 육십오 키로그람으로 늘었다. 주로 배에 살이 찌고 팔다리는 오히려 가늘어졌다. 얼굴이 동그랗게 붓고 붉어져서 이웃들이 달덩이 같다고 한다. 딸이 내 목 뒤가 두툼해졌다고 한다. 요즘 입맛이 좋아서 밥을 많이 먹는다. 식욕이 늘어서 늘 배가 고프다. 배와 허벅지에 보라색 줄무늬가 생겼다. 살갗이 얇아지고 팔에 멍이 잘 든다. 쪼그려 앉았다가 일어나거나 계단을 오를 때 다리에 힘이 없다. 저녁이 되면 발목이 조금 붓는다. 잠은 잘 못 잔다. 신경이 날카로워졌다. 요즘 목이 자주 마르고 소변을 자주 본다. 지난달 보건소 검진에서 혈압과 당이 높다는 말을 처음 들었다. 전에는 살이 이렇게 찐 적이 없었다.
    추위를 타거나 목소리가 쉬지는 않았다. 변비는 없다. 숨이 차거나 누우면 숨이 막히지는 않는다. 소변에 거품이 많지는 않다. 기분이 우울하지는 않다.
    앓고 있는 병은 무릎 관절염이다. 오 년 전에 무릎 관절염을 진단받았다. 평소에 먹는 약이 시장에서 산 관절약 하나 있다. 여섯 달 전부터 그 관절약을 하루 두 번 먹고 있다. 그 약은 이웃이 소개해 준 사람에게 시장에서 샀다. 약 이름은 모르고 봉지에 하얀 알약이 들어 있다. 그 약을 먹으면 무릎이 하나도 안 아프다. 병원에서 처방받은 약은 없다. 한약이나 건강식품은 먹지 않는다. 약 알레르기는 없다. 수술이나 입원한 적은 없다. 마지막 생리는 쉰 살 때였다. 가족 중에 어머니가 당뇨를 앓으셨다.
    담배는 피우지 않고 술도 마시지 않는다. 운동은 따로 하지 않지만 밭일을 한다. 직업이 따로 없고 집안일과 밭일을 한다. 남편과 함께 산다. 가장 걱정되는 것은 살이 계속 찌고 얼굴이 변하는 것이다. 무릎이 안 아픈 그 관절약은 계속 먹고 싶다.
