# CPX-style practice cases M22-M29 (original text, format of cases_a.yaml): altered consciousness, anxiety, seizure,
# tremor, weakness/numbness, weight gain, easy bruising, rash.

- case_id: M22
  playbook: altered_consciousness
  opening: 이름은 한정숙이고, 나는 쉰일곱 살 여자이다. 남편 김영철, 예순 살이 보호자로 함께 왔다. 남편은 아내가 이틀 전부터 자꾸 졸려 하고 엉뚱한 말을 하더니 오늘은 깨워도 잘 일어나지 못해서 데리고 왔다.
  vital_signs: "혈압 : 104/62 mmHg\n맥박 : 68 회/분\n호흡 : 18 회/분\n체온 : 36.8°C\n산소포화도 : 97%"
  script: |
    남편이 대답한다. 아내는 사흘 전부터 그러기 시작했다. 처음에는 낮에 자꾸 졸고 밤에는 잠을 안 자고 서성였다. 이틀 전부터 말이 느려지고 엉뚱한 소리를 했다. 딸 이름을 헷갈리고 텔레비전 리모컨을 쓸 줄 몰랐다. 어제는 오늘이 며칠인지, 여기가 어디인지 잘 몰랐다. 오늘 아침에는 큰 소리로 불러야 눈을 떴다가 다시 잠든다. 갑자기 그런 게 아니라 며칠 동안 점점 심해졌다.
    대변은 나흘째 보지 못했다. 마지막으로 대변을 본 것은 나흘 전이다. 약은 잘 챙겨 먹었는데 듀파락 시럽은 설사가 귀찮다고 이 주 전에 끊었다. 열은 없었다. 토하거나 피를 토한 적은 없다. 검은 변이나 피 섞인 변은 보지 않았다. 배가 아프다고 하지는 않았다. 일주일 전부터 눈이 더 노래졌다. 소변은 평소처럼 본다. 이틀 전부터 입맛이 없어서 죽을 조금씩 먹었다.
    넘어지거나 머리를 다친 적은 없다. 경련을 하지는 않았다. 한쪽 팔다리에 힘이 빠지거나 입이 돌아가지는 않았다. 수면제나 신경안정제는 먹지 않았다.
    아내가 앓고 있는 간 질환은 간경화이다. 이십 년 전에 B형 간염 보균자라는 말을 들었다. 삼 년 전에 대학병원에서 간경화를 진단받았다. 배에 물이 차서 이뇨제를 먹고 있다. 일 년 전에 식도 정맥이 부풀어서 내시경으로 묶는 시술을 받았다. 여덟 달 전에도 이렇게 정신이 흐려져서 입원했는데 간성혼수라고 들었다. 평소에 먹는 약이 바라크루드, 알닥톤, 라식스, 인데놀 네 가지 있다. 당뇨는 없다. 약 알레르기는 없다. 수술은 받은 적이 없다.
    술은 마시지 않는다. 담배는 피우지 않는다. 가족 중에 장모님이 간암을 앓다가 돌아가셨다. 마지막 생리는 쉰 살 때였다. 아내는 직업이 없고 집안일을 한다. 나와 함께 둘이 산다. 가장 걱정되는 것은 머리에 큰 문제가 생긴 게 아닐까 하는 것이다.
  exams:
    전반적 외관 시진 (General appearance): 기면 상태, 큰 소리에 눈을 뜸, 황달(+), 복부 팽만(+)
    의식·지남력 평가 (Mental status): 기면, GCS 13점(E3 V4 M6), 시간·장소 지남력 저하(+), 사람 지남력 유지
    활력징후 측정 (Vital signs): 104/62mmHg, 68회/분, 18회/분, 36.8°C, 산소포화도 97%
    주의력 검사 (Attention test): 거꾸로 숫자 세기 수행 불가, 주의력 저하(+)
    퍼덕떨림 확인 (Asterixis): 양측 퍼덕떨림(+/+)
    결막·공막 시진 (Conjunctiva and sclera inspection): 공막 황달(+/+), 창백(-/-)
    동공 반사 (Pupillary reflex): 양측 3mm 동일, 대광반사(+/+)
    경부 강직 (Neck stiffness): 강직(-)
    피부 시진 (Skin inspection): 앞가슴 거미혈관종(+), 손바닥 홍반(+), 멍(-)
    복수 이동탁음 확인 (Shifting dullness (ascites)): 이동탁음(+)
    복부 촉진 (Abdominal palpation): 압통(-), 반발압통(-)
    간·비장 촉진 (Liver and spleen palpation): 간 촉지(-), 비장 좌늑골하 2횡지 촉지(+)
    사지 근력 검사 (Limb muscle power): 지시에 느리게 따르나 좌우 대칭, 편측 마비(-)
    바빈스키 징후 (Babinski sign): (-/-)
    직장수지검사 (Digital rectal examination): 직장 내 단단한 대변(+), 흑색변(-), 혈변(-)
    하지 함요부종 확인 (Pitting edema of the legs): 양측 발목 함요부종(1+/1+)
  key:
    diagnosis: Hepatic encephalopathy (overt, West Haven grade 3) in hepatitis B liver cirrhosis, precipitated by constipation after stopping lactulose
    differential: ["Hypoglycemia", "Intracranial hemorrhage (subdural hematoma)", "Spontaneous bacterial peritonitis or other infection",
                   "Hyponatremia or hypokalemia from diuretics"]
    history: [onset, prior, pmh, meds, alcohol, fh,
              {course: "(점점|갑자기|서서히|진행|나빠)", sleep_wake: "(잠을|잠이|수면|낮에|밤에|졸)",
               liver: "(간염|간경|간 질환|간질환|간암|간 수치|간 기능|복수|배에 물)", stool: "(대변|변비|변을|배변|화장실)",
               lactulose: "(듀파락|시럽|락툴|끊|중단|빠뜨|거르|거른|잘 (드시|드셨|챙기|챙겨|먹))",
               gi_bleed: "(검은|짜장|토혈|피를 토|혈변|피가 섞|피 섞)", fever: "(열이|열은|열나|열 나|오한|체온)",
               head_trauma: "(넘어|머리를 (다치|부딪)|낙상|부딪)", sedatives: "(수면제|안정제|진정제)",
               focal: "(한쪽|마비|힘이 빠|입이 돌|발음|어눌)", seizure: "(경련|발작)", jaundice: "(노랗|노래|황달)"}]
    exams: [퍼덕떨림 확인 (Asterixis), 의식·지남력 평가 (Mental status), 복수 이동탁음 확인 (Shifting dullness (ascites)),
            직장수지검사 (Digital rectal examination), 사지 근력 검사 (Limb muscle power)]

- case_id: M23
  playbook: anxiety
  opening: 이름은 윤소희이고, 나는 서른한 살 여자이다. 석 달 전부터 갑자기 죽을 것 같은 불안이 몰려오는 일이 반복돼서 병원에 왔다.
  vital_signs: "혈압 : 118/74 mmHg\n맥박 : 84 회/분\n호흡 : 16 회/분\n체온 : 36.6°C"
  script: |
    석 달 전부터 그러기 시작했다. 처음 시작된 것은 출근길 지하철 안이었다. 갑자기 심장이 터질 듯이 두근거리는 증상이 왔다. 숨이 막히고 가슴이 조였다. 손발이 저리고 식은땀이 났다. 어지럽고 내 몸이 내 것이 아닌 것처럼 멍했다. 죽을 것 같은 느낌이 들어서 무서웠다. 미쳐 버릴 것 같기도 했다. 십 분 안에 가장 심해진다. 한 번 그러면 삼십 분쯤 지속되다가 가라앉는다. 그날 응급실에서 심전도와 피 검사를 했는데 정상이라고 들었다. 전에는 이런 적이 한 번도 없었다.
    그 뒤로 여덟 번쯤 더 그랬다. 요즘은 일주일에 두 번 정도로 자주 그런다. 특별한 상황에서 생기는 게 아니고 이유 없이 갑자기 생긴다. 집에서 텔레비전을 보다가 생긴 적도 있다. 자다가 그래서 깬 적도 있다. 발작이 없을 때도 또 그럴까 봐 하루 종일 걱정된다. 지하철과 버스는 피하고 택시를 타고 출근한다. 사람이 많은 곳이 무서워서 친구 결혼식에도 가지 않았다.
    정신을 잃고 쓰러진 적은 없다. 평소에 운동할 때 가슴이 아프거나 숨이 차지는 않다. 더위를 타거나 몸무게가 빠지지는 않았다. 평소에 손이 떨리거나 설사를 하지는 않는다. 두통은 없다.
    커피는 하루 두 잔 마시다가 요즘 한 잔으로 줄였다. 에너지 음료나 다이어트 약은 먹지 않는다. 술은 얼마 안 마시고 주말에 맥주 한두 캔 정도이다. 담배는 피우지 않는다.
    요즘 잠은 잘 못 자고 자주 깬다. 기분이 조금 처지기는 하지만 친구를 만나면 즐겁다. 죽고 싶다는 생각은 해 본 적이 없다. 반년 전에 팀장이 되면서 야근이 많아져 스트레스가 심하다. 직업이 회사원이고 마케팅 일을 한다. 함께 사는 사람 없이 혼자 산다.
    앓고 있는 병이나 지병은 없다. 먹는 약은 따로 없다. 불안할 때 우황청심원을 몇 번 먹었다. 약 알레르기는 없다. 마지막 생리는 열흘 전이었고 생리는 규칙적이다. 임신 가능성은 없다. 가족 중에 어머니가 오래전부터 불안이 심해서 신경정신과 약을 드신다. 가장 걱정되는 것은 심장에 문제가 있을지도 모른다는 것이다. 다시 지하철을 편하게 타고 싶다.
  exams:
    전반적 외관 시진 (General appearance): 다소 긴장한 모습, 급성 병색(-)
    활력징후 측정 (Vital signs): 118/74mmHg, 84회/분, 16회/분, 36.6°C
    의식·지남력 평가 (Mental status): 명료, 지남력 정상
    정동 평가 (Affect): 불안한 정동, 사고 흐름 정상, 자살 사고(-)
    피부 온도·발한 촉진 (Skin temperature and diaphoresis): 피부 온도 정상, 발한(-)
    갑상선 안징후 검사 (Thyroid eye signs): 안구돌출(-), 눈꺼풀 지연(-)
    갑상선 촉진 (Thyroid palpation): 비대(-), 결절(-), 압통(-)
    자세성 떨림 (Postural tremor): 떨림(-)
    요골동맥 맥박 촉진 (Radial pulse palpation): 84회/분, 규칙적
    심음 청진 (Heart auscultation): S1·S2 규칙적, 심잡음(-), 수축기 클릭(-)
    폐 청진 (Lung auscultation): 폐포음, 천명음(-/-), 수포음(-/-)
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(-/-), 황달(-/-)
    심부건반사 (Deep tendon reflex): 정상(2+), 대칭
  key:
    diagnosis: Panic disorder (with developing agoraphobic avoidance)
    differential: ["Hyperthyroidism", "Paroxysmal supraventricular tachycardia", "Pheochromocytoma",
                   "Substance-induced anxiety (caffeine, stimulant diet pills)"]
    history: [onset, character, timing, aggravating, pmh, meds, fh, alcohol, job, lmp,
              {fear: "(죽을|미칠|통제|무서)", physical_sx: "(두근|숨이|가슴|저리|땀|어지)",
               peak_duration: "(몇 분|얼마나 (오래|지속)|가라앉|최고조|가장 심)", trigger: "(계기|유발|어떤 상황|이유|지하철|어디서)",
               anticipatory: "(또 (그럴|생길|올)|걱정|예기)", avoidance: "(피하|회피|대중교통|버스|사람 많|외출)",
               workup: "(응급실|검사|심전도)", caffeine: "(커피|카페인|에너지 음료|음료)", diet_pills: "(다이어트|살 빼|식욕 억제|한약|각성)",
               thyroid: "(갑상선|더위|몸무게|체중|살이 빠)", mood: "(우울|기분|흥미|즐겁)", suicide: "(죽고 싶|자살|자해|해치)"}]
    exams: [갑상선 촉진 (Thyroid palpation), 심음 청진 (Heart auscultation), 정동 평가 (Affect), 활력징후 측정 (Vital signs)]

- case_id: M24
  playbook: seizure
  opening: 이름은 강민재이고, 나는 열아홉 살 남자이다. 어제 아침 기숙사에서 쓰러져 경련을 했다고 해서 병원에 왔다.
  vital_signs: "혈압 : 122/72 mmHg\n맥박 : 76 회/분\n호흡 : 16 회/분\n체온 : 36.7°C"
  script: |
    어제 아침 일곱 시쯤 기숙사에서 양치를 하다가 쓰러져 경련을 했다고 한다. 나는 그때 일이 전혀 기억나지 않는다. 같은 방 친구가 봤는데 갑자기 소리를 지르며 쓰러지더니 온몸이 뻣뻣해졌다고 했다. 그다음 양쪽 팔다리를 규칙적으로 떨었다고 했다. 경련은 일이 분 동안 했다고 한다. 눈이 위로 돌아가고 입에서 거품이 나왔다고 했다. 한쪽부터 떨리기 시작하지는 않았다고 했다. 정신이 돌아오는 데 이십 분쯤 걸렸다고 한다. 그동안 멍하게 엉뚱한 말을 했다고 한다. 정신이 들었을 때 바지에 소변을 지려 있었다. 혀를 깨물어서 오른쪽 옆이 지금도 아프다. 그날 온몸이 쑤시고 머리가 무거웠다. 쓰러지기 직전에 이상한 냄새나 느낌 같은 전조는 없었다. 응급실에서 머리 씨티와 피 검사를 받았는데 정상이라고 들었다. 전에는 이렇게 쓰러지거나 경련을 한 적이 없었다.
    일 년 전부터 아침에 일어나고 얼마 안 돼서 팔이 깜짝 놀라듯 움찔하는 일이 가끔 있다. 그럴 때 핸드폰이나 숟가락을 떨어뜨린 적이 여러 번 있다. 움찔할 때 정신을 잃지는 않는다. 잠을 못 잔 다음 날 아침에 더 자주 그런다. 중간고사 때문에 밤을 새우다시피 해서 잠이 많이 부족했다. 이틀 동안 잠은 잘 못 자고 세 시간밖에 못 잤다. 그동안 에너지 음료를 하루 세 캔씩 마셨다.
    열이나 두통은 없었다. 최근에 머리를 부딪치거나 다친 적은 없다. 어릴 때 열성경련을 하거나 뇌수막염을 앓은 적은 없다. 태어날 때 문제는 없었고 발달도 정상이었다. 앓고 있는 병이나 지병은 없다. 먹는 약은 따로 없다. 약 알레르기는 없다. 가족 중에 사촌 형이 뇌전증으로 약을 먹고 있다.
    술은 한 달에 두세 번 맥주 두세 캔 마시는 편이다. 쓰러지기 전날에는 술을 마시지 않았다. 담배는 피우지 않는다. 마약이나 다른 약은 해 본 적이 없다. 직업이 대학생이고 일 학년이다. 기숙사에서 친구와 함께 산다. 운전면허가 있어서 주말에 가끔 아버지 차로 운전을 한다. 가장 걱정되는 것은 또 쓰러지는 것이다. 운전을 계속해도 되는지 궁금하다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-), 피곤해 보임
    의식·지남력 평가 (Mental status): 명료, 지남력 정상
    활력징후 측정 (Vital signs): 122/72mmHg, 76회/분, 16회/분, 36.7°C
    혀 시진 (Tongue inspection): 혀 우측 가장자리 교상 및 부종(+)
    경부 강직 (Neck stiffness): 강직(-)
    동공 반사 (Pupillary reflex): 양측 동일, 대광반사(+/+)
    안저 검사 (Fundoscopy): 유두부종(-)
    안면 근력 검사 (Facial muscle strength (CN VII)): 대칭, 마비(-)
    사지 근력 검사 (Limb muscle power): 상하지 근력 5/5, 좌우 대칭
    심부건반사 (Deep tendon reflex): 정상(2+), 대칭
