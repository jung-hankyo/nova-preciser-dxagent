- case_id: M28
  playbook: easy_bruising
  opening: 이름은 정우진이고, 나는 스물두 살 남자이다. 일주일 전부터 다리에 멍이 잘 들어서 병원에 왔다.
  vital_signs: "혈압 : 118/72 mmHg\n맥박 : 78 회/분\n호흡 : 16 회/분\n체온 : 36.6°C"
  script: |
    일주일 전부터 그러기 시작했다. 일주일 전부터 멍이 들기 시작했다. 일주일 전에 양쪽 정강이와 발목에 깨알 같은 빨간 점이 잔뜩 생긴 것을 처음 봤다. 빨간 점은 가렵거나 아프지 않고 튀어나와 있지 않다. 부딪친 적이 없는데 허벅지와 팔에 손바닥만 한 멍이 여러 개 생겼다. 멍이 드는 곳은 주로 허벅지와 팔이다. 닷새 전부터 양치할 때 잇몸에서 피가 난다. 이번 주에 코피가 두 번 났고 멎는 데 십오 분쯤 걸렸다. 어제 볼 안쪽에 검붉은 피 물집이 생겼다. 소변 색은 평소와 같다. 검은 변이나 피 섞인 변은 본 적이 없다. 피를 토한 적은 없다. 두통은 없고 눈도 잘 보인다. 전에는 이런 적이 없었다.
    삼 주 전에 목이 아프고 콧물이 나는 감기를 나흘 앓았다. 그때 열이 조금 났다. 지금은 감기가 나았고 열은 없다. 그때 약국에서 종합감기약을 사서 사흘 먹었다. 아스피린이나 소염진통제는 먹지 않았다. 최근에 새로 먹기 시작한 약이나 건강식품은 없다. 최근에 예방접종을 맞은 적은 없다. 몸무게가 빠지거나 밤에 식은땀이 나지는 않는다. 피곤하거나 숨이 차지는 않는다. 뼈가 쑤시지는 않는다. 목이나 겨드랑이에 멍울이 만져지지는 않는다. 관절이 붓거나 아픈 곳은 없다.
    어릴 때부터 멍이 잘 들거나 코피가 자주 난 적은 없다. 작년에 사랑니를 뺐을 때 피가 금방 멎었다. 앓고 있는 병이나 지병은 없다. 먹는 약은 따로 없다. 약 알레르기는 없다. 간이 안 좋다는 말을 들은 적은 없다. 가족 중에 피가 잘 안 멎는 사람은 없다.
    술은 한 달에 두 번 맥주 두세 캔 마시는 편이다. 담배는 삼 년째 하루 반 갑씩 피우고 있다. 직업이 대학생이고 삼 학년이다. 부모님과 함께 산다. 운동은 주말마다 친구들과 농구를 한다. 가장 걱정되는 것은 피가 안 멎는 큰 병일까 하는 것이다. 다음 주 농구 대회에 나가도 되는지 궁금하다.
