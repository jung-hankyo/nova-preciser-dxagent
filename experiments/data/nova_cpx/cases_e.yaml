- case_id: M25
  playbook: tremor
  opening: 이름은 박상철이고, 나는 예순일곱 살 남자이다. 일 년 전부터 오른손이 떨려서 병원에 왔다.
  vital_signs: "혈압 : 134/82 mmHg\n맥박 : 72 회/분\n호흡 : 16 회/분\n체온 : 36.4°C"
  script: |
    일 년 전부터 그러기 시작했다. 오른손은 일 년 전부터 떨리기 시작했다. 떨리는 쪽은 오른쪽이다. 가만히 무릎 위에 손을 올려놓고 있을 때 떨린다. 엄지와 검지로 알약을 비비듯이 떨린다. 컵 같은 물건을 잡을 때는 오히려 덜 떨린다. 긴장하거나 걸을 때 더 떨린다. 잘 때는 떨리지 않는다. 석 달 전부터는 오른쪽 다리도 가끔 떨린다. 왼손은 떨리지 않는다. 떨림은 조금씩 심해지고 있다.
    요즘 동작이 느려져서 단추를 잠그는 데 오래 걸린다. 글씨가 점점 작아진다. 걸음걸이가 느려지고 보폭이 좁아졌다고 아내가 말한다. 걸을 때 오른팔을 덜 흔든다. 의자에서 일어나거나 돌아설 때 시간이 걸린다. 넘어진 적은 없다. 아내가 내 얼굴이 무표정해지고 목소리가 작아졌다고 한다.
    몇 년 전부터 냄새를 잘 맡지 못한다. 오래전부터 변비가 있어서 사나흘에 한 번 대변을 본다. 몇 년 전부터 자다가 잠꼬대로 소리를 지르고 발길질을 한다고 아내가 말한다. 기억력은 괜찮고 헛것이 보이지는 않는다. 일어설 때 어지럽지는 않다. 소변 실수는 없다. 술을 마셔도 떨림은 줄지 않는다. 더위를 타거나 몸무게가 줄지는 않았다.
    앓고 있는 병은 고혈압이다. 팔 년 전에 고혈압을 진단받았다. 평소에 먹는 약이 혈압약 하나 있다. 위장약이나 소화제, 어지럼증 약, 정신과 약을 오래 먹은 적은 없다. 뇌졸중을 앓거나 머리를 다친 적은 없다. 약 알레르기는 없다. 가족 중에 손이 떨리는 사람은 없다. 담배는 피운 적이 없다. 술은 한 달에 한두 번 막걸리 한 잔 마시는 편이다. 직업이 농부이고 삼십 년 동안 사과 과수원 일을 했다. 과수원에서 농약을 직접 뿌렸다. 아내와 함께 둘이 산다. 가장 걱정되는 것은 큰 병이 아닐까 하는 것이다. 떨리고 느려져서 일상생활이 불편하다.
  exams:
    전반적 외관 시진 (General appearance): 표정 감소(+), 눈 깜빡임 감소(+), 목소리 작음
    활력징후 측정 (Vital signs): 134/82mmHg, 72회/분, 16회/분, 36.4°C
    의식·지남력 평가 (Mental status): 명료, 지남력 정상
    떨림·서동 관찰 (Resting tremor and bradykinesia): 우측 손 안정 시 떨림(4-5Hz, 환약말이 양상)(+), 손가락 두드리기 우측에서 느려지고 진폭 감소(+), 좌측 정상
    자세성 떨림 (Postural tremor): 팔을 뻗으면 수 초 뒤 우측에 다시 나타나는 떨림 경도(+), 좌측(-)
    근긴장도 평가 (Muscle tone): 우측 손목·팔꿈치 톱니바퀴 경축(+), 좌측 정상
    보행 관찰 (Gait): 보폭 감소, 우측 팔 흔들림 감소(+), 돌 때 여러 걸음, 동결(-)
    후방 당김 검사 (Pull test (postural instability)): 한 걸음 물러난 뒤 스스로 회복, 정상
    손가락-코 검사 (Finger-to-nose test): 정상, 의도 떨림(-)
    외안근 운동 (Extraocular movement): 정상, 수직 주시 제한(-)
    기립성 혈압 측정 (Orthostatic BP): 누운 자세 136/82mmHg → 선 자세 3분 132/80mmHg, 기립성 저혈압(-)
    인지기능 선별검사 (Cognitive screening): 간이정신상태검사 28/30
    갑상선 촉진 (Thyroid palpation): 비대(-), 결절(-)
    심부건반사 (Deep tendon reflex): 정상(2+), 대칭
    바빈스키 징후 (Babinski sign): (-/-)
