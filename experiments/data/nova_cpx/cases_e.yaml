               progression: "(점점|심해지|진행|나빠)", slowness: "(느려|느리|굼뜨|동작|단추)", handwriting: "글씨",
               gait_falls: "(걸음|걸을|걷|보폭|넘어)", face_voice: "(표정|목소리|말소리)", smell: "(냄새|후각)",
               constipation: "(변비|대변)", rbd: "(꿈|잠꼬대|소리를 지르|발길질|자다가)",
