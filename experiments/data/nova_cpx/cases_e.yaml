- case_id: M26
  playbook: weakness_numbness
  opening: 이름은 최병욱이고, 나는 예순한 살 남자이다. 한 시간 반 전에 갑자기 왼쪽 팔다리에 힘이 빠져서 병원에 왔다.
  vital_signs: "혈압 : 172/98 mmHg\n맥박 : 96 회/분\n호흡 : 18 회/분\n체온 : 36.6°C\n산소포화도 : 96%"
  script: |
    오늘 아침 일곱 시 반부터 그러기 시작했다. 아침을 먹다가 갑자기 왼손에 힘이 빠져서 숟가락을 떨어뜨렸다. 힘이 빠지기 시작한 것은 지금부터 한 시간 반 전이다. 일어나려는데 왼쪽 다리에도 힘이 없어서 끌렸다. 아내가 내 왼쪽 입꼬리가 처지고 발음이 어눌하다고 했다. 밥을 먹기 직전까지는 멀쩡했다. 한순간에 생겼고 그 뒤로 좋아지지도 나빠지지도 않았다. 지금 왼팔은 겨우 들 수 있고 왼쪽 다리는 부축하면 걸을 수 있다. 왼쪽 팔다리와 얼굴이 남의 살처럼 감각이 둔하다. 발음은 어눌하지만 하고 싶은 말은 할 수 있고 남의 말도 알아듣는다. 물체가 둘로 보이거나 시야가 가려지지는 않는다. 머리는 아프지 않다. 토하거나 어지럽지는 않았다. 정신을 잃거나 경련을 하지는 않았다. 넘어지거나 머리를 부딪치지는 않았다. 물을 마실 때 사레가 들리지는 않는다. 가슴이나 등이 아프지는 않다.
    이 주 전에도 왼손이 십 분 정도 저리고 힘이 빠졌다가 저절로 좋아진 적이 있다. 몇 달 전부터 가끔 가슴이 불규칙하게 두근거렸다. 작년 건강검진에서 맥박이 불규칙하다는 말을 들었지만 병원에 가지 않았다.
    앓고 있는 병은 고혈압과 당뇨이다. 십 년 전부터 고혈압약을 먹는데 자주 빠뜨린다. 오 년 전에 당뇨를 진단받아 당뇨약을 먹고 있다. 평소에 먹는 약이 혈압약과 당뇨약 두 가지 있다. 콜레스테롤이 높다는 말을 들었지만 약은 먹지 않는다. 아스피린이나 피를 묽게 하는 약은 먹지 않는다. 최근에 수술을 받거나 피가 잘 안 멎은 적은 없다. 검은 변을 보거나 피를 토한 적은 없다. 예전에 뇌졸중이나 뇌출혈을 앓은 적은 없다. 약 알레르기는 없다. 가족 중에 아버지가 일흔에 중풍으로 돌아가셨다.
    담배는 사십 년 동안 하루 한 갑씩 피우고 있다. 술은 일주일에 세 번 소주 한 병씩 마시는 편이다. 직업이 택시 기사여서 하루 종일 운전 일을 한다. 아내와 함께 산다. 가장 걱정되는 것은 다시 운전할 수 있을지이다. 갑자기 이렇게 되어서 무섭다.
  exams:
    전반적 외관 시진 (General appearance): 왼쪽 입꼬리 처짐(+), 불안해 보임
    의식·지남력 평가 (Mental status): 명료, 지남력 정상
    활력징후 측정 (Vital signs): 172/98mmHg, 96회/분, 18회/분, 36.6°C, 산소포화도 96%
    요골동맥 맥박 촉진 (Radial pulse palpation): 불규칙적으로 불규칙한 맥박(+), 96회/분
    심음 청진 (Heart auscultation): 리듬 불규칙, S1 세기 변동, 심잡음(-)
    경동맥 잡음 청진 (Carotid bruit): 잡음(-/-)
    양팔 혈압 비교 (Blood pressure in both arms): 우측 172/98mmHg, 좌측 170/96mmHg, 차이 없음
    안면 근력 검사 (Facial muscle strength (CN VII)): 좌측 하부 안면 마비(+), 이마 주름 보존(중추성)
