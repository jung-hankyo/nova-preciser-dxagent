- case_id: M29
  playbook: rash
  opening: 이름은 김옥자이고, 나는 일흔한 살 여자이다. 이틀 전부터 오른쪽 등과 옆구리에 물집이 잡혀서 병원에 왔다.
  vital_signs: "혈압 : 138/82 mmHg\n맥박 : 84 회/분\n호흡 : 16 회/분\n체온 : 37.2°C"
