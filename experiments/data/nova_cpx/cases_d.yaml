- case_id: M17
  playbook: upper_gi_bleeding
  opening: 이름은 변재훈이고, 나는 마흔여섯 살 남자이다. 어제부터 까만 변을 보고 오늘 아침에 피를 토해서 병원에 왔다.
  vital_signs: "혈압 : 98/62 mmHg\n맥박 : 112 회/분\n호흡 : 20 회/분\n체온 : 36.4°C\n산소포화도 : 98%"
  script: |
    한 달 전부터 배가 고프면 명치가 쓰리고 아팠다. 밥을 먹으면 쓰린 게 조금 나아졌다. 새벽에 속이 쓰려서 깬 적이 몇 번 있다. 속쓰림 때문에 약국에서 겔포스를 사 먹었다.
    이 주 전에 허리를 삐끗해서 약국에서 부루펜이라는 진통제를 샀다. 부루펜을 하루 세 번씩 열흘 동안 먹었다. 어제 아침부터 검은 변을 세 번 봤다. 변 색깔은 짜장면처럼 까맣다. 변이 끈적하고 지독한 냄새가 났다. 오늘 아침에 한 번 토했다. 토한 것은 커피 찌꺼기처럼 검붉은 색이었다. 토한 양은 종이컵 반 컵 정도였다. 피를 토하기 전에 심하게 헛구역질을 하지는 않았다.
    일어나면 어지럽고 눈앞이 캄캄해진다. 오늘 아침 화장실에서 쓰러질 뻔했다. 식은땀이 나고 기운이 없다. 지금 명치 통증은 열 중에 사 정도이다. 배 전체가 심하게 아프지는 않다. 열은 없다. 몸무게는 변화가 없다. 음식을 삼키기 어렵지는 않다. 이런 적은 처음이다.
    삼 년 전 건강검진 위내시경에서 위염이 있다고 들었다. 간이 나쁘다는 말은 들은 적이 없다. 앓고 있는 지병은 없다. 아스피린이나 피를 묽게 하는 약은 먹지 않는다. 부루펜 말고 먹는 약은 없다. 약 알레르기는 없다. 수술이나 입원을 한 적은 없다. 가족 중에 위암이나 간 질환을 앓은 사람은 없다.
    담배는 하루 한 갑씩 이십오 년째 피운다. 술은 일주일에 세 번 소주 한 병씩 마신다. 물류 창고에서 지게차 기사로 일하고 있다. 아내와 두 아이와 함께 산다. 피를 토해서 너무 놀랐다. 큰 병이 아닌지 걱정된다.
