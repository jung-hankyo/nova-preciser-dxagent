  vital_signs: "혈압 : 132/80 mmHg\n맥박 : 84 회/분\n호흡 : 16 회/분\n체온 : 36.6°C"
  script: |
    석 달 전부터 밥을 먹으면 가슴 한가운데에 음식이 걸리는 느낌이 들었다. 처음에는 고기나 밥 같은 딱딱한 음식만 걸렸다. 한 달 전부터는 죽 같은 부드러운 음식도 걸릴 때가 있다. 물은 아직 잘 넘어간다. 걸리는 곳은 명치 바로 위 가슴뼈 뒤쪽이다. 점점 심해지고 있다.
    음식이 걸리면 물을 마셔서 내려보낸다. 가끔 걸린 음식을 도로 토해 낸다. 삼킬 때 가슴이 조금 아프다. 아픈 정도는 열 중에 삼 정도이다. 물을 마실 때 사레가 들리지는 않는다. 음식이 코로 넘어오지는 않는다. 밥을 먹고 나서 기침이 나지는 않는다. 목소리가 변하지는 않았다.
    석 달 동안 몸무게가 칠 키로그람 빠졌다. 입맛은 있는데 먹기가 힘들어서 덜 먹게 된다. 밥을 제대로 못 먹어서 기운이 없다. 평소에 속쓰림은 거의 없었다. 신물이 넘어오는 일도 거의 없었다. 열은 없다. 검은 변을 본 적은 없다. 피를 토한 적은 없다. 목에 덩어리가 만져지지는 않는다. 말이 어눌해진 적은 없다. 팔다리에 힘이 빠진 적은 없다.
    전에는 이런 적이 없었다. 아직 병원에 가 본 적은 없다. 앓고 있는 병은 고혈압뿐이다. 십 년 전부터 고혈압약을 먹고 있다. 혈압약 말고 먹는 약은 없다. 당뇨는 없다. 위내시경은 육 년 전에 한 번 받았다. 수술이나 입원을 한 적은 없다. 약 알레르기는 없다. 가족 중에 암을 앓은 사람은 없다.
    담배는 하루 한 갑씩 사십오 년째 피우고 있다. 술은 거의 매일 소주 한 병 이상 마신다. 술을 마시면 얼굴이 금방 빨개진다. 뜨거운 국물을 좋아한다. 건설 현장에서 일하다가 이 년 전에 그만두었다. 아내와 둘이 산다. 혹시 큰 병이 아닌지 걱정된다.
