- case_id: M21
  playbook: voiding_difficulty
  opening: 이름은 진병국이고, 나는 일흔 살 남자이다. 일 년 전부터 소변보기가 힘들어서 병원에 왔다.
  vital_signs: "혈압 : 136/82 mmHg\n맥박 : 72 회/분\n호흡 : 16 회/분\n체온 : 36.4°C"
  script: |
    일 년 전부터 소변 줄기가 점점 약해졌다. 소변을 보려고 하면 한참 기다려야 나온다. 배에 힘을 줘야 소변이 나온다. 소변이 나오다가 끊겼다가 다시 나온다. 소변을 보고 나도 시원하지 않고 남은 느낌이 든다. 소변을 보고 나서 몇 방울씩 흘러 속옷이 젖는다.
    낮에도 두 시간에 한 번씩 소변을 본다. 밤에 소변 때문에 세 번 깬다. 소변이 급하게 마려워서 참기 힘들 때가 있다. 불편한 정도는 열 중에 육 정도이다. 지난달에 감기약을 먹었을 때 소변보기가 더 힘들었다. 소변이 아예 안 나온 적은 없다.
    소변볼 때 아프지는 않다. 소변에 피가 섞인 적은 없다. 열은 없다. 허리는 아프지 않다. 다리에 힘이 빠지거나 저리지는 않다. 대변은 하루 한 번 잘 본다. 몸무게는 변화가 없다. 뼈가 아픈 곳은 없다. 저녁에는 물을 많이 마시지 않는다. 커피는 아침에 한 잔만 마신다.
    약국에서 쏘팔메토를 사서 석 달째 먹고 있다. 별로 좋아지지는 않았다. 앓고 있는 병은 고혈압뿐이다. 십 년 전에 고혈압을 진단받아 혈압약을 먹고 있다. 그 밖에 먹는 약은 없다. 당뇨는 없다. 전립선 검사를 받아 본 적은 없다. 입원이나 수술을 한 적은 없다. 요도에 관을 넣은 적도 없다. 성병을 앓은 적은 없다. 약 알레르기는 없다. 가족 중에 전립선 질환을 앓은 사람은 없다.
    담배는 십 년 전에 끊었다. 그전에는 하루 반 갑씩 삼십 년 피웠다. 술은 일주일에 한 번 막걸리 한 병 정도 마신다. 초등학교 교사로 일하다가 은퇴했다. 아내와 둘이 산다. 밤에 자주 깨서 낮에 피곤하다. 외출할 때 화장실이 걱정된다. 수술을 해야 하는지 궁금하다.
  exams:
