# Simulated CPX cases M11-M21 (set d): digestive and urinary presentations, written for this project in the public
# samples' format (see cases_a.yaml). The text is original. `key` is our own answer key for offline measurement:
# `history` names generic items or gives {id: regex} matched against the doctor's questions; `exams` are table rows
# that matter.

- case_id: M11
  playbook: abdominal_distension
  opening: 이름은 배상철이고, 나는 쉰일곱 살 남자이다. 한 달 전부터 배가 점점 불러 와서 병원에 왔다.
  vital_signs: "혈압 : 108/66 mmHg\n맥박 : 88 회/분\n호흡 : 18 회/분\n체온 : 36.7°C"
  script: |
    한 달 전부터 배가 점점 불러 왔다. 처음에는 살이 찐 줄 알았다. 바지 허리가 안 맞아서 두 치수 큰 바지를 입는다. 한 달 사이에 몸무게가 사 키로그람 늘었다. 그런데 팔다리는 오히려 가늘어졌다.
    배가 아프지는 않고 빵빵하고 묵직한 느낌이다. 밥을 조금만 먹어도 배가 부르다. 입맛이 없다. 쉽게 피곤하다. 이 주 전부터 저녁이 되면 다리가 붓는다.
    아내가 요즘 내 눈이 약간 노랗다고 했다. 소변 색이 조금 진해졌다. 요즘 팔에 멍이 잘 든다. 열은 없다. 숨이 차지는 않는다. 누워 있어도 숨이 답답하지 않다. 가슴이 아프거나 두근거리지는 않는다.
    피를 토한 적은 없다. 검은 변을 본 적은 없다. 설사나 변비는 없다. 토하지는 않았다. 방귀는 잘 나온다. 얼굴이 붓지는 않는다. 소변에 거품이 많지는 않다. 가족들이 내가 헛소리를 하거나 이상하게 행동한다고 한 적은 없다. 밤에 잠은 잘 잔다.
    약국에서 소화제를 사 먹었지만 그대로다. 전에 이런 적은 없었다. 오 년 전 건강검진에서 지방간이 있고 간 수치가 높다고 들었다. 그 뒤로 병원에 다니지는 않았다. B형간염이나 C형간염은 없다고 들었다. 앓고 있는 지병은 없다. 고혈압이나 당뇨도 없다. 먹는 약은 없다. 한약이나 건강식품은 먹지 않는다. 수술이나 입원을 한 적은 없다. 수혈을 받은 적은 없다. 약 알레르기는 없다.
    술은 삼십 년 넘게 거의 매일 소주 두 병씩 마셨다. 한 달 전부터는 몸이 안 좋아서 하루 한 병으로 줄였다. 어제 저녁에도 소주 한 병을 마셨다. 담배는 하루 반 갑씩 삼십오 년째 피운다. 택시 기사로 일하고 있다. 아내와 둘이 산다. 가족 중에 간 질환을 앓은 사람은 없다. 혹시 간암 같은 큰 병이 아닌지 걱정된다.
  exams:
    전반적 외관 시진 (General appearance): 만성 병색(+), 팔다리 근육 위축(+), 여성형 유방(+)
    활력징후 측정 (Vital signs): 108/66mmHg, 88회/분, 18회/분, 36.7°C
    의식·지남력 평가 (Mental status): 명료, 지남력 정상
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(-/-), 공막 황달 경도(+/+)
    피부 시진 (Skin inspection): 앞가슴 거미혈관종(+), 손바닥 홍반(+), 팔 멍(+)
    경정맥압 측정 (Jugular venous pressure): 경정맥 확장(-)
    폐 청진 (Lung auscultation): 폐포음, 수포음(-/-)
    심음 청진 (Heart auscultation): S1·S2 규칙적, S3(-), 심잡음(-)
    복부 시진 (Abdominal inspection): 전반적 팽만(+), 배꼽 돌출(+), 복벽 정맥 확장(+)
    복부 타진 (Abdominal percussion): 양측 옆구리 둔탁음(+), 배꼽 주위 고창음
    복수 이동탁음 확인 (Shifting dullness (ascites)): 양성(+)
    복부 촉진 (Abdominal palpation): 압통(-), 반발압통(-), 종괴(-)
    간·비장 촉진 (Liver and spleen palpation): 간 촉지 어려움(복수), 비장 끝 촉지(+)
    퍼덕떨림 확인 (Asterixis): 음성(-)
    하지 함요부종 확인 (Pitting edema of the legs): 양측 발목 함요부종(1+/1+)
  key:
    diagnosis: "Alcoholic liver cirrhosis with ascites (decompensated)"
    differential: ["Hepatocellular carcinoma", "Heart failure", "Peritoneal carcinomatosis or tuberculous peritonitis",
                   "Nephrotic syndrome"]
    history: [onset, character, timing, pmh, meds, fh, smoking, alcohol, job,
              {weight: "(체중|몸무게|살이)", edema: "(붓|부종|부어)", jaundice: "(노랗|누렇|황달)",
               gi_bleeding: "(검은|까만|짜장|피를 토|토혈|혈변)", fever: "(열이|열은|열 나|열나|체온|오한)",
               confusion: "(헛소리|정신|졸리|혼동|의식|깜빡|이상한 행동)", dyspnea: "숨",
               abd_pain: "(배가 아프|복통|통증|배는 아프)", liver_hx: "(간염|간 수치|간이 나쁘|간 질환|지방간|간 검사|간 기능)",
               appetite: "(식욕|입맛)", bruising: "(멍|출혈|잇몸)", transfusion: "(수혈|문신)"}]
    exams: [복수 이동탁음 확인 (Shifting dullness (ascites)), 간·비장 촉진 (Liver and spleen palpation), 피부 시진 (Skin inspection),
            결막·공막 시진 (Conjunctiva and sclera inspection), 퍼덕떨림 확인 (Asterixis)]

- case_id: M12
  playbook: constipation
  opening: 이름은 옥지수이고, 나는 스물세 살 여자이다. 석 달 전부터 변비가 심해져서 병원에 왔다.
  vital_signs: "혈압 : 108/68 mmHg\n맥박 : 70 회/분\n호흡 : 14 회/분\n체온 : 36.4°C"
  script: |
    일 년 전에 회사에 들어가고 나서 변비가 생겼다. 석 달 전부터 더 심해졌다. 대변은 요즘 사흘이나 나흘에 한 번 본다. 변 모양은 토끼똥처럼 작고 딱딱하다. 변을 볼 때 한참 힘을 줘야 나온다. 화장실에 삼십 분씩 앉아 있을 때도 있다. 변을 보고 나서도 덜 본 것처럼 남은 느낌이 든다.
    배가 더부룩하고 가스가 자주 찬다. 배가 아픈 적은 거의 없다. 열은 없다. 변에 피가 묻어 나온 적은 없다. 검은 변을 본 적은 없다. 변이 가늘어지지는 않았다. 설사와 변비가 번갈아 생기지는 않는다. 변을 볼 때 항문이 찢어지듯 아프지는 않다. 항문에 무언가 튀어나오지는 않는다.
    석 달 전부터 다이어트를 해서 몸무게가 이 키로그람 빠졌다. 다이어트 때문에 아침은 거르고 점심과 저녁도 조금만 먹는다. 채소나 과일은 잘 먹지 않는다. 물은 하루에 두 컵 정도 마신다. 커피는 하루 두 잔 마신다. 회사에서 하루 종일 앉아서 일한다. 운동은 거의 하지 않는다. 회사에서는 대변이 마려워도 참는 편이다. 입사하고 나서 스트레스가 많다.
    약국에서 산 둘코락스를 일주일에 한두 번 먹는다. 변비약을 먹으면 다음 날 변을 본다. 특별히 피곤하지는 않다. 추위를 더 타지는 않는다. 얼굴이나 다리가 붓지는 않는다.
    앓고 있는 지병은 없다. 변비약 말고 먹는 약은 없다. 철분제는 먹지 않는다. 약 알레르기는 없다. 수술이나 입원을 한 적은 없다. 생리는 한 달에 한 번 규칙적이다. 마지막 생리는 이 주 전에 시작했다. 성관계는 하지 않는다. 임신 가능성은 없다.
    어머니도 변비가 있다. 가족 중에 대장암을 앓은 사람은 없다. 담배는 피우지 않는다. 술은 한 달에 한두 번 맥주 한 캔 정도 마신다. 회사에서 사무직으로 일하고 있다. 혼자 원룸에서 산다. 변비약을 계속 먹어도 괜찮은지 걱정된다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-), 마른 체형
    활력징후 측정 (Vital signs): 108/68mmHg, 70회/분, 14회/분, 36.4°C
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(-/-), 황달(-/-)
    갑상선 촉진 (Thyroid palpation): 비대(-), 결절(-)
    피부 시진 (Skin inspection): 건조(-)
    복부 시진 (Abdominal inspection): 팽만(-), 수술 흉터(-)
    장음 청진 (Bowel sound auscultation): 정상
    복부 타진 (Abdominal percussion): 경도 고창음
    복부 촉진 (Abdominal palpation): 좌하복부에 눌리는 변 덩어리 촉지(+), 압통(-), 종괴(-)
    항문 시진 (Anal inspection): 치핵(-), 열창(-)
    직장수지검사 (Digital rectal examination): 직장 내 단단한 변(+), 혈액(-), 종괴(-), 괄약근 긴장도 정상, 힘주기 시 이완 정상
    심부건반사 (Deep tendon reflex): 정상, 이완 지연(-)
  key:
    diagnosis: "Functional constipation"
    differential: ["Constipation-predominant irritable bowel syndrome", "Hypothyroidism", "Dyssynergic defecation",
                   "Colorectal cancer"]
    history: [onset, timing, pmh, meds, fh, alcohol, lmp, pregnancy, job,
              {frequency: "(며칠|일주일|횟수|얼마나 자주|몇 번)", stool_form: "(딱딱|단단|모양|굳|토끼|어떤 변)",
               straining: "(힘을|힘주|오래 앉|힘드)", blood: "(피가|피는|혈변|검은|까만)", weight_loss: "(체중|몸무게|살이)",
               abd_pain: "(배가 아프|복통|통증|배는 아프)", diet: "(식사|음식|채소|과일|섬유|식습관|끼니)",
               water: "(물을|물은|수분)", laxative: "(변비약|약국|관장|둘코)", thyroid: "(추위|피곤|갑상선|붓)",
               alternating: "설사"}]
    exams: [복부 촉진 (Abdominal palpation), 직장수지검사 (Digital rectal examination), 항문 시진 (Anal inspection),
            갑상선 촉진 (Thyroid palpation)]

- case_id: M13
  playbook: diarrhea
  opening: 이름은 문준혁이고, 나는 서른한 살 남자이다. 어제부터 설사를 계속해서 병원에 왔다.
  vital_signs: "혈압 : 118/74 mmHg\n맥박 : 98 회/분\n호흡 : 18 회/분\n체온 : 37.6°C"
  script: |
    그저께 저녁에 회사 회식에서 생굴을 먹었다. 어제 낮에 갑자기 속이 메스꺼워졌다. 그 뒤로 세 번 토했다. 어제 오후부터 물 같은 설사가 시작됐다. 어제부터 하루에 열 번 정도 설사를 했다. 변은 물처럼 묽고 누런색이다. 변에 피나 코 같은 곱이 섞이지는 않았다.
    배꼽 주위가 꼬이듯이 쥐어짜며 아프다. 아픈 정도는 열 중에 사 정도이다. 설사를 하고 나면 배 아픈 게 조금 나아진다. 오른쪽 아랫배만 따로 아프지는 않다. 열은 어젯밤에 재 보니 삼십칠 도 팔 부였다. 몸이 으슬으슬 춥고 온몸이 쑤신다.
    오늘 아침부터는 토하지 않았다. 물은 조금씩 마시면 넘어간다. 소변은 어제부터 두 번밖에 안 봤다. 소변 색이 진하다. 일어설 때 조금 어지럽다.
    같이 굴을 먹은 동료 세 명도 비슷하게 토하고 설사를 한다. 아내는 아프지 않다. 최근에 해외여행을 다녀온 적은 없다. 최근에 항생제를 먹은 적은 없다. 약국에서 지사제를 사서 어제 한 번 먹었다. 평소에는 대변을 하루 한 번 보통으로 본다. 전에도 이렇게 심하게 설사한 적은 없다.
    앓고 있는 지병은 없다. 먹는 약은 없다. 약 알레르기는 없다. 수술이나 입원을 한 적은 없다. 가족 중에 장 질환을 앓은 사람은 없다. 담배는 하루 반 갑씩 십 년째 피운다. 술은 일주일에 한두 번 맥주 두세 병을 마신다. 회사에서 영업직으로 일하고 있다. 아내와 둘이 산다.
    내일 중요한 미팅이 있어서 빨리 낫고 싶다. 수액을 맞을 수 있는지 궁금하다.
  exams:
    전반적 외관 시진 (General appearance): 경도 병색(+), 기운 없어 보임
    활력징후 측정 (Vital signs): 118/74mmHg, 98회/분, 18회/분, 37.6°C
    기립성 혈압 측정 (Orthostatic BP): 누운 자세 118/74mmHg·96회/분 → 선 자세 112/72mmHg·110회/분, 기립성 저혈압(-), 경도 어지러움(+)
    구강 점막 시진 (Oral mucosa inspection): 약간 건조(+)
    피부 긴장도 확인 (Skin turgor): 약간 감소
    모세혈관 재충전 시간 (Capillary refill time): 2초 미만
    폐 청진 (Lung auscultation): 폐포음, 수포음(-/-)
    심음 청진 (Heart auscultation): S1·S2 규칙적, 경도 빈맥, 심잡음(-)
    복부 시진 (Abdominal inspection): 팽만(-)
    장음 청진 (Bowel sound auscultation): 항진(+)
    복부 촉진 (Abdominal palpation): 배꼽 주위 경도 압통(+), 근육 강직(-), 종괴(-)
    반발압통 (Rebound tenderness): 음성(-)
    맥버니점 압통 (McBurney point tenderness): 압통(-)
  key:
    diagnosis: "Acute infectious gastroenteritis (foodborne, likely norovirus from raw oysters) with mild dehydration"
    differential: ["Bacterial enteritis (Vibrio parahaemolyticus, Salmonella, Campylobacter)",
                   "Staphylococcus aureus food poisoning (preformed toxin)", "Acute appendicitis",
                   "Inflammatory bowel disease"]
    history: [onset, character, location, severity, timing, pmh, meds,
              {frequency: "(몇 번|횟수|하루에|자주)", stool_character: "(묽|물 같|색|모양|어떤 변|형태)",
               blood_mucus: "(피가|피는|곱|점액|혈변)", fever: "(열이|열은|열 나|열나|체온|오한)", vomiting: "(토|구토|메스|구역)",
               food: "(음식|먹은 것|드신 것|식사|회식|날것|생굴|굴을|회를|외식)", contacts: "(주변|같이|동료|비슷한|비슷하게|다른 사람)",
               travel: "(여행|해외)", antibiotics: "항생제", dehydration: "(소변|어지러|목마|목이 마|갈증|물은|물을)"}]
    exams: [복부 촉진 (Abdominal palpation), 장음 청진 (Bowel sound auscultation), 구강 점막 시진 (Oral mucosa inspection),
            피부 긴장도 확인 (Skin turgor), 반발압통 (Rebound tenderness)]

- case_id: M14
  playbook: dyspepsia
  opening: 이름은 고은숙이고, 나는 마흔일곱 살 여자이다. 반년 전부터 소화가 잘 안 돼서 병원에 왔다.
  vital_signs: "혈압 : 122/76 mmHg\n맥박 : 74 회/분\n호흡 : 16 회/분\n체온 : 36.6°C"
  script: |
    반년 전부터 밥을 먹고 나면 윗배가 더부룩하다. 조금만 먹어도 금방 배가 부르다. 명치 부위가 답답하고 체한 느낌이 든다. 트림이 자주 나온다. 가끔 속이 메스껍다. 토한 적은 없다. 열은 없다. 불편한 정도는 열 중에 사 정도이다.
    밥을 먹고 한두 시간 동안 가장 심하다. 많이 먹거나 밀가루 음식을 먹으면 더 심하다. 스트레스를 받으면 더 심해진다. 약국에서 소화제를 사 먹으면 잠깐 괜찮아진다. 전에도 가끔 체한 적은 있지만 이렇게 오래간 적은 없다.
    배가 고플 때 속이 쓰리지는 않다. 밤에 배가 아파서 깬 적은 없다. 가슴이 타는 듯이 쓰린 증상은 없다. 신물이 넘어오지는 않는다. 음식을 삼키기 어렵지는 않다. 몸무게는 변화가 없다. 검은 변을 본 적은 없다. 피를 토한 적은 없다. 오른쪽 윗배가 갑자기 심하게 아픈 적은 없다. 걷거나 계단을 오를 때 가슴이 아프지는 않다. 대변은 하루 한 번 보통으로 본다.
    작년 국가건강검진에서 위내시경을 했는데 가벼운 위염이 있다고만 들었다. 헬리코박터 검사는 받아 본 적이 없다. 앓고 있는 지병은 없다. 소화제 말고 먹는 약은 없다. 진통제나 아스피린은 먹지 않는다. 약 알레르기는 없다. 입원이나 수술은 십오 년 전 제왕절개 때 한 번 했다.
    가족 중에는 아버지가 예순 살에 위암 수술을 받으셨다. 담배는 피우지 않는다. 술은 거의 마시지 않는다. 커피는 하루 세 잔 마신다. 작은 식당을 운영하면서 직접 일하고 있다. 식사 시간이 불규칙하다. 요즘 가게 일과 아들 입시 때문에 스트레스가 많다. 잠을 깊이 못 잔다.
    생리는 아직 규칙적으로 한다. 마지막 생리는 삼 주 전에 시작했다. 남편이 정관수술을 해서 임신 가능성은 없다. 남편과 고등학생 아들과 함께 산다. 아버지처럼 위암일까 봐 걱정된다.
