  vital_signs: "혈압 : 112/70 mmHg\n맥박 : 82 회/분\n호흡 : 16 회/분\n체온 : 37.2°C"
  script: |
    일주일 전에 몸살처럼 열이 나고 온몸이 쑤시기 시작했다. 열은 삼십팔 도 오 부까지 올랐다. 그때부터 입맛이 없다. 속이 계속 메스껍다. 두 번 토했다. 오른쪽 윗배가 묵직하게 불편하다. 아픈 정도는 열 중에 삼 정도이다.
    사흘 전부터 소변 색이 콜라처럼 진해졌다. 이틀 전에 남편이 내 눈이 노랗다고 했다. 눈이 노래진 뒤로 열은 내렸다. 대변 색이 조금 연해진 것 같다. 몸이 가렵지는 않다. 몹시 피곤하고 기운이 없다. 배가 불러 오지는 않는다. 다리가 붓지는 않는다. 정신이 흐리거나 졸리지는 않다. 멍이 잘 들지는 않는다. 잇몸에서 피가 나지는 않는다. 전에도 눈이 노래진 적은 없다.
    한 달쯤 전에 식당에서 조개젓을 먹었다. 최근에 해외여행을 다녀온 적은 없다. 가족이나 회사 동료 중에 비슷하게 아픈 사람은 없다. 앓고 있는 지병은 없다. 간 질환을 진단받은 적도 없다. B형간염 예방접종은 어릴 때 맞았다. A형간염 예방접종은 맞은 적이 없다.
    열이 날 때 타이레놀을 이틀 동안 하루 두 알씩 먹었다. 그 밖에 먹는 약은 없다. 한약이나 건강식품은 먹지 않았다. 약 알레르기는 없다. 수술이나 입원을 한 적은 없다. 수혈을 받은 적은 없다. 문신은 없다. 성관계는 남편과만 한다. 피임은 남편이 콘돔을 쓴다. 마지막 생리는 열흘 전에 시작했다. 임신 가능성은 없다.
    술은 한 달에 한두 번 맥주 한 잔 정도 마신다. 담배는 피우지 않는다. 회사에서 사무직으로 일하고 있다. 남편과 세 살 아들과 함께 산다. 아들은 예방접종을 나이에 맞게 모두 맞혔다. 가족 중에 간 질환을 앓은 사람은 없다. 간이 크게 나빠진 건 아닌지 걱정된다. 아들에게 옮을까 봐 걱정된다.
