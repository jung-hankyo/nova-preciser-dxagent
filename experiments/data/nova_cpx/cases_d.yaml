  opening: 이름은 신예린이고, 나는 스물여덟 살 여자이다. 열흘 전부터 속이 메스껍고 토해서 병원에 왔다.
  vital_signs: "혈압 : 112/70 mmHg\n맥박 : 88 회/분\n호흡 : 16 회/분\n체온 : 36.8°C"
  script: |
    열흘 전부터 속이 메스껍다. 아침에 일어나면 메스꺼움이 특히 심하다. 하루에 두세 번 토한다. 토한 것은 먹은 음식이나 맑은 물이다. 토한 것에 피가 섞이지는 않았다. 밥 짓는 냄새나 고기 냄새를 맡으면 더 메스껍다. 크래커 같은 담백한 음식은 조금 먹을 수 있다. 물은 조금씩 마시면 넘어간다. 몸무게는 일 키로그람 정도 빠졌다.
    배가 아프지는 않다. 설사는 없다. 열은 없다. 머리는 아프지 않다. 어지럽지는 않다. 요즘 소변을 자주 본다. 소변볼 때 아프지는 않다. 요즘 가슴이 커진 것 같고 만지면 아프다. 요즘 많이 피곤하고 졸리다. 가슴이 두근거리지는 않는다. 손이 떨리지는 않는다.
    마지막 생리는 칠 주 전에 시작했다. 생리는 원래 이십팔 일 주기로 규칙적이었다. 생리가 아닌데 피가 비친 적은 없다. 남자친구와 성관계를 한다. 피임은 콘돔을 쓰는데 가끔 안 쓸 때가 있다. 임신 테스트는 해 보지 않았다. 임신이나 출산을 한 적은 없다.
    같이 밥을 먹은 사람 중에 아픈 사람은 없다. 상한 음식을 먹은 기억은 없다. 약국에서 위장약을 사 먹었는데 나아지지 않았다. 전에도 이렇게 토한 적은 없다. 앓고 있는 지병은 없다. 갑상선 질환을 진단받은 적은 없다. 그 밖에 먹는 약은 없다. 약 알레르기는 없다. 수술이나 입원을 한 적은 없다. 가족 중에 특별한 병은 없다.
    담배는 피우지 않는다. 술은 한 달에 두세 번 맥주를 마셨다. 요즘은 메스꺼워서 술을 마시지 않았다. 은행 창구에서 일하고 있다. 부모님과 함께 산다. 위염이 심해진 건 아닌지 걱정된다. 회사에 계속 나가기가 힘들다.
