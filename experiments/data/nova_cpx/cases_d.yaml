  script: |
    일주일 전에 소변이 핏물처럼 빨갛게 나왔다. 소변을 처음부터 끝까지 빨갛게 봤다. 그날 작은 핏덩어리가 한 번 섞여 나왔다. 사흘 동안 빨갛다가 그 뒤로 맑아졌다. 어제 다시 소변이 빨갛게 나왔다. 전에는 이런 적이 없었다.
    소변볼 때 아프지는 않다. 옆구리는 아프지 않다. 배도 아프지 않다. 열은 없다. 소변 줄기는 괜찮다. 밤에 소변 때문에 한 번 깬다. 소변에 거품이 많지는 않다. 몸이 붓지는 않는다. 몸무게는 변화가 없다. 멍이 잘 들지는 않는다. 잇몸에서 피가 나지는 않는다.
    최근에 넘어지거나 다친 적은 없다. 최근에 심하게 운동한 적은 없다. 최근에 감기를 앓거나 목이 아픈 적은 없다. 아직 병원에 가 보지 않았다.
    앓고 있는 병은 고혈압뿐이다. 오 년 전부터 고혈압약을 먹고 있다. 아스피린이나 피를 묽게 하는 약은 먹지 않는다. 당뇨는 없다. 결석을 앓은 적은 없다. 수술이나 입원을 한 적은 없다. 약 알레르기는 없다. 가족 중에 콩팥병이나 암을 앓은 사람은 없다.
    담배는 하루 한 갑씩 사십 년째 피운다. 술은 일주일에 두 번 소주 반 병 정도 마신다. 삼십 년 동안 염색 공장에서 일하다가 그만두었다. 지금은 아파트 경비원으로 일하고 있다. 아내와 둘이 산다. 피가 멈춰서 괜찮은 줄 알았다. 혹시 암이 아닐까 걱정된다.
