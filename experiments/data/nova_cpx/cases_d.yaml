- case_id: M20
  playbook: oliguria
  opening: 이름은 채순자이고, 나는 일흔여섯 살 여자이다. 어제부터 소변 양이 줄어서 병원에 왔다.
  vital_signs: "혈압 : 96/58 mmHg\n맥박 : 106 회/분\n호흡 : 18 회/분\n체온 : 36.9°C"
  script: |
    닷새 전부터 설사와 구토가 있었다. 처음 사흘은 하루 대여섯 번씩 물처럼 설사했다. 처음 이틀은 하루 두세 번씩 토했다. 이틀 전부터 설사는 하루 한두 번으로 줄었다. 그동안 음식은 거의 못 먹었다. 물도 잘 못 마셨다. 남편도 하루 설사를 했다가 나았다.
    어제부터 소변 양이 확 줄었다. 소변은 어제 하루에 두 번밖에 안 봤다. 한 번에 나오는 양도 아주 적었다. 오늘은 아침에 한 번 조금 봤다. 소변 색이 진한 노란색이다. 전에도 소변이 이렇게 준 적은 없다. 소변이 마려운데 안 나오는 느낌은 없다. 아랫배가 불러 오지는 않는다. 소변볼 때 아프지는 않다. 소변에 피가 섞이지는 않는다. 소변에 거품이 많지는 않다.
    입이 바싹 마르고 목이 자주 마르다. 일어서면 어지러워서 벽을 짚는다. 기운이 없어서 누워만 있다. 열은 없다. 숨이 차지는 않는다. 얼굴이나 다리가 붓지는 않는다. 몸에 발진이 생기지는 않았다. 근육이 아프지는 않다. 넘어진 적은 없다. 최근에 시티 같은 조영제 검사를 받은 적은 없다.
    앓고 있는 병은 고혈압과 무릎 관절염이다. 십오 년 전에 고혈압을 진단받았다. 혈압약은 매일 아침 한 알씩 계속 먹었다. 혈압약에 이뇨제가 들어 있다고 들었다. 무릎 관절염이 있어서 정형외과에서 받은 진통제를 하루 두 번 먹는다. 당뇨는 없다. 작년 건강검진에서 콩팥 기능은 괜찮다고 들었다. 입원이나 수술은 십 년 전에 백내장 수술을 한 것이 전부이다. 약 알레르기는 없다. 폐경은 쉰 살쯤에 되었다.
    가족 중에 콩팥병을 앓은 사람은 없다. 담배는 피운 적이 없다. 술은 마시지 않는다. 평생 농사를 지으며 일하다가 지금은 쉬고 있다. 남편과 둘이 시골에서 산다. 콩팥이 망가진 건 아닌지 걱정된다.
