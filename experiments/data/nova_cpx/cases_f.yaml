- case_id: M35
  playbook: ped_cough
  opening: 이름은 강서윤이고, 여덟 살 여자아이이다. 엄마 오수진, 서른여덟 살이 보호자로 함께 왔다. 엄마는 서윤이가 삼 주 전부터 밤마다 기침을 해서 병원에 데려왔다.
  vital_signs: "혈압 : 102/64 mmHg\n맥박 : 98 회/분\n호흡 : 22 회/분\n체온 : 36.8°C\n산소포화도 : 96%"
  script: |
    엄마가 대답한다. 기침은 삼 주 전부터 시작됐다. 처음에는 콧물과 미열이 있는 감기를 앓았다. 감기는 나았는데 기침이 계속된다. 기침은 밤에 잘 때와 새벽에 심한 편이다. 일주일에 서너 번은 기침 때문에 자다가 깬다. 낮에는 기침이 덜하다. 기침은 마른기침이다. 가래는 거의 나오지 않는다. 기침이 심할 때는 숨에서 쌕쌕거리는 소리가 난다.
    체육 시간에 뛰거나 운동을 하면 기침이 심해지고 숨이 찬다. 찬 바람을 쐬면 기침이 심해진다. 먼지가 많은 곳에 가도 기침이 심해진다. 할머니 댁 고양이 옆에 가면 재채기와 기침이 심해진다. 지금 가만히 있을 때는 숨이 차지 않는다. 지금은 열이 나지 않는다. 가슴이 아프다고 하지는 않는다. 기침 끝에 토하거나 흡 하는 소리를 내지는 않는다. 음식을 먹다가 사레들린 적은 없다. 결핵 환자와 접촉한 적은 없다. 밥은 잘 먹고 체중이 줄지는 않았다.
    전에도 이런 적이 일 년에 두세 번 있었다. 다섯 살 때부터 감기에 걸리면 기침이 오래가고 쌕쌕거렸다. 그럴 때면 동네 의원에서 네뷸라이저 치료를 받은 적이 있다. 의사에게 기관지가 예민하다는 말을 들었다. 아침에 일어나면 재채기와 맑은 콧물이 난다. 아기 때 아토피 피부염이 있었다. 먹은 약은 집에 있던 기침 시럽인데 효과가 없었다. 입원한 적은 없다. 약 알레르기는 없다.
    예방접종은 모두 맞았다. 만삭에 태어났고 발달은 정상이다. 가족 중에는 아빠가 어릴 때 천식을 앓았고 지금도 비염이 있다. 집에서 담배 피우는 사람은 아빠이고 베란다에서 피운다. 집에서 키우는 애완동물은 없다. 초등학교 이 학년이다. 기침 때문에 잠을 설쳐서 수업 시간에 졸려 한다. 기침이 너무 오래가서 걱정된다.
  exams:
    전반적 외관 시진 (General appearance): 호흡곤란(-), 문장으로 대화 가능, 간간이 마른기침
    활력징후 측정 (Vital signs): 102/64mmHg, 98회/분, 22회/분, 36.8°C, 산소포화도 96%
    비강 시진 (Nasal inspection): 하비갑개 창백·부종(+/+), 맑은 콧물(+)
    인두 시진 (Pharynx inspection): 발적(-), 편도 비대(-), 후비루(-)
    이경 검사 (Otoscopy): 양측 고막 정상
    경부 림프절 촉진 (Cervical lymph node palpation): 촉지(-/-)
    흉곽 시진 (Chest inspection): 대칭, 흉골상·늑간 함몰(-), 보조호흡근 사용(-)
    흉부 타진 (Chest percussion): 공명음, 둔탁음(-/-)
    폐 청진 (Lung auscultation): 양측 호기 천명음(+/+), 호기 연장(+), 수포음(-/-), 호흡음 좌우 대칭
    심음 청진 (Heart auscultation): S1·S2 규칙적, 심잡음(-)
    곤봉지 확인 (Digital clubbing): 곤봉지(-)
    피부 시진 (Skin inspection): 양측 팔오금 피부 건조(+), 습진(-)
