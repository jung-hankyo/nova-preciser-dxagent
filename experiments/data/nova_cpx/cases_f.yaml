- case_id: M36
  playbook: ped_rash
  opening: 이름은 이민준이고, 여섯 살 남자아이이다. 엄마 정혜린, 서른여섯 살이 보호자로 함께 왔다. 엄마는 민준이가 사흘 전부터 다리에 붉은 반점이 생겨서 병원에 데려왔다.
  vital_signs: "혈압 : 104/66 mmHg\n맥박 : 96 회/분\n호흡 : 20 회/분\n체온 : 37.2°C"
  script: |
    엄마가 대답한다. 사흘 전 아침에 빨간 점들이 양쪽 발목과 종아리에 생겼다. 지금은 허벅지와 엉덩이로 퍼졌다. 처음에는 좁쌀만 하다가 점점 커졌다. 일부는 서로 붙고 보라색으로 변했다. 만지면 살짝 볼록하게 만져진다. 손가락으로 눌러도 색이 없어지지 않는다. 가렵거나 아프지는 않다. 얼굴이나 가슴, 팔에는 없다.
    이틀 전부터 양쪽 발목 관절이 아프고 붓는다. 발목이 아파서 잘 걷지 못하고 절뚝거린다. 무릎도 조금 아프다고 한다. 어제부터 배꼽 주위가 아프기 시작했다. 배가 쥐어짜듯 아프다가 괜찮아지기를 반복한다. 한 번 아프면 십 분에서 이십 분 정도 간다. 배가 아플 때는 배를 움켜쥐고 운다. 어제 한 번 토했다. 변에 피가 섞이거나 검은 변을 보지는 않았다. 설사는 없다.
    소변 색은 평소와 같다. 소변볼 때 아프다고 하지는 않는다. 얼굴이나 눈두덩이 붓지는 않는다. 코피나 잇몸 출혈은 없다. 몸에 멍이 잘 들지는 않는다. 지금은 열이 나지 않는다. 아이가 처지지는 않고 배가 안 아플 때는 잘 논다. 머리가 아프다고 하지는 않는다. 밥은 조금 덜 먹는다. 뼈가 아프다고 하지는 않는다.
    이 주 전에 목이 아프고 열이 나는 감기를 앓은 적이 있다. 그때 먹은 약은 동네 의원에서 지은 사흘 치 감기약이다. 지금 먹는 약은 없다. 약 알레르기는 없다. 새로 먹은 음식이나 벌레에 물린 일은 없다. 예방접종은 모두 맞았다. 큰 병이나 입원한 적은 없다. 만삭으로 태어났고 발달은 정상이다.
    가족 중에 피가 잘 안 멈추는 병은 없다. 유치원에 다닌다. 유치원에 비슷한 증상의 아이는 없다. 집에서 담배 피우는 사람은 없다. 점이 계속 번져서 혹시 백혈병일까 봐 걱정된다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-), 처짐(-), 발목 통증으로 절뚝거림
    활력징후 측정 (Vital signs): 104/66mmHg, 96회/분, 20회/분, 37.2°C
    피부 시진 (Skin inspection): 양측 하지와 엉덩이에 대칭적인 2-10mm 크기의 붉은 보라색 구진성 자반, 일부 융합; 얼굴·체간·상지 병변(-)
    점상출혈 확인 (Petechiae and purpura): 하지·엉덩이 촉지성 자반(+), 구강 점막 점상출혈(-)
    유리압진 검사 (Diascopy (blanching)): 눌러도 퇴색하지 않음(비퇴색성)
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(-/-), 황달(-/-)
    경부 림프절 촉진 (Cervical lymph node palpation): 촉지(-/-)
    발목 관절 촉진 (Ankle joint palpation): 양측 부종(+/+), 압통(+/+), 열감 경미, 발적(-)
    무릎 관절 촉진 (Knee joint palpation): 경미한 압통(+/+), 부종(-/-), 삼출(-/-)
    장음 청진 (Bowel sound auscultation): 정상
    복부 촉진 (Abdominal palpation): 배꼽 주위 경미한 압통(+), 반발압통(-), 종괴(-)
    간·비장 촉진 (Liver and spleen palpation): 간비종대(-)
    안검 부종 시진 (Eyelid edema): 부종(-)
    경부 강직 (Neck stiffness): 강직(-)
