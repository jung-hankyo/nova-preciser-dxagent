- case_id: M31
  playbook: breast_mass
  opening: 이름은 김선영이고, 나는 마흔네 살 여자이다. 한 달 전부터 오른쪽 가슴에 멍울이 만져져서 병원에 왔다.
  vital_signs: "혈압 : 118/76 mmHg\n맥박 : 76 회/분\n호흡 : 16 회/분\n체온 : 36.5°C"
  script: |
    한 달 전에 샤워하다가 오른쪽 가슴 바깥쪽 위에서 멍울을 처음 만졌다. 크기는 엄지손톱 정도이다. 크기가 처음에 비해 조금 커진 것 같다. 돌처럼 딱딱하고 울퉁불퉁하다. 밀어도 잘 움직이지 않는다. 누르거나 만져도 아프지 않다. 생리 주기에 따라 크기나 아픈 정도가 변하지는 않는다.
    유방 자가검진은 따로 해 본 적이 없다. 피부에 변화가 생긴 건 일주일 전이고, 팔을 들면 멍울 근처가 쏙 들어간다. 피부가 빨갛거나 뜨겁지는 않다. 유두에서 피나 진물이 나오지는 않는다. 유두가 안으로 들어가지는 않았다. 겨드랑이에 멍울이 있는지는 잘 모르겠다. 왼쪽 가슴은 괜찮다. 가슴을 다친 적은 없다. 열이 나지는 않는다. 체중이 줄거나 늘지는 않았다. 뼈가 아프거나 기침이 나지는 않는다.
    마지막 생리는 열흘 전에 시작했다. 생리 주기는 이십팔 일로 규칙적이다. 초경은 열한 살에 했다. 출산 경험은 한 번이고 서른다섯 살에 첫아이를 낳았다. 모유 수유는 한 달만 했다. 남편과 한 달에 두세 번 성관계를 한다. 남편이 정관수술을 해서 피임은 따로 하지 않는다. 임신 가능성은 없다. 피임약이나 여성호르몬제는 먹은 적이 없다.
    이 년 전 건강검진 유방촬영에서 치밀유방이라는 말만 들었다. 전에 유방 혹으로 검사나 수술을 받은 적은 없다. 앓고 있는 병은 없다. 먹는 약은 없다. 약 알레르기는 없다. 가족 중에는 어머니가 쉰 살에 유방암 수술을 받았다. 이모나 언니 중에 유방암이나 난소암은 없다. 담배는 피우지 않는다. 술은 일주일에 두세 번 맥주 두 캔 정도 마신다. 직업은 은행원이다. 엄마처럼 유방암일까 봐 무섭다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-)
    활력징후 측정 (Vital signs): 118/76mmHg, 76회/분, 16회/분, 36.5°C
    유방 시진 (Breast inspection): 우측 외상부 피부 함몰(+) (팔을 올릴 때 뚜렷), 유두 함몰(-), 귤껍질 피부(-), 발적(-); 좌측 정상
    유방 촉진 (Breast palpation): 우측 10시 방향 유두에서 4cm, 2.5cm 크기의 단단하고 경계가 불규칙한 종괴, 압통(-), 주변 조직에 고정되어 잘 움직이지 않음; 좌측 종괴(-)
    유즙 분비 확인 (Galactorrhea): 유두 분비물(-/-)
    겨드랑이 림프절 촉진 (Axillary lymph node palpation): 우측 1cm 단단한 림프절 1개 촉지(+), 가동성 있음; 좌측 촉지(-)
    쇄골상 림프절 촉진 (Supraclavicular lymph node palpation): 촉지(-/-)
    경부 림프절 촉진 (Cervical lymph node palpation): 촉지(-/-)
    폐 청진 (Lung auscultation): 폐포음, 수포음(-/-)
    간·비장 촉진 (Liver and spleen palpation): 간비종대(-)
    척추 압통 촉진 (Spinal tenderness): 압통(-)
  key:
    diagnosis: Breast cancer (right)
    differential: [Fibroadenoma, Fibrocystic change or breast cyst, Fat necrosis, Phyllodes tumor]
    history: [onset, location, prior, pmh, meds, fh, smoking, alcohol, lmp, pregnancy,
              {size: "(크기|커지|커졌|자라)", consistency: "(딱딱|단단|말랑|움직|어떤 느낌|만져지)", pain: "(아프|통증)",
               cyclic: "(생리.*(변화|달라|크기|커지|변하)|생리 전)", skin: "(피부|함몰|빨갛|붉)", nipple: "(유두|젖꼭지|분비물|진물)",
               axilla: "(겨드랑이|림프)", trauma: "(다친|부딪|외상)", menarche: "(초경|처음 생리)", parity_breastfeeding: "(출산|아이|낳|분만|모유|수유)",
               hormone: "(호르몬|피임약)", screening: "(유방촬영|촬영|검진|초음파|맘모)"}]
    exams: [유방 촉진 (Breast palpation), 유방 시진 (Breast inspection), 겨드랑이 림프절 촉진 (Axillary lymph node palpation),
            쇄골상 림프절 촉진 (Supraclavicular lymph node palpation)]

- case_id: M32
  playbook: dysmenorrhea
  opening: 이름은 정다은이고, 나는 스무 살 여자이다. 몇 년 전부터 생리할 때마다 배가 너무 아파서 병원에 왔다. 생리통 약을 처방받고 싶다.
  vital_signs: "혈압 : 108/68 mmHg\n맥박 : 86 회/분\n호흡 : 16 회/분\n체온 : 36.7°C"
  script: |
    생리통은 중학교 이 학년 무렵부터 있었다. 초경은 열세 살에 했다. 오늘 아침 생리가 시작되면서 또 아프다. 아랫배 가운데가 아프다. 쥐어짜듯이 아프다. 아픈 정도는 열 중에 팔 정도이다. 통증이 허리와 허벅지 안쪽으로 퍼진다.
    생리 시작 몇 시간 전부터 아프기 시작한다. 첫째 날과 둘째 날이 가장 심하고 사흘째부터는 거의 안 아프다. 생리 때가 아니면 배가 아프지 않다. 몇 년째 아픈 정도는 비슷하고 점점 심해지지는 않았다. 아플 때 구역질이 나고 가끔 구토도 한다. 아플 때 설사를 하기도 한다. 생리할 때 두통도 조금 있다. 배를 따뜻하게 하면 좀 좋아진다. 웅크리고 누워 있으면 덜 아프다. 진통제를 먹어 본 건 타이레놀뿐이고 한 알 먹으면 조금 덜 아프다. 생리통 때문에 학교 수업을 빠진 적이 몇 번 있다. 시험 기간에는 더 아픈 것 같다.
    생리 주기는 이십팔 일에서 삼십 일로 규칙적이다. 생리는 닷새 동안 하고 양은 보통이다. 핏덩어리는 많지 않다. 생리 때가 아닌데 피가 비친 적은 없다. 냉이 늘거나 냄새가 나지는 않는다. 열이 나지는 않는다. 소변이나 대변을 볼 때 아프지 않다.
    성관계는 한 번도 한 적이 없다. 남자 친구는 없다. 임신 가능성은 없다. 피임약을 먹어 본 적은 없다. 다이어트를 하거나 체중이 변하지는 않았다. 마지막 생리는 오늘 아침에 시작했다. 앓고 있는 병은 없다. 먹는 약은 없다. 약 알레르기는 없다. 수술이나 입원한 적은 없다.
    가족 중에는 엄마가 젊을 때 생리통이 심했다. 담배는 피우지 않는다. 술은 한 달에 한두 번 마신다. 대학생이고 기숙사에 산다. 생리통에 잘 듣는 약을 처방받고 싶다.
  exams:
    전반적 외관 시진 (General appearance): 통증으로 약간 웅크린 자세, 급성 병색(-)
    활력징후 측정 (Vital signs): 108/68mmHg, 86회/분, 16회/분, 36.7°C
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(-/-), 황달(-/-)
    복부 시진 (Abdominal inspection): 편평, 팽만(-)
    장음 청진 (Bowel sound auscultation): 정상
    복부 촉진 (Abdominal palpation): 치골상부 경미한 압통(+), 종괴(-), 근육 강직(-)
    반발압통 (Rebound tenderness): (-)
    맥버니점 압통 (McBurney point tenderness): (-)
    늑골척추각 압통 (Costovertebral angle tenderness): 압통(-/-)
    외음부 시진 (Vulvar inspection): 정상, 생리혈 소량
    직장수지검사 (Digital rectal examination): 자궁 정상 크기, 압통(-); 자궁천골인대 결절(-); 부속기 종괴(-/-)
  key:
    diagnosis: Primary dysmenorrhea
    differential: [Endometriosis, Obstructive Müllerian anomaly, Ovarian cyst (endometrioma), Pelvic inflammatory disease]
    history: [onset, character, location, radiation, severity, timing, relieving, pmh, meds, fh, lmp, pregnancy,
              {menarche: "(초경|처음 생리)", cycle: "(주기|규칙)", amount: "(양은|양이 많|덩어리|패드)", progression: "(점점|갈수록|예전보다|심해지)",
               noncyclic: "(생리.*(아닐|없을|외)|평소에도|생리 때가 아닌)", gi: "(메스|구역|토하|구토|설사|대변|변비)", sexual: "(성관계|성경험|성생활|남자 ?친구)",
               discharge: "(냉|분비물)", painkiller: "(진통제|타이레놀|이부프로펜|약을)", daily_life: "(학교|수업|결석|빠진|일상)"}]
    exams: [복부 촉진 (Abdominal palpation), 반발압통 (Rebound tenderness), 직장수지검사 (Digital rectal examination)]

- case_id: M33
  playbook: vaginal_discharge
  opening: 이름은 윤수정이고, 나는 서른한 살 여자이다. 이 주 전부터 냉이 많아지고 냄새가 나서 병원에 왔다.
  vital_signs: "혈압 : 116/74 mmHg\n맥박 : 74 회/분\n호흡 : 16 회/분\n체온 : 36.6°C"
  script: |
    이 주 전부터 냉이 많아져서 팬티라이너를 매일 한다. 냉 색깔은 회색빛이 도는 흰색이다. 냉은 물처럼 묽다. 생선 비린내 같은 냄새가 난다. 냄새는 성관계 뒤나 생리가 끝난 뒤에 더 심하다. 덩어리지거나 거품이 있지는 않다. 가렵지는 않다. 외음부가 따갑거나 붓지는 않는다.
    소변볼 때 아프지 않다. 성관계할 때 아프지 않다. 성관계 뒤에 피가 비친 적은 없다. 생리 기간이 아닐 때 피가 비친 적은 없다. 아랫배는 아프지 않다. 열이 나지는 않는다. 외음부에 물집이나 혹은 없다.
    일 년 전에도 비슷한 냄새가 나서 산부인과에서 질정을 넣고 나았다. 한 달 전부터 질 세정제로 질 안쪽까지 매일 씻는다. 최근에 항생제를 먹은 적은 없다.
    마지막 생리는 열이틀 전에 시작했다. 생리 주기는 삼십 일로 규칙적이다. 성관계 파트너는 석 달 전에 새로 사귄 남자 친구 한 명이다. 성관계는 일주일에 한두 번 한다. 피임은 콘돔을 사용하는데 안 쓸 때도 있다. 생리를 제때 해서 임신 가능성은 낮은 것 같다. 남자 친구는 아무 증상이 없다고 한다. 임신이나 출산을 한 적은 없다. 성병 검사를 받아 본 적은 없다.
    앓고 있는 병은 없다. 당뇨는 없다. 먹는 약은 없다. 약 알레르기는 없다. 작년 자궁경부암 검진은 정상이었다. 담배는 하루 다섯 개비씩 팔 년째 피운다. 술은 주말에 맥주를 마신다. 직업은 회사 사무직이다. 회사에서 냄새가 날까 봐 신경이 쓰인다. 혹시 성병은 아닌지 걱정된다.
