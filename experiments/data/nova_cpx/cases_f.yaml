- case_id: M37
  playbook: ped_vomiting_diarrhea
  opening: 이름은 박서아이고, 한 살 여자아이이다. 엄마 이수민, 서른두 살이 보호자로 함께 왔다. 엄마는 서아가 어제부터 토하고 설사를 해서 병원에 데려왔다.
  vital_signs: "혈압 : 측정 안 함\n맥박 : 152 회/분\n호흡 : 34 회/분\n체온 : 37.9°C"
  script: |
    엄마가 대답한다. 서아는 생후 열네 달이다. 어제 아침부터 갑자기 토하기 시작했다. 어제는 먹은 우유와 밥을 여섯 번 토했다. 토한 것은 먹은 음식이었고 초록색 물과 피는 없었다. 어젯밤부터는 설사를 한다. 설사는 물 같은 모양이고 노란색이다. 설사에서 시큼한 냄새가 난다. 설사는 지금까지 여덟 번 했다. 변에 피나 코 같은 점액은 없다. 오늘 아침부터는 토하는 횟수가 줄었다.
    어제 열이 나서 재 보니 삼십팔 도 이 부였다. 지금은 잘 먹지 않고 물이나 우유도 조금만 먹는다. 소변은 잘 안 보고 양도 적다. 기저귀는 어제저녁 이후로 오늘 아침에 한 번만 조금 젖었다. 울 때 눈물이 적게 나온다. 입술과 입안이 말라 보인다. 아이가 처지고 보채지만 안아 주면 달래진다. 갑자기 자지러지게 울면서 다리를 배 쪽으로 끌어당긴 적은 없다. 배가 불러 보이지는 않는다. 경련은 없었다. 기침이나 콧물은 없다. 몸에 발진은 없다.
    평소에는 생우유와 유아식을 잘 먹었다. 어린이집 같은 반에 비슷하게 토하고 설사한 아이가 두 명 있었다. 집에서 다른 식구는 괜찮다. 새로 먹인 음식은 없다. 머리를 부딪힌 적은 없다. 보름 전 예방접종 때 잰 몸무게는 십 키로그람이었다. 집에서 보리차를 먹였는데 먹으면 토했다. 따로 먹인 약은 없다.
    만삭에 자연분만으로 태어났다. 로타바이러스 백신까지 예방접종은 모두 맞았다. 걸음마를 시작했고 발달은 또래와 같다. 큰 병이나 입원한 적은 없다. 약 알레르기는 없다. 가족 중에 특별한 병은 없다. 아이가 기운이 없어서 걱정된다.
  exams:
    전반적 외관 시진 (General appearance): 보챔(+), 경도 처짐(+), 안아 주면 달래짐, 의식 명료, 안구 함몰(+)
    활력징후 측정 (Vital signs): 152회/분, 34회/분, 37.9°C
    체중 측정 (Body weight): 9.3kg (보름 전 10kg, 약 7% 감소)
    대천문 촉진 (Anterior fontanelle): 약간 함몰(+)
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(-/-), 안구 함몰(+)
    구강 점막 시진 (Oral mucosa inspection): 입술·구강 점막 건조(+)
    피부 긴장도 확인 (Skin turgor): 감소, 집었다 놓으면 천천히 펴짐(약 1-2초)
    모세혈관 재충전 시간 (Capillary refill time): 2.5초 (지연)
