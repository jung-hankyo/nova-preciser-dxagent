- case_id: M30
  playbook: abnormal_uterine_bleeding
  opening: 이름은 최은숙이고, 나는 쉰아홉 살 여자이다. 폐경된 지 사 년이 지났는데 한 달 전부터 질에서 피가 비쳐서 병원에 왔다.
  vital_signs: "혈압 : 142/86 mmHg\n맥박 : 78 회/분\n호흡 : 16 회/분\n체온 : 36.6°C"
  script: |
    한 달 전에 처음으로 속옷에 갈색 피가 묻어 나왔다. 피가 계속 나오지는 않고 사나흘씩 비쳤다가 멈추기를 세 번 했다. 요즘은 피 색깔이 선홍색이다. 피의 양은 하루에 패드를 두세 번 갈 정도이다. 핏덩어리는 없다. 피가 없을 때도 분홍빛 물 같은 냉이 나온다. 폐경 뒤에 이런 적은 이번이 처음이다.
    배는 아프지 않고 가끔 아랫배가 묵직하다. 냉에서 냄새는 나지 않는다. 성관계 뒤에 피가 난 적은 없다. 질이 마르거나 따갑지는 않다. 열이 나지는 않는다. 소변이나 대변에 피가 섞이지는 않는다. 코피나 멍이 잘 생기지는 않는다. 어지러운 적은 없다. 피곤하거나 입맛이 떨어지지는 않았다. 체중 변화는 없다.
    마지막 생리는 사 년 전, 쉰다섯 살 때였다. 초경은 열세 살에 했다. 젊을 때부터 생리 주기가 두세 달에 한 번으로 불규칙했다. 아이가 생기지 않아서 임신이나 출산 경험은 없다. 폐경이 돼서 임신 가능성은 없다. 피임은 하지 않는다. 남편과 성관계는 두세 달에 한 번 한다. 여성호르몬제는 먹은 적이 없다.
    앓고 있는 병은 당뇨와 고혈압이다. 당뇨는 십 년 전, 고혈압은 칠 년 전에 진단받았다. 먹는 약이 있는데 메트포르민과 암로디핀이다. 아스피린은 먹지 않는다. 유방암을 앓은 적은 없다. 수술 받은 적은 없다. 입원한 적도 없다. 약 알레르기는 없다. 자궁경부암 검사는 오 년 전에 받았고 정상이었다.
    키는 백오십오 센티미터이고 몸무게는 칠십오 키로그람이다. 운동은 거의 하지 않는다. 가족 중에는 어머니가 대장암 수술을 받았다. 담배는 피운 적이 없다. 술은 마시지 않는다. 남편과 둘이 사는 주부이다. 혹시 암이 아닌지 걱정된다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-), 비만 (키 155cm, 몸무게 75kg, BMI 31.2)
    활력징후 측정 (Vital signs): 142/86mmHg, 78회/분, 16회/분, 36.6°C
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(-/-), 황달(-/-)
    점상출혈 확인 (Petechiae and purpura): 점상출혈(-), 멍(-)
    쇄골상 림프절 촉진 (Supraclavicular lymph node palpation): 촉지(-/-)
    복부 시진 (Abdominal inspection): 비만형 복부, 팽만(-)
    복부 촉진 (Abdominal palpation): 압통(-), 종괴(-)
    간·비장 촉진 (Liver and spleen palpation): 간비종대(-)
    서혜부 림프절 촉진 (Inguinal lymph node palpation): 촉지(-/-)
    외음부 시진 (Vulvar inspection): 위축(-), 병변(-)
    질경 검사 (Speculum examination): 질 점막 분홍색, 위축(-), 질 병변(-); 자궁경부 외관 정상, 종괴(-); 자궁경부 입구에서 검붉은 혈액이 소량 흘러나옴(+)
    양손 골반 내진 (Bimanual pelvic examination): 비만으로 촉진 제한적; 자궁 약간 커짐, 부드러움, 압통(-), 가동성 정상; 부속기 종괴(-/-)
    하지 말초 진찰 (Peripheral pulse and edema): 부종(-/-)
  key:
    diagnosis: Endometrial cancer
    differential: [Endometrial hyperplasia, Endometrial polyp, Atrophic endometritis or vaginitis, Cervical cancer]
    history: [onset, timing, prior, pmh, meds, surgery, fh, smoking, alcohol, lmp, pregnancy,
              {color: "(색|선홍|검붉|갈색)", amount: "(피의 양|양이 많|양은|패드|얼마나 많|덩어리)", pain: "(아프|통증|복통)",
               discharge: "(냉|분비물)", postcoital: "(성관계.*(피|출혈)|관계 (후|뒤))", hormone: "(호르몬|갱년기)",
               parity: "(출산|분만|아이|자녀)", menarche_cycle: "(초경|처음 생리|주기|규칙)",
               pap: "(자궁경부암|세포 ?검사|자궁암 검사|검진)", weight: "(체중|몸무게|살이)", bleeding_tendency: "(멍|잇몸|코피|피가 잘)"}]
