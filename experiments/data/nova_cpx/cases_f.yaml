- case_id: M34
  playbook: developmental_delay
  opening: 이름은 윤도윤이고, 두 살 남자아이이다. 엄마 김지은, 서른네 살이 보호자로 함께 왔다. 엄마는 도윤이가 또래보다 말이 늦어서 병원에 데려왔다.
  vital_signs: "혈압 : 측정 안 함\n맥박 : 110 회/분\n호흡 : 26 회/분\n체온 : 36.7°C"
  script: |
    엄마가 대답한다. 도윤이는 지금 이십팔 개월이다. 할 줄 아는 단어는 엄마, 아빠, 물, 까까, 빠빠 다섯 개 정도이다. 두 단어를 이어서 말하지는 못한다. 첫 단어는 돌 지나고 두 달쯤 엄마라고 했다. 아기 때 옹알이는 잘했다. 하던 말을 잊어버리거나 못 하게 된 적은 없다.
    말은 잘 알아듣는다. 신발 가져와서 아빠 주라는 심부름도 한다. 코가 어디 있냐고 물으면 손가락으로 가리킨다. 원하는 게 있으면 손가락으로 가리키고 엄마를 쳐다본다. 이름을 부르면 바로 돌아본다. 눈을 잘 맞춘다. 엄마가 웃으면 따라 웃는다. 인형에게 밥 먹이는 흉내를 내며 논다. 같은 행동을 반복하거나 장난감을 줄 세우지는 않는다. 손을 퍼덕이지 않는다. 빠이빠이 하며 손을 흔들고 싫으면 고개를 젓는다. 엄마 말을 따라 하려고 입을 움직인다.
    작은 소리에도 잘 돌아본다. 눈은 잘 보는 것 같다. 신생아 청력 선별검사는 양쪽 모두 통과했다. 중이염은 돌 때 한 번 앓았다. 돌 무렵에 걸었고 지금은 잘 뛴다. 숟가락질을 하고 블록을 여섯 개 쌓는다. 경련을 한 적은 없다.
    임신 중에 특별한 문제는 없었다. 삼십구 주에 자연분만으로 태어났다. 예방접종은 모두 맞았다. 잘 먹고 키와 몸무게는 또래만큼 큰다. 큰 병이나 입원한 적은 없다. 먹는 약은 없다.
    맞벌이라서 두 돌까지 할머니가 아이를 돌봐 주셨다. 할머니가 휴대폰으로 동영상을 자주 보여 줬다. 동영상을 보는 시간은 하루에 서너 시간이었다. 엄마 아빠는 퇴근이 늦어서 책을 읽어 주거나 말을 걸어 줄 시간이 적었다. 넉 달 전부터 어린이집에 다니고 친구들과 잘 어울린다. 영유아 검진에서 언어 발달은 심화평가가 필요하다고 들었다. 가족 중에는 아빠가 어릴 때 말이 늦었던 것 말고는 발달 문제가 없다. 혹시 자폐일까 봐 걱정된다.
  exams:
