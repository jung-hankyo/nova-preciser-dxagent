    differential: [Post-infectious cough, Mycoplasma pneumonia, Pertussis, Foreign body aspiration]
    history: [onset, timing, aggravating, prior, pmh, meds, fh, smoking,
              {night: "(밤|새벽|자다가|잘 때)", wheeze: "(쌕쌕|색색|휘파람|천명)", exercise: "(운동|뛰|달리|체육)", sputum: "가래",
               fever: "(열|체온)", dyspnea: "(숨이|숨 쉬|호흡)", triggers: "(찬 ?바람|먼지|동물|고양이|강아지|꽃가루|애완)",
               atopy: "(아토피|비염|재채기|알레르기|코를)", choking: "(사레|삼킨|먹다가|이물)", whoop: "(기침 끝|흡 소리|흡 하|토하|구토)", vaccine: "예방접종"}]
