              {blood_color: "(색|검|선홍|붉)", mixed: "(섞|묻|휴지)", bowel_habit: "(가늘|변비|설사|묽|습관)", tenesmus: "(덜 본|잔변|시원)",
               weight: "(몸무게|체중|살)", abd_pain: "(배가|복통|배)", colonoscopy: "(대장내시경|내시경)", anticoagulant: "(아스피린|피를 묽|항응고)",
               anemia: "(피곤|어지|숨이)", diet: "(고기|채소|식습관|음식)", anal: "(항문|치질)"}]
