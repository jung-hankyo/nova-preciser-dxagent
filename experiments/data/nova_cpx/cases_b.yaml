               behavior: "(성격|화를|헛것|환각)", mood: "(우울|기분)", gait: "(넘어|걸음|걷)", tremor: "떨리", continence: "(소변 실수|실금)",
               head_injury: "(머리를 다|다친)", stroke: "뇌졸중", sedatives: "(수면제|약)", education: "(학교|교육)", living: "(혼자|같이 사|함께 사)"}]
