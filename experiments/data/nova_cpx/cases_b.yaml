- case_id: L16
  playbook: menstrual_irregularity
  opening: 이름은 정다은이고, 나는 스물네 살 여자이다. 넉 달째 생리를 하지 않아서 병원에 왔다.
  vital_signs: "혈압 : 122/80 mmHg\n맥박 : 76 회/분\n호흡 : 16 회/분\n체온 : 36.6°C"
  script: |
    마지막 생리는 넉 달 전이다. 열네 살에 초경을 했고, 그때부터 생리가 두세 달에 한 번씩 불규칙하게 왔다. 이렇게 넉 달 동안 없었던 적은 처음이라 걱정이 된다.
    일 년 사이에 몸무게가 육 키로그람 늘었다. 턱과 입 주위에 여드름이 자주 나고, 턱과 배에 굵은 털이 나서 신경 쓰인다. 머리카락이 조금 빠진다.
    성관계는 한 적이 없어서 임신 가능성은 없다. 젖꼭지에서 분비물이 나온 적은 없다. 두통이나 시야가 좁아지는 증상은 없다. 더위나 추위를 타지 않고 피곤하지 않다.
    무리하게 다이어트를 하거나 운동을 심하게 하지 않는다. 최근 특별한 스트레스는 없다. 먹는 약은 없고 지병도 없다. 약 알레르기는 없다.
    어머니가 당뇨가 있다. 담배는 안 피우고 술은 가끔 마신다. 대학원생이다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-), 비만
    신체 계측 (Anthropometry): 키 162cm, 체중 76kg, 체질량지수 29.0
    활력징후 측정 (Vital signs): 122/80mmHg, 76회/분, 16회/분, 36.6°C
    피부 시진 (Skin inspection): 턱·입 주위 여드름(+)
    다모증 평가 (Hirsutism): 턱·하복부 성모 증가(+), 수정 페리먼-갤웨이 점수 12점
    흑색가시세포증 시진 (Acanthosis nigricans): 목 뒤 착색(+)
    갑상선 촉진 (Thyroid palpation): 비대(-), 결절(-)
    유즙 분비 확인 (Galactorrhea): 분비(-/-)
    복부 촉진 (Abdominal palpation): 압통(-), 종괴(-)
  key:
    diagnosis: Polycystic ovary syndrome
    history: [pmh, meds, fh, smoking, alcohol,
              {lmp: "(마지막 생리|마지막 월경|언제)", cycle: "(주기|초경|규칙)", pregnancy: "(임신|성관계)", weight: "(몸무게|체중|살)",
               hirsutism: "털", acne: "여드름", galactorrhea: "(젖|유즙|분비물)", pituitary: "(두통|시야)", thyroid: "(더위|추위)",
               diet_exercise: "(다이어트|운동)", stress: "스트레스"}]
    exams: [다모증 평가 (Hirsutism), 흑색가시세포증 시진 (Acanthosis nigricans), 유즙 분비 확인 (Galactorrhea),
            갑상선 촉진 (Thyroid palpation)]

- case_id: L17
  playbook: edema
  opening: 이름은 유시우이고, 일곱 살 남자아이이다. 엄마 김나래, 서른여덟 살이 보호자로 함께 왔다. 엄마는 시우의 얼굴이 일주일 전부터 부어서 병원에 데려왔다.
  vital_signs: "혈압 : 102/64 mmHg\n맥박 : 92 회/분\n호흡 : 20 회/분\n체온 : 36.6°C"
  script: |
    엄마가 대답한다. 일주일 전부터 아침에 일어나면 시우의 눈두덩이 퉁퉁 부어 있다. 오후가 되면 조금 빠지는데, 사흘 전부터는 발목과 정강이도 붓고 신발이 꽉 낀다. 배도 조금 불러 보인다.
    소변에 거품이 많이 생기고 오래 남는다. 소변량은 평소보다 조금 줄었다. 소변 색이 콜라처럼 진하거나 피가 섞이지는 않았다. 일주일 사이 몸무게가 이 키로그람 늘었다.
    이 주 전에 콧물 감기를 앓았다. 목이 붓거나 아프다고 하지는 않았다. 열은 없다. 피부에 발진이나 멍이 없고 관절이 아프다고 하지 않는다. 숨이 차거나 기침하지는 않는다. 배가 조금 아프다고 한다.
    예방접종은 다 맞았다. 만삭 자연분만으로 태어났고 발달은 정상이다. 큰 병을 앓은 적은 없고 먹는 약도 없다. 약 알레르기는 없다.
    가족 중에 콩팥병을 앓은 사람은 없다. 초등학교 일학년이다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-), 안면 부종(+)
    활력징후 측정 (Vital signs): 102/64mmHg, 92회/분, 20회/분, 36.6°C
    안검 부종 시진 (Eyelid edema): 양측 안검 부종(+/+)
    인두 시진 (Pharynx inspection): 발적(-), 편도 비대(-)
    폐 청진 (Lung auscultation): 폐포음, 수포음(-/-), 호흡음 감소(-/-)
    심음 청진 (Heart auscultation): S1·S2 규칙적, 심잡음(-)
    복부 시진 (Abdominal inspection): 경도 팽만(+)
    복수 확인 (Shifting dullness): 이동탁음(+)
    복부 촉진 (Abdominal palpation): 압통(-), 간비종대(-)
    하지 말초 진찰 (Peripheral pulse and edema): 함요부종 양측 정강이(2+/2+)
    피부 시진 (Skin inspection): 발진(-), 자반(-)
