    diagnosis: Nephrotic syndrome (minimal change disease)
    history: [onset, pmh, meds, fh,
              {site: "(어디|얼굴|눈|다리|발)", diurnal: "(아침|오후|저녁)", urine_amount: "(소변 양|소변량|소변을 덜)", urine_look: "(거품|색|피)",
               weight: "(몸무게|체중)", infection: "(감기|목이|인후|편도)", rash_joint: "(발진|멍|관절)", dyspnea: "(숨|기침)",
               vaccine: "예방접종", birth: "(태어|출생|분만)", fever: "열"}]
    exams: [하지 말초 진찰 (Peripheral pulse and edema), 안검 부종 시진 (Eyelid edema), 복수 확인 (Shifting dullness),
