- case_id: L18
  playbook: hematochezia
  opening: 이름은 신동욱이고, 나는 예순일곱 살 남자이다. 두 달 전부터 대변에 피가 섞여 나와서 병원에 왔다.
  vital_signs: "혈압 : 126/74 mmHg\n맥박 : 92 회/분\n호흡 : 16 회/분\n체온 : 36.5°C"
  script: |
    두 달 전부터 대변에 검붉은 피가 섞여 나온다. 일주일에 서너 번 그렇다. 휴지에만 묻는 게 아니라 변에 섞여 있다. 항문이 아프지는 않다.
    대변이 예전보다 가늘어졌고, 변비와 묽은 변이 번갈아 생긴다. 변을 보고 나도 덜 본 것 같은 느낌이 자주 든다. 배가 가끔 더부룩하지만 많이 아프지는 않다. 구토는 없다.
    석 달 사이에 몸무게가 오 키로그람 빠졌고 입맛이 없다. 요즘 쉽게 피곤하고 계단을 오르면 숨이 찬다. 열이나 식은땀은 없다.
    대장내시경은 받아 본 적이 없다. 치질은 없다. 고혈압 약을 먹고 있고, 아스피린이나 피를 묽게 하는 약은 먹지 않는다. 약 알레르기는 없다.
    아버지가 일흔 살에 대장암으로 돌아가셨다. 담배는 하루 한 갑씩 사십 년 피웠고, 술은 일주일에 세 번 마신다. 고기를 좋아하고 채소는 잘 안 먹는다. 은퇴한 공무원이다.
  exams:
    전반적 외관 시진 (General appearance): 급성 병색(-), 마른 체형
    활력징후 측정 (Vital signs): 126/74mmHg, 92회/분, 16회/분, 36.5°C
    결막·공막 시진 (Conjunctiva and sclera inspection): 창백(+/+), 황달(-/-)
    경부 림프절 촉진 (Cervical lymph node palpation): 촉지(-/-)
    폐 청진 (Lung auscultation): 폐포음, 수포음(-/-)
    심음 청진 (Heart auscultation): S1·S2 규칙적, 심잡음(-)
    복부 시진 (Abdominal inspection): 편평, 팽만(-)
    장음 청진 (Bowel sound auscultation): 정상 10회/분
    복부 촉진 (Abdominal palpation): 좌하복부 경도 압통(+), 종괴(-)
    간·비장 촉진 (Liver and spleen palpation): 간비종대(-)
    직장수지검사 (Digital rectal examination): 종괴 촉지(-), 장갑에 검붉은 혈액(+), 치핵(-)
