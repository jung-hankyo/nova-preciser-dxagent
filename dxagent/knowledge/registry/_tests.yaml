- id: test_ecg
  name: 12-lead ECG
  type: poc
  outcomes: [normal, regional_st_elevation, diffuse_st_elevation_pr_depression, st_depression_or_t_inversion, sinus_tachycardia_only]
  background: {normal: 0.6, regional_st_elevation: 0.05, diffuse_st_elevation_pr_depression: 0.03, st_depression_or_t_inversion: 0.15, sinus_tachycardia_only: 0.17}
- id: test_pulse_oximetry
  name: Pulse oximetry
  type: poc
  outcomes: [normal, hypoxia]
  background: {normal: 0.7, hypoxia: 0.3}
  rules:
  - {analyte: spo2, op: lt, value: 92, unit: '%', outcome: hypoxia, else_outcome: normal}
- id: lab_troponin
  name: High-sensitivity troponin
  type: lab
  outcomes: [normal, elevated]
  background: {normal: 0.85, elevated: 0.15}
  rules:
  - {analyte: troponin, op: gt, value: 0.04, unit: ng/mL, outcome: elevated, else_outcome: normal}
- id: lab_d_dimer
  name: D-dimer
  type: lab
  outcomes: [normal, elevated]
  background: {normal: 0.5, elevated: 0.5}
  rules:
  - {analyte: d_dimer, op: gt, value: 500, unit: ng/mL, outcome: elevated, else_outcome: normal}
- id: lab_bnp
  name: BNP
  type: lab
  outcomes: [normal, elevated]
  background: {normal: 0.65, elevated: 0.35}
  rules:
  - {analyte: bnp, op: gt, value: 100, unit: pg/mL, outcome: elevated, else_outcome: normal}
- id: lab_cbc
  name: Complete blood count
  type: lab
  outcomes: [normal, leukocytosis]
  background: {normal: 0.7, leukocytosis: 0.3}
- id: img_chest_xray
  name: Chest X-ray
  type: imaging
  outcomes: [normal, consolidation, pulmonary_edema, pneumothorax, widened_mediastinum, hyperinflation, pleural_effusion]
  background: {normal: 0.5, consolidation: 0.15, pulmonary_edema: 0.1, pneumothorax: 0.03, widened_mediastinum: 0.03, hyperinflation: 0.09, pleural_effusion: 0.1}
- id: img_echocardiography
  name: Transthoracic echocardiography
  type: imaging
  outcomes: [normal, reduced_ef_or_wall_motion, pericardial_effusion, rv_strain]
  background: {normal: 0.6, reduced_ef_or_wall_motion: 0.2, pericardial_effusion: 0.08, rv_strain: 0.12}
- id: img_ctpa
  name: CT pulmonary angiography
  type: advanced_imaging
  outcomes: [no_embolus, filling_defect]
  background: {no_embolus: 0.9, filling_defect: 0.1}
- id: img_ct_aortic_angiography
  name: CT angiography of the aorta
  type: advanced_imaging
  outcomes: [normal, intimal_flap]
  background: {normal: 0.97, intimal_flap: 0.03}
- id: proc_coronary_angiography
  name: Coronary angiography
  type: procedure
  outcomes: [no_culprit_lesion, culprit_lesion]
  background: {no_culprit_lesion: 0.8, culprit_lesion: 0.2}
