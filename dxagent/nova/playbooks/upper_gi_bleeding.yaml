id: upper_gi_bleeding
title: {ko: 토혈·흑색변, en: Hematemesis and melena}
status: draft
reviewer: ""
population: adult
pain: false
match:
  any: [피를 토, 토혈, 검은 변, 변이 검, 짜장 같은 변, 까만 변, 대변이 검, 변이 까맣, 변이 까매, 변이 새까, 흑변, 검은색 변, 까만색 변, 변 색깔이 검, 변 색깔이 까, 변 색이 검, 토할 때 피, 토했는데 피, 토한 것에 피, 피 섞인 토, 피가 섞인 걸 토, 커피색]
  not: [소변이 검, 소변 색이 검, 소변이 까]
history:
  - {id: onset, q: "언제부터 그러셨어요?", item: Onset, p: 1}
  - id: hematemesis
    q: "피를 토하신 적 있나요?"
    item: Hematemesis
    p: 1
    then:
      - {id: amount, q: "피를 얼마나 토하셨어요?", item: Amount, known: "컵|숟가락|사발|그릇|조금|약간|많|줄무늬|ml|밀리"}
      - {id: color, q: "토한 피는 무슨 색인가요?", item: Color of vomitus, known: "빨|선홍|붉|검|커피|갈색|까만"}
      - {id: retching, q: "심하게 토하다가 피가 나왔나요?", item: Retching before bleeding, known: "헛구역|토하다가|구역질"}
  - id: melena
    q: "변이 검게 나오나요?"
    item: Melena
    p: 1
    then:
      - {id: times, q: "검은 변을 몇 번 보셨어요?", item: Frequency, known: "번|회|매번|계속"}
  - {id: orthostatic, q: "일어설 때 어지러우세요?", item: Orthostatic dizziness, p: 1}
  - {id: syncope, q: "정신을 잃은 적이 있나요?", item: Syncope, p: 1}
  - {id: epigastric, q: "명치가 아프세요?", item: Epigastric pain, p: 1}
  - {id: tarry, q: "변이 끈적끈적한가요?", item: Tarry stool, p: 2}
  - {id: heartburn, q: "가슴이 타는 듯이 쓰리나요?", item: Heartburn, p: 2}
  - {id: dysphagia, q: "음식을 삼키기 힘드세요?", item: Dysphagia, p: 2}
  - id: weight
    q: "최근 살이 빠지셨나요?"
    item: Weight loss
    sec: ros
    p: 1
    then:
      - {id: kg, q: "몇 킬로그램 빠졌나요?", item: Weight loss (kg), known: "킬로|kg|키로"}
  - {id: jaundice, q: "눈이 노랗게 변했나요?", item: Jaundice, sec: ros, p: 2}
  - {id: distension, q: "배가 불러 오나요?", item: Abdominal distension, sec: ros, p: 2}
  - {id: epistaxis, q: "코피가 난 적 있나요?", item: Epistaxis, sec: ros, p: 3}
  - {id: liver_dx, q: "간 질환이 있으세요?", item: liver disease, sec: pmh, p: 1}
  - {id: ulcer_dx, q: "위궤양을 앓은 적 있나요?", item: Peptic ulcer, sec: pmh, p: 1}
  - {id: hbv, q: "B형 간염이 있다고 들은 적 있나요?", item: HBV carrier, sec: pmh, p: 2}
  - {id: hf, q: "심부전 진단을 받은 적 있나요?", item: Cardiac failure, sec: pmh, p: 2}
  - {id: nsaid, q: "진통제를 자주 드세요?", item: NSAID, sec: meds, p: 1}
  - {id: aspirin, q: "아스피린을 드시나요?", item: Aspirin, sec: meds, p: 1}
  - {id: anticoag, q: "피를 묽게 하는 약을 드세요?", item: Anticoagulant, sec: meds, p: 1}
  - {id: iron, q: "철분제를 드시나요?", item: Iron supplement, sec: meds, p: 3}
  - {id: fh_gc, q: "가족 중 위암 걸린 분 있나요?", item: "FHx: gastric cancer", sec: fhx, p: 3}
exams:
  - {name: 기립성 혈압 측정, item: V/S, p: 1}
  - {name: 결막·공막 시진, item: H/E/E/N/T, p: 1}
  - {name: 복부 촉진, item: Abdomen, p: 1}
  - {name: 직장수지검사, item: Rectal, p: 1}
  - {name: 간·비장 촉진, item: Abdomen, p: 2}
  - {name: 복수 이동탁음 확인, item: Abdomen, p: 2}
  - {name: 피부 시진, item: Skin, p: 2}
  - {name: 퍼덕떨림 확인, item: Neuro, p: 3}
differential:
  - {en: Peptic ulcer bleeding, ko: 소화성 궤양 출혈, cant_miss: true}
  - {en: Esophageal variceal bleeding, ko: 식도정맥류 출혈, cant_miss: true}
  - {en: Mallory-Weiss tear, ko: 말로리-바이스 열상}
  - {en: Erosive gastritis or esophagitis, ko: 미란성 위염·식도염}
  - {en: Gastric cancer, ko: 위암, cant_miss: true}
  - {en: Esophageal cancer, ko: 식도암}
  - {en: Pseudomelena (iron or bismuth), ko: 가성 흑색변(철분제·비스무트)}
  - {en: Swallowed blood from epistaxis or hemoptysis, ko: 코피·객혈을 삼킨 경우}
tests:
  - {name: "CBC (hemoglobin), PT/INR", for: [Peptic ulcer bleeding, Esophageal variceal bleeding, safety], why: "Hb·응고 확인(GBS·수혈 기준)"}
  - {name: "BUN, creatinine, liver function tests", for: [Peptic ulcer bleeding, Esophageal variceal bleeding], why: "GBS 요소·간질환 확인"}
  - {name: "Blood type and cross-match", for: [safety], why: "수혈 대비"}
  - {name: "Upper endoscopy within 24 hours", for: [Peptic ulcer bleeding, Esophageal variceal bleeding, Mallory-Weiss tear, Erosive gastritis or esophagitis, Gastric cancer, Esophageal cancer], why: "출혈원 확인과 지혈"}
  - {name: "Helicobacter pylori testing", for: [Peptic ulcer bleeding], why: "궤양 재발 방지(제균)"}
  - {name: "Stool occult blood (black stool on iron or bismuth)", for: [Pseudomelena (iron or bismuth)], why: "가성 흑색변 감별"}
  - {name: "Nasopharyngeal inspection or chest X-ray (epistaxis or hemoptysis)", for: [Swallowed blood from epistaxis or hemoptysis], why: "삼킨 피의 출처 확인"}
plan:
  treatment:
    - "금식, 굵은 정맥로 2개 확보, 수액; Hb 7 g/dL 미만이면 수혈(심혈관질환은 8 미만)"
    - "PPI 정주 후 24시간 내 내시경 지혈"
    - "정맥류 의심 시 혈관수축제와 예방적 항생제 후 내시경 결찰"
    - "NSAID 중단, 궤양은 H. pylori 확인 후 제균"
  disposition: "Glasgow-Blatchford 0~1점이면 외래 내시경 가능, 그 외에는 입원하여 24시간 내 내시경; 쇼크·지속 토혈은 응급 소생"
  follow_up:
    - "퇴원 1~2주 내 혈색소 재검"
    - "제균 확인과 위궤양은 8~12주 후 내시경으로 치유 확인"
    - "항혈전제 재개 시점은 심혈관 위험과 함께 결정"
  red_flags: ["다시 피를 토함", "검은 변이 계속됨", "어지러움이나 실신", "식은땀과 가슴 두근거림"]
education:
  - "내시경으로 출혈 부위를 확인할게요."
  - "진통제와 술은 피해 주세요."
  - "내시경 전까지 금식해 주세요."
  - "또 피를 토하면 바로 119를 부르세요."
guidelines:
  - KR_EuropePMC/europepmc_PMC7492499.md
  - US_StatPearls/statpearls_article-30795.md
  - US_StatPearls/statpearls_article-26913.md
notes: >
  v0.8.0: heart failure added, the only Glasgow-Blatchford history item not asked (GBS: BUN, Hb, SBP, pulse, melena,
  syncope, hepatic disease, cardiac failure; GBS 0 gives LR 0.02, Srygley JAMA 2012); a direct hepatitis B question
  added for variceal risk (HBV is the leading cause of cirrhosis in Korea; 77.8% of carriers unaware). Amount, colour
  and retching became follow-ups of hematemesis and episode count a follow-up of melena (quantity and character
  decide severity and Mallory-Weiss), which keeps the plan within 40 turns. Radial pulse palpation gave its slot to
  asterixis (p3) and skin inspection rose to p2 (spider angiomas, palmar erythema): the pulse comes with the vital
  signs. Hemodynamic status first: a postural pulse rise of 30/min or severe postural dizziness signals large blood
  loss (McGee 1999); skip orthostatic BP when supine hypotension or tachycardia is present. Melena on exam LR 25.
  ACG 2021: GBS 0-1 may be managed as outpatients; endoscopy within 24 hours otherwise; restrictive transfusion at
  Hb 7 g/dL. Variceal bleeding: vasoactive drug, antibiotic prophylaxis, band ligation (Baveno VII). Iron and
  bismuth darken stool without blood.
