  - {id: puberty, q: "몸에 털이 나기 시작했나요?", item: Pubertal signs, p: 1}
  - {id: breast, q: "아이 가슴이 나오기 시작했나요?", item: Thelarche, p: 1, only: female}
  - {id: diarrhea, q: "아이가 설사를 자주 하나요?", item: Diarrhea, p: 2}
  - {id: vision, q: "아이가 잘 안 보인다고 하나요?", item: Visual disturbance, p: 2}
  - {id: constipation, q: "아이가 변비가 있나요?", item: Constipation, p: 2}
  - {id: sleep, q: "아이가 잠은 잘 자나요?", item: Sleep, p: 2}
