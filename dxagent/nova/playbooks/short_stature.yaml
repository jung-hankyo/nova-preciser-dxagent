  - {id: velocity, q: "작년보다 키가 얼마나 컸나요?", item: Growth velocity, p: 1}
  - {id: always_small, q: "어릴 때부터 작은 편이었나요?", item: Growth pattern, p: 1}
  - {id: appetite, q: "아이가 밥은 잘 먹나요?", item: Appetite, p: 1}
  - {id: chronic, q: "아이가 자주 아픈 편인가요?", item: Chronic illness, p: 1}
