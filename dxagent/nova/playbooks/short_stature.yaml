id: short_stature
title: {ko: 작은 키, en: Short stature}
status: draft
reviewer: ""
population: child
pain: false
match:
  any: [키가 작, 키가 안 커, 키가 안 자, 키가 잘 안 커, 성장이 느, 또래보다 작, 키 때문에, 키가 크지 않]
  not: []
history:
