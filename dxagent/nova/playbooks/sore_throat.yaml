id: sore_throat
title: {ko: 인후통, en: Sore throat}
status: draft
reviewer: ""
population: adult
pain: true
match:
  any: [목이 아파, 목이 아프, 인후통, 목이 따끔, 목이 칼칼, 침을 삼킬 때 아, 편도가 부, 목구멍이 아, 목이 붓고 아, 목이 따가, 침 삼킬 때, 목이 부어서 아]
  not: [목 뒤, 뒷목, 목덜미, 고개를, 고개가, 어깨, 팔이 저]
history:
  - {id: onset, q: "언제부터 목이 아프셨어요?", item: Onset, p: 1}
  - {id: odynophagia, q: "침을 삼키기도 힘드세요?", item: Unable to swallow saliva, p: 1}
  - {id: unilateral, q: "한쪽 목만 아프세요?", item: Unilateral pain, p: 1}
  - id: fever
    q: "열이 나세요?"
    item: Fever
    p: 1
    then:
      - {id: fever_temp, q: "몇 도까지 올랐나요?", item: Maximum temperature, known: "\\d\\s*도|십.{0,3}도|℃"}
  - {id: cough, q: "기침을 하시나요?", item: Cough, p: 1}
  - {id: rhinorrhea, q: "콧물이 나오나요?", item: Rhinorrhea, p: 1}
  - {id: trismus, q: "입을 벌리기 힘드세요?", item: Trismus, p: 1}
  - {id: dyspnea, q: "숨쉬기 힘드세요?", item: Dyspnea, p: 1}
  - {id: severity, q: "통증은 10점 중 몇 점인가요?", item: NRS, p: 2}
  - {id: voice, q: "목소리가 먹먹하게 변했나요?", item: Muffled voice, p: 2}
  - {id: stridor, q: "숨 쉴 때 거친 소리가 나나요?", item: Stridor, p: 2}
  - {id: hoarse, q: "목이 쉬었나요?", item: Hoarseness, p: 2}
  - {id: neck_lump, q: "목에 멍울이 만져지나요?", item: Cervical lymphadenopathy, p: 2}
  - {id: rash, q: "몸에 발진이 생겼나요?", item: Rash, p: 2}
  - {id: contacts, q: "주변에 아픈 사람이 있나요?", item: Sick contacts, p: 2}
  - {id: ear, q: "귀도 아프세요?", item: Otalgia, sec: ros, p: 3}
  - {id: fatigue, q: "몸이 많이 피곤하세요?", item: Fatigue, sec: ros, p: 3}
  - {id: abd_pain, q: "배도 아프세요?", item: Abdominal pain, sec: ros, p: 3}
  - {id: recurrent, q: "목감기를 자주 앓으시나요?", item: Recurrent pharyngitis, sec: pmh, p: 2}
  - id: antithyroid
    q: "갑상선 약을 드시나요?"
    item: Antithyroid drug
    sec: meds
    p: 2
    then:
      - {id: antithyroid_since, q: "그 약은 언제부터 드셨어요?", item: Antithyroid drug duration, known: "개월|달째|달 전|년|주째|주 전|주일"}
  - {id: sex, q: "최근 새로운 성관계가 있었나요?", item: Sexual exposure, sec: shx, p: 3, only: adult}
exams:
  - {name: 인두 시진, item: H/E/E/N/T, p: 1}
  - {name: 경부 림프절 촉진, item: Neck, p: 1}
  - {name: 구강 점막 시진, item: H/E/E/N/T, p: 1}
  - {name: 전반적 외관 시진, item: General, p: 2}
  - {name: 피부 시진, item: Skin, p: 2}
  - {name: 간·비장 촉진, item: Abdomen, p: 2}
  - {name: 이경 검사, item: H/E/E/N/T, p: 3}
  - {name: 폐 청진, item: Chest, p: 3}
differential:
  - {en: Viral pharyngitis, ko: 바이러스 인두염}
  - {en: Group A streptococcal pharyngitis, ko: A군 연쇄상구균 인두염}
  - {en: Infectious mononucleosis, ko: 전염성 단핵구증}
  - {en: Peritonsillar abscess, ko: 편도주위 농양, cant_miss: true}
  - {en: Epiglottitis, ko: 후두개염, cant_miss: true}
  - {en: Deep neck infection, ko: 심경부 감염, cant_miss: true}
  - {en: "Lemierre syndrome (septic jugular thrombophlebitis)", ko: 레미에르 증후군(패혈성 내경정맥 혈전정맥염), cant_miss: true}
  - {en: Gastroesophageal reflux with throat irritation, ko: 위식도역류에 의한 인후 자극}
  - {en: Subacute thyroiditis, ko: 아급성 갑상샘염}
  - {en: "Drug-induced agranulocytosis (antithyroid drugs)", ko: 약물 유발 무과립구증(항갑상샘제), cant_miss: true}
tests:
  - {name: "Rapid antigen test or throat culture for group A streptococcus (only when the Centor/McIsaac score is not low)", for: [Group A streptococcal pharyngitis, Viral pharyngitis], why: "연쇄상구균 인두염 확인"}
  - {name: "CBC with atypical lymphocytes, EBV serology", for: [Infectious mononucleosis], why: "전염성 단핵구증 확인"}
  - {name: "Contrast-enhanced neck CT (suspected abscess or deep neck infection)", for: [Peritonsillar abscess, Deep neck infection, "Lemierre syndrome (septic jugular thrombophlebitis)"], why: "농양·내경정맥 혈전 확인"}
  - {name: "Blood cultures (persistent fever with unilateral neck pain)", for: ["Lemierre syndrome (septic jugular thrombophlebitis)", Deep neck infection], why: "균혈증 확인"}
  - {name: "Flexible laryngoscopy (pain out of proportion, voice change, stridor; persistent symptoms)", for: [Epiglottitis, Gastroesophageal reflux with throat irritation], why: "후두개·후두 확인"}
  - {name: "CBC with differential (on antithyroid or other marrow-toxic drugs)", for: ["Drug-induced agranulocytosis (antithyroid drugs)"], why: "호중구 감소 확인"}
  - {name: "TSH, free T4, ESR (tender thyroid)", for: [Subacute thyroiditis], why: "아급성 갑상샘염 확인"}
plan:
  treatment:
    - "임상 점수가 낮으면 검사 없이 대증 치료(진통제·수분 섭취)"
    - "연쇄상구균 검사 양성이면 페니실린 또는 아목시실린 10일(알레르기 시 대체약)"
    - "편도주위 농양: 천자·배농과 항생제"
    - "항갑상선제 복용 중 발열·인후통이면 약을 멈추고 즉시 혈구 검사"
  disposition: "대부분 외래; 침을 못 삼킴, 호흡곤란, 개구장애, 목소리 변화는 즉시 응급실(기도 평가)"
  follow_up:
    - "3-5일 뒤 호전 없으면 재평가(농양·단핵구증)"
    - "항생제는 처방 기간을 끝까지 복용"
  red_flags: ["침을 못 삼키고 흘림", "숨쉬기 힘들거나 숨소리가 거칢", "입을 벌리기 힘듦", "한쪽 목이 붓고 열이 계속됨"]
education:
  - "따뜻한 물을 자주 드세요."
  - "검사 결과에 따라 항생제를 쓸게요."
  - "침을 못 삼키거나 숨이 차면 바로 오세요."
guidelines:
  - US_StatPearls/statpearls_article-29526.md
  - US_StatPearls/statpearls_article-30256.md
  - US_StatPearls/statpearls_article-27029.md
notes: >
  v0.8.0 (evidence review 2026-10): IDSA 2025 (Linder, Clin Infect Dis 2026): clinician judgment alone is unreliable;
  use a clinical score (fever, tonsillar swelling or exudate, tender anterior nodes, absence of cough) mainly to
  identify low-probability patients who need no test; test (rapid antigen or culture) before antibiotics and treat
  confirmed group A streptococcus with penicillin or amoxicillin (ACP/CDC 2016; IDSA 2012). A positive fever answer is
  followed by the maximum temperature (over 38 °C scores). Adult epiglottitis is usually afebrile (fever in about 11%;
  Fan 2024): severe pain or odynophagia out of proportion to a near-normal oropharynx needs laryngoscopy; stridor or
  respiratory distress is an airway emergency (stridor item added at p2). Lemierre syndrome added (persistent fever and
  unilateral neck pain after pharyngitis in adolescents and young adults). Agranulocytosis on antithyroid drugs occurs
  mostly in the first months, so the drug is dated. Otoscopy moved to p3; a sexual-exposure item (gonococcal pharyngitis,
  acute HIV) is p3 and adult-only. Match words exclude neck-pain wording (뒷목, 고개, 어깨) so those openings reach the
  neck-pain playbook; a bare "목이 아파요" stays here. Red flags: drooling, trismus, muffled voice, stridor or dyspnea,
  unilateral swelling.
