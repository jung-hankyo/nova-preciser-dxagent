  - US_StatPearls/statpearls_article-30951.md
  - US_StatPearls/statpearls_article-30586.md
notes: >
  v0.8.0 (evidence review): speculum, bimanual and cervical-motion exams limited to sexually active patients;
  sexual-history items to adults (new partner and partner symptoms as follow-ups of the sexual-activity item); never
  had intercourse: no speculum or bimanual; transabdominal ultrasound; rectal exam only if a mass is suspected.
  Vulvar inspection replaces the general skin inspection (erythema, satellite lesions, vesicles, ulcers, atrophy).
  Menopause item added because the engine asks LMP only to age 55 and atrophic vaginitis is listed. Girls under 13:
  foreign body, pinworm and hygiene asked; external inspection only; a sexually transmitted infection in a
  prepubertal child means abuse until proven otherwise (mandatory report to 112 in Korea). CDC STI Treatment
  Guidelines 2021: BV by Amsel (3 of 4: thin homogeneous discharge, clue cells, pH over 4.5, positive whiff test);
  trichomonas by NAAT; empiric PID treatment in a sexually active woman with pelvic pain and cervical motion, uterine
  or adnexal tenderness; retest chlamydia, gonorrhea and trichomonas 3 months after treatment.
