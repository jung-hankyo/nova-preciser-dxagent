plan:
  treatment:
    - "습식 도말·pH 확인 후 원인별 치료: 세균성 질염·트리코모나스는 메트로니다졸, 칸디다는 아졸계 항진균제."
    - "클라미디아·임균 양성이면 항생제로 치료하고 성 파트너도 함께 치료합니다."
    - "골반염 최소 기준(자궁경부 운동 압통 등)을 만족하면 경험적 항생제를 시작합니다."
    - "질 세정을 중단하고 치료가 끝날 때까지 성관계를 피합니다."
  disposition: "대부분 외래 치료; 고열·구토로 경구 치료가 어렵거나 난관난소농양 의심, 임신 중 골반염은 입원."
  follow_up:
    - "1-2주 뒤 증상과 검사 결과를 확인합니다."
    - "클라미디아·임균·트리코모나스 양성이면 치료 3개월 뒤 재검사합니다."
  red_flags: ["고열", "심한 아랫배 통증", "생리가 아닌 출혈"]
education:
  - "분비물 검사를 해 볼게요."
  - "질 세정제는 쓰지 않는 게 좋아요."
  - "열이나 아랫배 통증이 생기면 오세요."
guidelines:
