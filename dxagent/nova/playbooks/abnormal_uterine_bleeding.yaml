  - US_StatPearls/statpearls_article-27521.md
  - US_StatPearls/statpearls_article-21102.md
notes: >
  v0.8.0 (evidence review): pelvic pain raised to p1, the item that flags ectopic pregnancy (ACOG PB 193, 2018);
  speculum and bimanual limited to sexually active patients and the sexual-history items to adults (ACOG CO 754,
  2018); never had intercourse: no speculum or bimanual; transabdominal ultrasound; rectal exam only if a mass is
  suspected. Girls under 13: genital injury, foreign body and breast development asked, external genital inspection
  only, vaginoscopy under sedation; unexplained genital injury needs a safeguarding assessment (mandatory report to
  112 in Korea). Bleeding-disorder screen (ACOG CO 785, 2019) as follow-ups of heavy menses since menarche (surgery or
  dental bleeding, family history); cesarean scar niche added (FIGO 2018 AUB-N); postcoital bleeding differential
  adds cervical polyp or ectropion. Regularity replaced by cycle length. FIGO 2018 normal limits: frequency 24-38
  days, duration up to 8 days, cycle variation under 7-9 days; heavy bleeding when a pad soaks within 1-2 hours or
  clots exceed 2.5 cm (larger than a 500-won coin). Postmenopausal bleeding: transvaginal ultrasound first,
  endometrium 4 mm or less has over 99% negative predictive value (ACOG CO 734, 2018). Korea's national program screens
  the cervix from age 20 every 2 years.
