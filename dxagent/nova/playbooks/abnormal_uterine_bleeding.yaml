  - {name: "PT/INR, aPTT, VWF antigen and activity", for: ["Coagulopathy (von Willebrand disease)", "Iatrogenic bleeding (anticoagulants, hormones, IUD)"], why: "출혈 경향·항응고 상태 확인(초경부터 과다 출혈, 출혈 병력 양성)"}
