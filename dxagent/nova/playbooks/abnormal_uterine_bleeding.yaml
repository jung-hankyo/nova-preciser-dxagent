  - {name: "Endometrial biopsy", for: [Endometrial hyperplasia or cancer], why: "내막 증식증·암 배제(45세 이상, 비대항 에스트로겐, 치료 실패, 폐경 후 내막 4 mm 초과)"}
  - {name: "Pap smear and HPV test", for: [Cervical cancer, Cervical polyp or ectropion], why: "자궁경부 병변 확인"}
  - {name: "NAAT for chlamydia and gonorrhea", for: ["Cervicitis or endometritis (chlamydia, gonorrhea)"], why: "자궁경부염 원인균 확인(월경 사이·성교 후 출혈)"}
  - {name: "Vaginoscopy under sedation", for: ["Prepubertal bleeding (vaginal foreign body, genital injury or abuse, precocious puberty)"], why: "사춘기 전 질 이물·외상·종양 확인"}
  - {name: "LH, estradiol, bone age", for: ["Prepubertal bleeding (vaginal foreign body, genital injury or abuse, precocious puberty)"], why: "유방 발달 동반 시 성조숙증 확인"}
plan:
  treatment:
    - "hCG 음성과 혈색소를 확인한 뒤 PALM-COEIN 원인별로 치료합니다."
    - "배란 장애·내막 원인 출혈: 복합 경구피임약, 프로게스틴 또는 LNG-IUS; 비호르몬 치료는 트라넥삼산·NSAID."
    - "철결핍이면 철분제를 보충하고, 용종·근종은 초음파 확인 후 부인과 시술을 의뢰합니다."
    - "사춘기 전 출혈은 외음부 진찰 후 진정하 질내시경을 의뢰합니다(외래 질경 검사는 하지 않음)."
  disposition: "활력징후가 안정적이고 임신 음성이면 외래 검사·치료; 임신 양성에 복통·어지럼, 1시간에 패드가 흠뻑 젖는 출혈, 활력징후 불안정은 응급실."
  follow_up:
    - "1-2주 뒤 초음파·혈액·조직검사 결과를 확인합니다."
    - "치료 3개월 뒤 출혈량·혈색소를 재평가합니다."
  red_flags: ["어지럼·실신", "1시간에 패드가 흠뻑 젖는 출혈", "심한 아랫배 통증"]
education:
  - "피검사와 초음파 검사를 할게요."
  - "필요하면 자궁내막 검사를 할게요."
  - "어지럽거나 출혈이 많으면 바로 오세요."
