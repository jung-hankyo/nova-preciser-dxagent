      - {id: whoop, q: "기침이 끝날 때 '훕' 소리가 나나요?", item: Inspiratory whoop, known: "훕|흡|들이쉬"}
  - {id: apnea, q: "아이가 숨을 멈춘 적 있나요?", item: Apnea, p: 2}
  - {id: wet, q: "기침할 때 가래 끓는 소리가 나나요?", item: Wet cough, p: 2}
  - {id: lethargy, q: "아이가 축 처지나요?", item: Lethargy, p: 2}
  - {id: drooling, q: "아이가 침을 많이 흘리나요?", item: Drooling, p: 2}
  - {id: exercise, q: "뛰면 기침이 심해지나요?", item: Exercise-induced cough, p: 3}
  - {id: trigger, q: "찬 공기나 먼지에 심해지나요?", item: Triggers, p: 3}
  - {id: prior_wheeze, q: "전에도 쌕쌕거린 적 있나요?", item: Prior wheezing, sec: pmh, p: 2}
