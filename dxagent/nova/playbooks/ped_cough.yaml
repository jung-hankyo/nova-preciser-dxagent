id: ped_cough
title: {ko: 소아 기침·쌕쌕거림, en: Cough or wheeze in a child}
status: draft
reviewer: ""
population: child
pain: false
match:
  any: [기침, 쌕쌕, 숨소리가, 컹컹, 가래, 숨을 헐떡, 숨을 가쁘게, 숨이 차, 숨쉬기 힘들, 숨쉬기가 힘들, 숨 쉬기 힘들, 그르렁]
  not: []
history:
  - {id: onset, q: "아이가 언제부터 기침을 했나요?", item: Onset, p: 1}
  - {id: sound, q: "기침 소리가 어떤가요?", item: Cough character, p: 1}
  - {id: night, q: "밤에 기침이 심해지나요?", item: Nocturnal cough, p: 1}
  - {id: fever, q: "아이가 열이 나나요?", item: Fever, p: 1}
  - {id: rhinorrhea, q: "아이가 콧물이 나나요?", item: Rhinorrhea, p: 1}
  - {id: wheeze, q: "숨쉴 때 쌕쌕 소리가 나나요?", item: Wheezing, p: 1}
  - {id: stridor, q: "숨 들이쉴 때 거친 소리가 나나요?", item: Stridor, p: 1}
  - {id: distress, q: "아이가 숨쉬기 힘들어하나요?", item: Respiratory distress, p: 1}
  - {id: cyanosis, q: "아이 입술이 파래진 적 있나요?", item: Cyanosis, p: 1}
  - {id: feeding, q: "아이가 잘 먹나요?", item: Feeding, p: 1}
  - {id: choking, q: "뭔가 삼키다 사레들린 적 있나요?", item: Choking episode, p: 1}
  - {id: contacts, q: "주변에 기침하는 사람이 있나요?", item: Sick contacts, p: 1}
