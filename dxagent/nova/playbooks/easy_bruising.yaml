  - {name: "Skeletal survey, head imaging", for: ["Physical abuse (child, partner or elder)"], why: "학대가 의심되는 2세 미만 아이의 숨은 골절·두개 내 손상"}
  - {name: "Vitamin C level", for: [Vitamin C or K deficiency], why: "편식·영양 결핍 시 괴혈병 확인"}
plan:
  treatment:
    - "CBC·도말·PT/aPTT 결과에 따라 원인별로 치료합니다."
    - "의심 약물(항혈소판제·NSAID·한약·건강식품)은 처방의와 상의해 중단하거나 조정합니다(항응고제는 임의 중단 금지)."
    - "ITP는 피부 출혈뿐이면 관찰, 점막 출혈이 있으면 스테로이드나 면역글로불린을 씁니다."
    - "비타민 K·C 결핍은 보충하고, 폰빌레브란트병·혈우병은 혈액 전문의가 지혈 계획을 세웁니다."
  disposition: "혈소판·응고검사가 정상인 단순 멍은 외래; 심한 혈소판 감소에 점막 출혈, 발열·창백 동반 혈구감소는 당일 혈액내과 의뢰, 아동 학대 의심은 보호 조치와 112 신고."
  follow_up:
    - "1주 안에 혈액검사 결과를 확인합니다."
    - "ITP나 약물 조정 후 1-2주 간격으로 혈소판 수와 멍을 추적합니다."
  red_flags: ["멎지 않는 코피나 잇몸 출혈", "심한 두통이나 구토", "검은 변이나 피 섞인 소변", "열과 창백·뼈 통증"]
education:
  - "피검사로 원인을 확인할게요."
  - "새 진통제나 한약은 먹지 마세요."
  - "코피가 안 멎거나 머리가 아프면 오세요."
