  - {name: "PT/INR, aPTT", for: ["Medication-related bleeding (anticoagulants, antiplatelets, NSAIDs, herbal products)", "Liver disease coagulopathy (cirrhosis)", Vitamin C or K deficiency, Von Willebrand disease or hemophilia, "Physical abuse (child, partner or elder)"], why: "응고인자 이상·와파린 효과 확인(학대 평가 시 출혈 질환 배제)"}
  - {name: "VWF antigen and activity, factor VIII and IX", for: [Von Willebrand disease or hemophilia], why: "출혈 병력이 뚜렷하거나 aPTT 연장 시"}
