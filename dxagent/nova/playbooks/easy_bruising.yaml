notes: >
  New in v0.8.0 (official KMLE presentation 쉽게 멍이 듦). The bleeding history follows the ISTH-BAT domains (Rodeghiero
  2010: bruising, epistaxis over 10 minutes, minor wounds, gums, heavy menses, surgery and dental extraction,
  joints, family history); mucocutaneous bleeding suggests a platelet or von Willebrand defect, deep joint or muscle
  bleeding a factor deficiency (ASH/ISTH/NHF/WFH 2021 von Willebrand guideline). Children: bruising is a can't-miss
  sign of physical abuse; TEN-4-FACESp (Pierce 2021, sensitivity 95.6%, specificity 87.1%): bruising on the torso,
  ears, neck, frenulum, angle of the jaw, cheeks, eyelids or subconjunctivae in a child under 4 years, any bruise in an
  infant under 4.99 months, or a patterned bruise; "those who don't cruise rarely bruise" (Sugar 1999). Ask the
  mechanism openly, check that it fits the child's development, and exclude a bleeding disorder (CBC, PT, aPTT); in
  Korea medical staff are mandatory reporters (112). Adults: anticoagulants, antiplatelets, NSAIDs and herbal
  products (ginkgo, fish oil) first; liver disease (hepatitis B, 2.9% HBsAg prevalence in Korea; alcohol); senile
  purpura on the forearms; long-term steroids. Fever, pallor, bone pain or splenomegaly with bruising suggests
  leukemia (smear); isolated thrombocytopenia after a viral illness in a well child suggests ITP (ASH 2019:
  observation if skin bleeding only). Fever with petechiae and confusion: consider TTP or DIC (smear for
  schistocytes) and send to the emergency room.
