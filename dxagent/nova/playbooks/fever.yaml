  - {name: "Echocardiography (new murmur or persistent bacteremia)", for: [Infective endocarditis], why: "판막 증식물 확인"}
  - {name: "Abdominal ultrasound or CT (RUQ pain, jaundice, or no focus)", for: [Acute cholangitis, Pyogenic liver abscess], why: "담관 확장·간농양 확인"}
  - {name: "Sputum AFB smear, culture and TB PCR (prolonged fever, cough)", for: [Tuberculosis], why: "결핵 확인"}
  - {name: "FDG PET-CT (classic FUO after baseline work-up)", for: [Lymphoma or other malignancy (prolonged fever)], why: "불명열 원인 부위 확인"}
plan:
  treatment:
    - "원인 부위 확인 후 원인별 치료, 해열제와 충분한 수분 섭취"
    - "쯔쯔가무시 의심(야외 활동·가피): 혈청검사 후 독시사이클린 경험적 치료"
    - "세균 감염 확인 시 배양 후 원인 부위에 맞는 경험적 항생제"
    - "패혈증·호중구감소성 발열 의심 시 1시간 안에 혈액배양 후 광범위 항생제"
  disposition: "국소 감염·안정적이면 외래, 저혈압·의식 변화·호흡곤란·항암치료 중 발열이면 응급실"
  follow_up:
    - "2-3일 후 열과 검사 결과 확인"
    - "38.3도 이상이 3주 넘게 지속되면 불명열 정밀검사"
  red_flags:
    - "의식 저하"
    - "목이 뻣뻣함"
    - "숨이 참"
    - "피부에 붉은 점상 출혈"
education:
  - "피검사와 소변검사를 해 볼게요."
  - "물을 충분히 드시고 쉬세요."
  - "목이 뻣뻣하거나 숨이 차면 오세요."
guidelines:
  - US_StatPearls/statpearls_article-21718.md
  - US_StatPearls/statpearls_article-97831.md
  - US_StatPearls/statpearls_article-27357.md
notes: >
  v0.8.0. Outdoor exposure raised to p1, with its date as a follow-up: October is peak season for scrub typhus
  (about 6,000 cases a year, more than half in November) and SFTS (about 200 cases a year, fatality 18.5%). Vivax
  malaria near the DMZ added (about 700 cases a year, May-October, Paju, Yeoncheon, Gimpo, Goyang, Ganghwa; half
  with long incubation, so cases appear out of season; KDCA), with a DMZ question at p3 and the travel destination
  as a follow-up. Febrile neutropenia added as can't-miss with the date of the last chemotherapy (nadir about 7-14
  days). Past TB raised to p1 through the standard "Tbc / hepatitis" item. Shaking chills now asked as a rigor that
  may have passed (shaking chills LR 4.7 for bacteremia, Coburn 2012 JAMA RCE). Demoted to p3 to keep the plan within
  turns: sputum, sick contacts, weight loss, night sweats (the focus call adds the last two when fever has lasted 2-3
  weeks). Classic FUO: 38.3 °C or more on several occasions for more than 3 weeks without a diagnosis after the initial
  work-up (Petersdorf-Beeson; modern versions use an outpatient work-up). Look for potentially diagnostic clues first;
  without them FDG PET-CT is the imaging of choice (Korean meta-analysis: sensitivity 0.86, specificity 0.66). Causes:
  infection (TB in Korea), malignancy (lymphoma), noninfectious inflammatory disease (adult-onset Still disease,
  vasculitis, Kikuchi disease). qSOFA uses altered mentation: the focus call should add 의식·지남력 평가 when the
  patient seems confused or hypotensive. Red flags: neck stiffness, altered mentation, hypotension, petechial rash,
  dyspnea.
