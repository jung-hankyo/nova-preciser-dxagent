  - {en: Bowel obstruction, ko: 장폐색, cant_miss: true}
  - {en: Acute pancreatitis, ko: 급성 췌장염, cant_miss: true}
  - {en: Acute cholecystitis, ko: 급성 담낭염}
  - {en: Nausea and vomiting of pregnancy, ko: 입덧·임신오조}
  - {en: Diabetic ketoacidosis, ko: 당뇨병케톤산증, cant_miss: true}
  - {en: Raised intracranial pressure, ko: 두개내압 상승, cant_miss: true}
  - {en: Vestibular disorder, ko: 전정 질환}
  - {en: Medication-induced vomiting, ko: 약물 유발 구토}
  - {en: Gastric outlet obstruction, ko: 위출구 폐쇄}
  - {en: Acute myocardial infarction, ko: 급성 심근경색, cant_miss: true}
  - {en: Acute appendicitis, ko: 급성 충수염, cant_miss: true}
  - {en: Adrenal insufficiency, ko: 부신 기능 저하증}
