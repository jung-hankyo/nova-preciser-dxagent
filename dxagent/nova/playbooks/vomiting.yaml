tests:
  - {name: "Electrolytes, BUN, creatinine, glucose, calcium", for: [Acute gastroenteritis, Food poisoning, Diabetic ketoacidosis, Hypercalcemia, Adrenal insufficiency], why: "탈수·전해질·혈당·칼슘 확인"}
  - {name: "CBC", for: [Acute appendicitis, Acute cholecystitis], why: "염증 반응 확인"}
  - {name: "Lipase, liver function tests", for: [Acute pancreatitis, Acute cholecystitis], why: "췌장·담도 원인 확인"}
  - {name: "Urine or serum ketones, venous blood gas (high glucose)", for: [Diabetic ketoacidosis], why: "케톤산증 확인"}
  - {name: "Urine hCG (women 12-55)", for: [Nausea and vomiting of pregnancy, safety], why: "임신 확인(약물·영상 전)"}
  - {name: "Plain abdominal X-ray (supine and erect)", for: [Bowel obstruction, Gastric outlet obstruction], why: "장폐색 확인"}
  - {name: "Abdominal ultrasound or CT as indicated", for: [Acute cholecystitis, Acute appendicitis, Bowel obstruction], why: "담낭·충수·폐색 확인"}
  - {name: "Upper endoscopy (suspected gastric outlet obstruction)", for: [Gastric outlet obstruction], why: "위출구 폐쇄 원인 확인"}
  - {name: "12-lead ECG and troponin", for: [Acute myocardial infarction, safety], why: "심근경색 배제·QT 확인(항구토제 전)"}
  - {name: "Brain CT or MRI (headache, focal signs or central vertigo)", for: [Raised intracranial pressure, Vestibular disorder], why: "중추성 원인 배제"}
  - {name: "Morning cortisol (hypotension, hyponatremia, hyperkalemia)", for: [Adrenal insufficiency], why: "부신 기능 확인"}
  - {name: "Serum drug level if taking digoxin, lithium or theophylline", for: [Medication-induced vomiting], why: "약물 중독 확인"}
plan:
  treatment:
    - "조금씩 자주 경구 수분 보충, 불가능하면 수액과 전해질 교정"
    - "항구토제 투여(QT 연장 약물은 심전도 확인 후)"
    - "원인 치료: 장폐색은 금식·감압·외과 협진, 케톤산증은 수액·인슐린"
  disposition: "경구 섭취 가능하고 탈수 경미하면 외래; 경구 섭취 불가, 중등도 이상 탈수, 담즙·분변성 구토, 심한 두통 동반은 응급 평가"
  follow_up:
    - "24~48시간 내 증상과 소변량 재확인"
    - "검사 이상 시 결과 확인 후 원인 치료"
  red_flags: ["피를 토함", "소변이 줄거나 안 나옴", "심한 복통이나 배가 불러 옴", "심한 두통이나 의식 저하"]
education:
  - "검사 결과를 보고 식사를 정할게요."
  - "피검사로 탈수를 확인할게요."
  - "피를 토하거나 소변이 줄면 오세요."
guidelines:
  - US_StatPearls/statpearls_article-22095.md
  - US_StatPearls/statpearls_article-26081.md
  - KR_EuropePMC/europepmc_PMC6609748.md
notes: >
  v0.8.0: skin turgor moved to priority 3 (no proven value in adults; a dry axilla LR+ 2.8 and moist mucosa or a
  tongue without furrows LR- 0.3 carry the evidence, McGee JAMA 1999); orthostatic BP stays (a pulse rise of 30/min
  or severe postural dizziness), skipped when supine vitals already show shock. Follow-ups: pain before vomiting
  points to a surgical cause (vomiting first suggests gastroenteritis); the amount of blood separates streaks
  (Mallory-Weiss) from a bleed. Adrenal insufficiency and hypercalcemia added as metabolic causes; GLP-1 receptor
  agonists are a common modern drug cause (asked by the new-medication item). Assess dehydration first (intake, urine
  output, orthostatic symptoms). Bilious or feculent vomitus, distension and no flatus suggest obstruction; headache
  with vomiting suggests a central cause; pregnancy and DKA must be excluded. ECG before QT-prolonging antiemetics.
