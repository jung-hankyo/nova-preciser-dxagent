  - {id: hand_clumsy, q: "단추 잠그기가 힘들어졌나요?", item: Hand clumsiness, p: 2}
  - {id: gait, q: "걸을 때 휘청거리나요?", item: Gait imbalance, p: 2}
  - {id: bladder, q: "소변보기가 힘드세요?", item: Urinary dysfunction, p: 2}
  - {id: girdle, q: "아침에 어깨가 뻣뻣하세요?", item: Shoulder girdle stiffness, p: 2}
