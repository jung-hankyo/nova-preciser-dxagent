    q: "최근 사고로 목을 다쳤나요?"
    item: Neck trauma
    p: 1
    then:
      - {id: mechanism, q: "어떤 사고였나요?", item: Mechanism of injury, known: "교통|차|넘어|떨어|추락|다이빙|부딪|운동"}
  - {id: location, q: "목 어디가 아프세요?", item: Location, p: 1}
  - id: radiation
