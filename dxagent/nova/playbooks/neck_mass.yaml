  - {en: Infectious mononucleosis, ko: 전염성 단핵구증}
  - {en: "Salivary gland disease (sialadenitis, salivary tumor)", ko: 침샘 질환(침샘염·침샘 종양)}
tests:
  - {name: "Neck ultrasound", for: [Thyroid nodule or goiter, Thyroid cancer, Reactive lymphadenitis, Tuberculous lymphadenitis, Thyroglossal duct cyst or branchial cleft cyst, "Salivary gland disease (sialadenitis, salivary tumor)", Subacute thyroiditis], why: "결절·림프절·낭종 성상 확인(K-TIRADS)"}
  - {name: "Fine-needle aspiration (with AFB stain, culture and TB PCR for nodes)", for: [Thyroid cancer, Metastatic head and neck cancer, Tuberculous lymphadenitis, Thyroid nodule or goiter], why: "세포 진단·결핵 확인"}
  - {name: "Thyroid function tests", for: [Thyroid nodule or goiter, Subacute thyroiditis], why: "갑상샘 기능 확인"}
  - {name: "CBC, ESR or CRP", for: [Reactive lymphadenitis, Subacute thyroiditis, Histiocytic necrotizing lymphadenitis (Kikuchi disease), Infectious mononucleosis, Lymphoma], why: "염증·혈구 이상 확인"}
  - {name: "EBV serology (VCA IgM) or heterophile antibody", for: [Infectious mononucleosis], why: "전염성 단핵구증 확인"}
  - {name: "Contrast-enhanced neck CT (persistent mass)", for: [Metastatic head and neck cancer, Lymphoma, Tuberculous lymphadenitis], why: "병변 범위·원발 부위 확인"}
  - {name: "Laryngoscopy and nasopharyngoscopy (adult persistent mass)", for: [Metastatic head and neck cancer], why: "두경부 원발암 확인"}
  - {name: "Chest X-ray", for: [Tuberculous lymphadenitis, Lymphoma], why: "폐결핵·종격동 림프절 확인"}
  - {name: "Excisional or core biopsy (FNA nondiagnostic or lymphoma suspected)", for: [Lymphoma, Histiocytic necrotizing lymphadenitis (Kikuchi disease)], why: "조직 진단"}
plan:
  treatment:
    - "세균 감염 소견 없이 2주 넘게 지속되면 항생제 대신 영상·세침검사(AAO-HNS 2017)"
    - "갑상샘 결절: 초음파 K-TIRADS 분류에 따라 세침흡인 또는 경과 관찰"
    - "결핵성 림프절염 확인 시 표준 항결핵제"
    - "악성 의심 시 이비인후과·갑상샘외과·혈액종양내과 의뢰"
  disposition: "대부분 외래 검사, 숨쉬기·삼키기 곤란이나 빠르게 커지는 혹이면 당일 의뢰"
  follow_up:
    - "1-2주 후 초음파·세침검사 결과 확인"
    - "양성 결절은 K-TIRADS에 따라 정기 초음파 추적"
  red_flags:
    - "숨쉬기 힘듦"
    - "삼키기 힘듦"
    - "빠르게 커지는 혹"
    - "목소리 변화"
education:
  - "목 초음파 검사를 해 볼게요."
  - "필요하면 세침검사를 할게요."
  - "숨쉬기나 삼키기 힘들면 바로 오세요."
guidelines:
  - US_StatPearls/statpearls_article-40409.md
  - US_StatPearls/statpearls_article-30147.md
  - US_EuropePMC/europepmc_PMC9422615.md
notes: >
  v0.8.0. Past TB raised to p1 through the standard "Tbc / hepatitis" item (TB lymphadenitis is common in Korea).
  Growth rate and kilograms lost are follow-ups; unilateral ear fullness at p3 (nasopharyngeal carcinoma, with
  otoscopy). AAO-HNS 2017: do not routinely give antibiotics for a neck mass without signs of bacterial infection (KAS
  1); a mass without an infectious history present 2 weeks or more without fluctuation, or of uncertain duration, is at
  increased risk of malignancy (KAS 2a): order contrast CT or MRI, FNA before open biopsy, examine the upper
  aerodigestive tract. K-TIRADS 2021 FNA size thresholds (Ultrasonography supplementary table): K-TIRADS 5 over 1 cm
  (selectively over 0.5 cm), K-TIRADS 4 over 1-1.5 cm, K-TIRADS 3 over 2 cm, K-TIRADS 2 no routine FNA; this avoids
  advising FNA for sub-centimetre nodules (Korean overdiagnosis). Concerning features: age over 40, hard fixed or
  growing mass, size over 1.5 to 2 cm persisting beyond 2 weeks, smoking and alcohol, dysphagia, hoarseness, weight
  loss, night sweats. A midline mass moving with swallowing is thyroid or thyroglossal.
