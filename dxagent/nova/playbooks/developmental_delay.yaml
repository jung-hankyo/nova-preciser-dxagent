  - {en: Autism spectrum disorder, ko: 자폐스펙트럼장애}
  - {en: Hearing impairment, ko: 청력 장애}
  - {en: Cerebral palsy, ko: 뇌성마비}
  - {en: Isolated expressive language delay, ko: 단순 표현언어 지연}
  - {en: "Neurodegenerative or metabolic disorder (regression)", ko: 퇴행을 동반한 신경퇴행·대사 질환, cant_miss: true}
  - {en: Intellectual disability, ko: 지적장애}
  - {en: "Genetic syndrome (Down syndrome, fragile X syndrome)", ko: 유전 증후군(다운 증후군·취약 X 증후군)}
  - {en: Congenital hypothyroidism, ko: 선천성 갑상샘저하증}
  - {en: "Neuromuscular disease (muscular dystrophy)", ko: 신경근육질환(근이영양증)}
  - {en: Psychosocial deprivation, ko: 환경적 자극 결핍}
tests:
  - {name: "K-DST and formal developmental assessment", for: [Global developmental delay, Intellectual disability, Isolated expressive language delay, Psychosocial deprivation], why: "영역별 지연 정도 확인(4-71개월 K-DST, 필요 시 Bayley)"}
  - {name: "M-CHAT-R/F", for: [Autism spectrum disorder], why: "16-30개월 자폐 선별(18·24개월 권고)"}
  - {name: "Hearing test (ABR or audiometry)", for: [Hearing impairment, Isolated expressive language delay], why: "언어 지연은 모두 청력 확인"}
  - {name: "Vision assessment", for: [Global developmental delay], why: "시력 이상 배제"}
  - {name: "Chromosomal microarray, fragile X testing", for: ["Genetic syndrome (Down syndrome, fragile X syndrome)", Global developmental delay, Intellectual disability, Autism spectrum disorder], why: "전반적 지연·지적장애·자폐의 1차 유전 검사"}
  - {name: "TSH, free T4", for: [Congenital hypothyroidism], why: "갑상샘저하증 배제"}
  - {name: "Creatine kinase", for: ["Neuromuscular disease (muscular dystrophy)"], why: "근긴장 저하·근력 약화 동반 운동 지연"}
  - {name: "Brain MRI", for: [Cerebral palsy, "Neurodegenerative or metabolic disorder (regression)"], why: "신경학적 이상, 퇴행, 소두증·대두증"}
  - {name: "Metabolic screening", for: ["Neurodegenerative or metabolic disorder (regression)"], why: "퇴행·시사 소견 시 대사 질환 확인"}
plan:
  treatment:
    - "확진을 기다리지 말고 조기 중재(언어·물리·작업치료)를 의뢰합니다."
    - "청력 손실이면 보청기·인공와우 등 청각 재활을 시작합니다."
    - "자폐스펙트럼장애가 의심되면 소아정신과 평가와 조기 행동 중재를 연결합니다."
    - "가정에서 상호작용 놀이와 책 읽기를 늘리고 영상 시청을 줄입니다."
  disposition: "외래에서 선별·청력검사 후 소아신경·발달 전문의 의뢰; 퇴행, 경련, 머리둘레 급변은 신속 평가."
  follow_up:
    - "1-3개월 뒤 검사 결과와 중재 반응을 확인합니다."
    - "영유아 검진(K-DST)마다 발달을 재평가합니다."
  red_flags: ["할 줄 알던 것을 못 하게 됨", "경련", "머리가 빨리 커지며 토함"]
education:
  - "발달 검사와 청력 검사를 할게요."
  - "아이와 많이 대화하고 놀아 주세요."
  - "할 줄 알던 걸 못 하면 바로 오세요."
guidelines:
  - US_StatPearls/statpearls_article-20414.md
  - US_StatPearls/statpearls_article-19411.md
  - KR_EuropePMC/europepmc_PMC10774551.md
notes: >
  v0.8.0 (evidence review): gait observation (a sample-table row) replaces the Moro reflex, which has normally
  disappeared by 4-6 months and separates nothing at the usual age of a delay visit (12-36 months; Zafeiriou 2004);
  infant under 6 months: ask for 모로 반사 확인 through the time-out, 9-24 months the parachute reaction (낙하산 반사
  확인). Newborn hearing screen item added (language delay always needs hearing assessment); regression characterised
  by follow-ups (which skill, at what age: language regression at 15-24 months suggests autism, motor or multiple
  domains a neurodegenerative or metabolic disorder); body size demoted (신체 계측 measures it). Record head
  circumference from 신체 계측 (microcephaly or macrocephaly). K-DST (4-71 months, 6 domains; Chung 2020) is the Korean
  national screen; CDC/AAP 2022 milestones are set where 75% of children achieve them; AAP 2020: developmental
  screening at 9, 18 and 30 months, autism-specific screening at 18 and 24 months. Separate motor, language, social
  and global delay; any regression is a red flag; social communication deficits suggest autism.
