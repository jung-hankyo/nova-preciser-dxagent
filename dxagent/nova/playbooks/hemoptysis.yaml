notes: >
  v0.8.0. Past TB raised to p1 through the standard "Tbc / hepatitis" item and TB contact lowered to p2: in a Korean
  tertiary series (Chonnam 2005-2010, n = 221) bronchiectasis (32.6%, often post-TB), active TB (18.5%) and fungus
  ball (10.8%) caused about 60% of hemoptysis; lung cancer 5.9% (Tuberc Respir Dis 73(2)). Post-tuberculous sequelae
  (bronchiectasis, aspergilloma) and NTM lung disease (hemoptysis in 42.6% of a Korean NTM cohort) added to the
  differential. Smoking years for pack-years are asked by the engine after a positive smoking answer; follow-ups ask the anticoagulant's name and kilograms lost.
  First confirm the blood comes from the airway (with cough, frothy, mixed with sputum) rather than the nose or the
  stomach. Massive hemoptysis or any hemoptysis with dyspnea or hypoxemia is an emergency. In Korea bronchiectasis
  (often post-TB), active TB, aspergilloma, NTM and lung cancer lead.
