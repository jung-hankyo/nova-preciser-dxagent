  - {name: "Urine hCG (women 12-55)", for: [safety], why: "임신 확인(항생제·영상 전)"}
  - {name: "CBC, CRP, creatinine; blood cultures if septic or hospitalized", for: [Acute pyelonephritis, Acute bacterial prostatitis], why: "전신 감염·신기능 확인"}
  - {name: "NAAT for chlamydia and gonorrhea (urethritis or cervicitis)", for: ["Urethritis (chlamydia, gonorrhea)", Epididymitis], why: "성매개 감염 확인"}
  - {name: "Vaginal discharge microscopy and pH (vaginal symptoms)", for: [Vaginitis], why: "질염 원인 확인"}
  - {name: "HSV PCR of a vesicle swab", for: [Genital herpes], why: "포진 확인"}
  - {name: "Scrotal Doppler ultrasound (testicular pain)", for: [Epididymitis], why: "부고환염 확인·고환 염전 배제"}
  - {name: "Renal ultrasound or CT (pyelonephritis not improving, stones, recurrence)", for: [Acute pyelonephritis, Urolithiasis], why: "폐쇄·농양·결석 확인"}
  - {name: "Cystoscopy and urine cytology (hematuria persisting after infection, age or smoking)", for: [Bladder cancer, Interstitial cystitis], why: "방광 병변 확인"}
plan:
  treatment:
    - "단순 방광염은 소변검사 확인 후 1차 경구 항생제 단기 치료(지역 내성률 고려)"
    - "신우신염·전립선염은 요배양 후 항생제, 패혈 징후나 구토는 입원 정맥 항생제"
    - "요도염은 NAAT 후 임균·클라미디아 치료와 성 파트너 치료"
    - "질염은 분비물 검사 결과에 따라 치료"
  disposition: "방광에 국한된 감염은 남녀 모두 외래; 고열·옆구리 통증·회음부 통증·요폐는 복잡성 요로감염으로 배양 후 치료, 패혈 징후·임신·구토는 입원"
  follow_up:
    - "2~3일 내 증상 호전 확인, 없으면 요배양 결과로 항생제 조정"
    - "치료 후에도 혈뇨가 지속되면 비뇨의학과 의뢰"
  red_flags: ["고열과 오한", "옆구리 통증", "소변이 안 나옴", "구토로 약을 먹지 못함"]
education:
  - "소변검사를 해 볼게요."
  - "물을 충분히 드세요."
  - "열이 나거나 옆구리가 아프면 오세요."
