notes: >
  v0.8.0: IDSA 2025 complicated UTI guideline: an infection confined to the bladder is uncomplicated in women and in
  men; fever or systemic signs, flank pain, CVA tenderness, pyelonephritis, prostatitis, bacteremia or a catheter
  make it complicated; male sex, diabetes or BPH alone do not. Perineal pain and weak stream are now priority 1 for
  men (prostatitis discriminators); the prostate is palpated gently, never massaged, in acute prostatitis. Vaginal
  irritation raised to priority 1 for women (LR 0.2; dysuria plus frequency without discharge or irritation LR 24.6,
  Bent JAMA 2002). New partner and condom use became follow-ups of the sexual-activity item, which gates the bimanual
  exam. Never had intercourse: no speculum or bimanual; transabdominal ultrasound; rectal exam only if a mass is
  suspected. Fever, flank pain or CVA tenderness = upper tract infection. Vaginal discharge or itching points to
  vaginitis or cervicitis rather than cystitis.
