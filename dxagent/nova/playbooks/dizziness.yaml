plan:
  treatment:
    - "후반고리관 BPPV는 에플리 정복술, 수평반고리관 BPPV는 바비큐 회전법"
    - "전정신경염: 단기간 전정억제제와 조기 전정재활 운동"
    - "기립성 저혈압: 원인 약 조정, 수분 섭취, 천천히 일어나기"
  disposition: "말초성 소견이면 외래 치료; 복시·구음장애·보행 불능·HINTS 중추형·새로 생긴 난청은 즉시 응급실 MRI"
  follow_up:
    - "1-2주 뒤 증상과 두위 변환 검사 재확인"
    - "재발하거나 난청이 동반되면 청력검사와 전정기능검사"
  red_flags: ["말이 어눌하거나 물체가 겹쳐 보임", "혼자 서거나 걷지 못함", "갑자기 생긴 한쪽 난청", "실신이나 가슴 두근거림"]
education:
  - "일어날 때는 천천히 일어나세요."
  - "검사 결과를 보고 치료를 정할게요."
  - "말이 어눌하거나 힘이 빠지면 바로 응급실로 오세요."
guidelines:
