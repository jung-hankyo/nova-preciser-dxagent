  - US_StatPearls/statpearls_article-38044.md
  - US_StatPearls/statpearls_article-24956.md
notes: >
  v0.8.0 (evidence review 2026-10): timing and triggers lead (TiTrATE/ATTEST): a continuous-vs-episodic item was added
  at p1 and the "type" question moved to p2, because 52% of patients chose a different descriptor six minutes later
  while timing and triggers were reliable (Newman-Toker, Mayo Clin Proc 2007). The supine roll test replaces
  extraocular movements (AAO-HNS BPPV guideline 2017: roll test when the history fits BPPV and Dix-Hallpike is negative
  or horizontal; gaze-evoked nystagmus is already in the nystagmus exam). Hearing loss is characterised (one ear,
  sudden): acute vertigo with new unilateral hearing loss may be labyrinthitis, sudden hearing loss or AICA stroke.
  Nausea (near-universal), heart disease and new drugs (covered by the standard questions) moved to p3. Seconds and
  positional = BPPV; days of continuous vertigo with nystagmus after a viral illness = vestibular neuritis; hours with
  hearing loss, tinnitus and fullness = Meniere. Interpret the head impulse test only in continuous vertigo with
  spontaneous nystagmus: there a normal test is a central sign (HINTS 100% sensitive, Kattah 2009; untrained HINTS is
  inaccurate, GRACE-3 2023). A positive Romberg does not separate central from peripheral causes; inability to stand
  or walk unaided (truncal ataxia) is the central sign. The test of skew is not in the exam vocabulary.
