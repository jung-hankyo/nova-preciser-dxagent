notes: >
  v0.8.0. Wells DVT items added at p3 for adults: prior DVT and cancer or cancer treatment (also flags lymphedema
  after cancer surgery or radiation); Wells low probability plus a negative D-dimer excludes DVT without ultrasound
  (Wells 2006 JAMA RCE: prevalence 5/17/53% by tier). New medication added at p2 (pregabalin or gabapentin,
  thiazolidinediones, steroids and estrogen besides calcium channel blockers and NSAIDs); pain of the swollen area
  demoted to p3 (calf pain has an LR near 1 for DVT) to keep the plan within turns. Kilograms gained is a follow-up.
  Lymphedema and preeclampsia added. Unilateral swelling: deep vein thrombosis, cellulitis, venous or lymphatic
  causes. Bilateral: heart, kidney, liver, drugs, hypothyroidism. Periorbital morning edema with foamy urine suggests
  nephrotic syndrome, especially in children; cola-coloured urine after a sore throat suggests post-streptococcal
  glomerulonephritis. A pregnant woman with edema needs BP and urine protein (preeclampsia after 20 weeks).
