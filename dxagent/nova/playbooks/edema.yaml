plan:
  treatment:
    - "원인 질환 치료가 우선(심부전·신증후군·간경변별 치료)"
    - "체액 과다 확인 시 저염식과 이뇨제, 전해질 확인"
    - "약물성(칼슘통로차단제 등) 의심 시 약 변경"
    - "심부정맥혈전증 확인 시 항응고 치료"
  disposition: "대부분 외래 검사, 호흡곤란·흉통 동반이나 한쪽 다리의 갑작스러운 부종은 당일 평가"
  follow_up:
    - "1-2주 후 검사 결과와 체중 변화 확인"
    - "이뇨제 시작 시 1-2주 내 전해질·신기능 확인"
  red_flags:
    - "숨이 차거나 누우면 숨이 막힘"
    - "한쪽 다리가 갑자기 붓고 아픔"
    - "소변량 감소"
    - "가슴 통증"
education:
  - "소변과 피검사를 해 볼게요."
  - "짜게 드시지 않는 게 좋아요."
  - "숨이 차면 바로 오세요."
