tests:
  - {name: "Urine hCG", for: [Ectopic pregnancy, safety], why: "임신 배제(성경험 있으면, 호르몬제·영상 전)"}
  - {name: "Pelvic ultrasound", for: [Primary dysmenorrhea, Endometriosis, Adenomyosis, Uterine leiomyoma, Ovarian cyst, Intrauterine device-related pain, Ectopic pregnancy, Obstructive Mullerian anomaly], why: "이차 원인 확인(경질, 성경험 없으면 경복부·경직장)"}
  - {name: "Pelvic MRI", for: [Obstructive Mullerian anomaly, Endometriosis, Adenomyosis], why: "뮐러관 기형·심부 자궁내막증 의심 시"}
  - {name: "CBC, CRP", for: [Pelvic inflammatory disease], why: "염증·빈혈 확인(발열이나 과다 출혈)"}
  - {name: "NAAT for chlamydia and gonorrhea", for: [Pelvic inflammatory disease], why: "골반염 원인균 확인(성경험 있으면)"}
  - {name: "Diagnostic laparoscopy", for: [Endometriosis], why: "영상 음성이고 경험적 치료에 실패할 때만"}
plan:
  treatment:
    - "NSAID를 생리 시작 1-2일 전이나 통증 시작 즉시 규칙적으로 복용합니다."
    - "효과가 부족하면 임신 배제 후 복합 경구피임약 등 호르몬 치료를 더합니다."
    - "온찜질과 규칙적인 운동을 함께 권합니다."
    - "3-6개월 치료에도 지속되면 자궁내막증 등 이차 원인을 평가합니다."
  disposition: "전형적인 원발성 월경통은 외래 경험적 치료; 발열, 생리와 무관한 심한 통증, 임신 양성은 당일 평가(응급실)."
  follow_up:
    - "3개월 뒤 통증 점수와 결석·결근 일수로 치료 반응을 확인합니다."
    - "반응이 없으면 초음파 재평가 후 부인과에 의뢰합니다."
  red_flags: ["열과 아랫배 통증", "생리 지연 뒤 복통이나 질 출혈", "갑자기 생긴 심한 한쪽 아랫배 통증"]
education:
  - "통증 시작 전에 진통제를 드세요."
  - "배를 따뜻하게 하면 도움이 돼요."
  - "필요하면 초음파 검사를 할게요."
  - "열이 나거나 통증이 심하면 오세요."
guidelines:
  - US_StatPearls/statpearls_article-20798.md
  - KR_EuropePMC/europepmc_PMC11788693.md
  - US_StatPearls/statpearls_article-21734.md
notes: >
  v0.8.0 (evidence review): speculum and bimanual limited to sexually active patients, sexual-history items to adults
  (dyspareunia as a follow-up of the sexual-activity item). Never had intercourse: no speculum or bimanual;
  transabdominal ultrasound; rectal exam only if a mass is suspected; external genital inspection for hymenal patency
  when severe pain dates from menarche. A typical primary dysmenorrhea history in an adolescent who is not sexually
  active needs no pelvic exam (ACOG CO 754, 2018; ACOG CO 760, 2018: empiric NSAID or hormonal treatment, look for
  secondary causes after 3-6 months without response). Obstructive Mullerian anomaly added for adolescents with
  severe pain from menarche unresponsive to NSAIDs; cyclic dysuria and dyschezia support endometriosis (ESHRE 2022,
  which also no longer requires laparoscopy for the diagnosis). Radiation demoted (common in primary dysmenorrhea,
  likelihood ratio near 1). Primary: starts within 1-2 years of menarche, crampy, first 1-3 days; secondary: new or
  worsening after years, dyspareunia, heavy or intermenstrual bleeding, infertility, noncyclic pain. SOGC 345 (2017):
  NSAIDs and hormonal contraception first line.
