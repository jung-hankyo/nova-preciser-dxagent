  - {name: "Electrolytes (sodium), calcium, creatinine", for: [Hypercalcemia, Chronic kidney disease, Arginine vasopressin deficiency or resistance (diabetes insipidus), Primary polydipsia, safety], why: "고칼슘·고나트륨·신기능 확인(약물 전)"}
  - {name: "Serum and urine osmolality (glucose normal)", for: [Arginine vasopressin deficiency or resistance (diabetes insipidus), Primary polydipsia], why: "수분 이뇨·용질 이뇨 감별"}
  - {name: "24-hour urine volume (true polyuria: over 3 L a day)", for: [Arginine vasopressin deficiency or resistance (diabetes insipidus), Primary polydipsia], why: "진성 다뇨 확인"}
  - {name: "Water deprivation test or copeptin (suspected AVP deficiency or resistance)", for: [Arginine vasopressin deficiency or resistance (diabetes insipidus), Primary polydipsia], why: "바소프레신 결핍·저항 확인"}
  - {name: "Serum lithium level (lithium users)", for: ["Drug-induced (SGLT2 inhibitor, lithium, diuretic)"], why: "리튬 농도 확인"}
plan:
  treatment:
    - "혈당 확인 후 당뇨병이면 생활요법과 메트포르민 등 약물 시작(KDA)"
    - "케톤산증·고삼투압 상태 의심 시 수액·인슐린 치료 위해 응급 이송"
    - "고혈당이 없으면 삼투압·수분 제한 검사로 바소프레신 결핍·저항과 일차성 다음증 감별"
    - "원인 약물(SGLT2 억제제·리튬·이뇨제) 확인 후 조정"
  disposition: "대부분 외래, 반복 구토·의식 저하·심한 탈수나 케톤 동반 고혈당이면 응급실"
  follow_up:
    - "1주 내 검사 결과 확인"
    - "당뇨병이면 3개월마다 HbA1c, 매년 눈·콩팥·발 합병증 검사"
  red_flags:
    - "반복되는 구토"
    - "숨이 가쁘고 깊어짐"
    - "의식이 흐려짐"
    - "심한 복통"
education:
  - "혈당과 소변검사를 할게요."
  - "단 음료는 줄이는 게 좋아요."
  - "토하거나 기운이 없으면 바로 오세요."
guidelines:
  - KR_EuropePMC/europepmc_PMC12270580.md
  - US_StatPearls/statpearls_article-36052.md
  - US_StatPearls/statpearls_article-20428.md
notes: >
  v0.8.0. Korean diabetes criteria (KDA 2025, Rec. 1.1): HbA1c 6.5% or more, fasting plasma glucose 126 mg/dL or
  more, 2-hour 75 g OGTT 200 or more, or random glucose 200 or more with classic symptoms; confirm on another day
  unless two criteria are met in one sample. Prediabetes: FPG 100-125, 2-hour 140-199, HbA1c 5.7-6.4%. KDA screens
  from age 35, or from 19 with risk factors. Diabetes insipidus is now arginine vasopressin deficiency (AVP-D,
  central) or resistance (AVP-R, nephrogenic) (2022 international consensus; Korean rendering not verified). SGLT2
  inhibitors cause glycosuria and polyuria without hyperglycemia and can cause euglycemic ketoacidosis: the drug name
  and the glucose value are follow-ups of a known high glucose. Kilograms lost is a follow-up (weight loss with
  ketosis suggests insulin deficiency). Nephrolithiasis at p3 (hypercalcemia clue); mental status maneuver at p3 for
  suspected HHS or DKA. Distinguish true polyuria (over 3 L a day) from frequency with small volumes (urinary tract
  causes). Hyperglycemia is by far the most common cause.
