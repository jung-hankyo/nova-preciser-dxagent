  - {name: "Fasting glucose or HbA1c", for: [Diabetes mellitus], why: "당뇨병 확인"}
  - {name: "Liver function tests, creatinine, electrolytes, albumin", for: [Peptic ulcer or malabsorption, Adrenal insufficiency, Hepatocellular carcinoma (chronic hepatitis B), Eating disorder, "Social or functional causes (isolation, finances, chewing, medications)"], why: "영양 상태·간기능·전해질 확인"}
  - {name: "HBsAg, AFP and liver ultrasound (hepatitis B or liver disease)", for: [Hepatocellular carcinoma (chronic hepatitis B)], why: "간세포암 확인"}
