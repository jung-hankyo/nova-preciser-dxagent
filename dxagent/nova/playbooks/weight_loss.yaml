  - US_StatPearls/statpearls_article-22414.md
  - US_StatPearls/statpearls_article-36052.md
notes: >
  v0.8.0. Clinically significant loss: 5% or more of body weight within 6 to 12 months (Gaddey & Holder, AAFP 2021);
  the usual weight is now a follow-up of the kilograms lost, so the note can state the percentage over months.
  Older-adult causes added (social isolation, finances, chewing problems, medication burden; malignancy up to a
  third, no cause in 6-28%) with living alone and chewing at p3. Past TB raised to p1 through the standard "Tbc /
  hepatitis" item; pulmonary TB marked can't-miss; hepatocellular carcinoma added for chronic hepatitis B carriers.
  Suicide question follows a positive mood answer. Demoted to p3 (overlap or LR near 1): food intake (appetite
  covers it), tremor (postural tremor maneuver), polyuria (thirst covers it), vomiting, family history of cancer, menstrual change (LMP is asked as standard).
  Intentional loss now often follows GLP-1 receptor agonists: ask the drug if the answer is yes. Increased appetite
  with weight loss points to hyperthyroidism, uncontrolled diabetes or malabsorption; decreased appetite to
  malignancy, depression, chronic infection. Korean national cancer screening: gastric endoscopy from 40, colorectal
  stool test from 50 in the national program (the 2015 Korean guideline starts at 45), liver ultrasound and AFP for hepatitis B carriers and cirrhosis.
