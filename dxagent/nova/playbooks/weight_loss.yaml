plan:
  treatment:
    - "검사로 원인 확인 후 원인 치료(갑상샘항진증·당뇨·악성종양 등)"
    - "영양 상담과 고열량 식사, 필요하면 경구 영양 보충"
    - "원인 약물 정리, 치아·저작 문제 치료와 사회적 지원 연계"
  disposition: "외래 단계적 검사, 삼킴곤란·검은 변·지속 구토 등 경보 증상이면 내시경 등 신속 검사 의뢰"
  follow_up:
    - "2주 후 검사 결과 확인"
    - "1-3개월마다 체중 재측정, 원인이 없으면 3-6개월 경과 관찰"
  red_flags:
    - "검은 변이나 혈변"
    - "삼키기 어려움"
    - "지속되는 발열·식은땀"
    - "계속되는 구토"
education:
  - "피검사와 갑상선 검사를 할게요."
  - "식사는 거르지 말고 챙겨 드세요."
  - "검사 결과를 보고 다시 설명할게요."
guidelines:
