  - {name: "Chest X-ray", for: [Lung cancer or other malignancy, Pulmonary tuberculosis], why: "폐암·결핵 확인"}
  - {name: "Sputum AFB smear, culture and TB PCR (cough or abnormal X-ray)", for: [Pulmonary tuberculosis], why: "결핵 확인"}
