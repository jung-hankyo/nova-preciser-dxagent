differential:
  - {en: Acute coronary syndrome, ko: 급성 관상동맥증후군, cant_miss: true}
  - {en: Stable angina, ko: 안정형 협심증}
  - {en: Aortic dissection, ko: 대동맥 박리, cant_miss: true}
  - {en: Pulmonary embolism, ko: 폐색전증, cant_miss: true}
  - {en: Pneumothorax, ko: 기흉, cant_miss: true}
  - {en: Acute pericarditis, ko: 급성 심낭염}
  - {en: Gastroesophageal reflux disease, ko: 위식도역류질환}
  - {en: Costochondritis, ko: 늑연골염}
  - {en: Panic disorder, ko: 공황장애}
  - {en: Pneumonia, ko: 폐렴}
  - {en: Herpes zoster, ko: 대상포진}
tests:
  - {name: "12-lead ECG", for: [Acute coronary syndrome, Stable angina, Acute pericarditis, Pulmonary embolism, Costochondritis, Panic disorder, Herpes zoster], why: "ST 변화·심낭염 소견 확인, 심장 원인 배제"}
  - {name: "Cardiac troponin (serial)", for: [Acute coronary syndrome, Costochondritis, Panic disorder], why: "심근 손상 확인·배제"}
  - {name: "Chest X-ray", for: [Pneumothorax, Pneumonia, Aortic dissection], why: "기흉·폐렴·종격동 확장 확인"}
  - {name: "D-dimer (low or intermediate pretest probability)", for: [Pulmonary embolism], why: "폐색전증 배제"}
  - {name: "CT pulmonary angiography", for: [Pulmonary embolism], why: "폐색전증 확진(고위험 또는 D-dimer 양성)"}
  - {name: "CT angiography of the aorta", for: [Aortic dissection], why: "대동맥 박리 확인"}
  - {name: "Echocardiography", for: [Acute pericarditis, Acute coronary syndrome, Aortic dissection], why: "심낭삼출·벽운동 이상 확인"}
  - {name: "Coronary CT angiography or exercise stress test", for: [Stable angina], why: "안정 시 관상동맥 협착 평가"}
  - {name: "Lipid profile, HbA1c", for: [Stable angina, Acute coronary syndrome], why: "심혈관 위험인자 평가"}
  - {name: "Upper endoscopy (alarm features or no response to PPI)", for: [Gastroesophageal reflux disease], why: "식도염·경보 질환 확인"}
  - {name: "CBC, electrolytes, creatinine", for: [Pneumonia, safety], why: "빈혈·신기능 확인(조영제·항응고 전)"}
plan:
  treatment:
    - "급성 관상동맥증후군 의심 시 금기 없으면 아스피린 후 즉시 응급실 이송"
    - "안정형 협심증: 관상동맥 검사 확인 후 항혈소판제·스타틴, 발작 시 설하 니트로글리세린"
    - "위식도역류 의심(경보 증상 없음): 양성자펌프억제제 경험적 치료"
    - "근골격계 통증: 진통소염제와 안심 설명(심장 원인 배제 후)"
  disposition: "지속 통증·ST 변화·트로포닌 상승·혈역학 불안정이면 즉시 응급실, 저위험이면 외래 심장 검사"
  follow_up:
    - "1-2주 내 외래에서 심장 검사 결과 확인"
    - "혈압·지질·혈당·흡연 등 위험인자 정기 관리"
  red_flags:
    - "5분 넘게 지속되는 가슴 통증"
    - "식은땀·호흡곤란 동반 통증"
    - "등으로 찢어지는 듯한 통증"
    - "실신"
education:
  - "심전도와 혈액검사를 먼저 할게요."
  - "검사 결과를 보고 치료를 정할게요."
  - "통증이 5분 넘게 가면 바로 119를 부르세요."
guidelines:
  - US_StatPearls/statpearls_article-17555.md
  - US_StatPearls/statpearls_article-20023.md
  - US_StatPearls/statpearls_article-100323.md
  - US_StatPearls/statpearls_article-20603.md
notes: >
  v0.8.0. ERROR fixed: the closing line said to call 119 after 20 minutes; 20 minutes defines prolonged rest angina,
  not a safe wait. Call emergency services when discomfort lasts more than a few minutes (AHA warning signs; NHLBI
  Act in Time: within 5 minutes). PERC/Wells items added at p3 for the focus call when PE is in play: hemoptysis,
  estrogen, prior DVT/PE, cancer (PERC sensitivity 0.97; Wells tiers 5/17/53%, Wells 2006 JAMA RCE); claudication
  p3 (PAD LR 2.7, Fanaroff 2015). Relief with rest, exertional threshold and a crescendo pattern are follow-ups of
  exertional pain. Demoted to p3 (LR near 1 or duplicated by the chest-wall palpation maneuver): frequency, nausea,
  palpitation, tenderness. Describe pain as cardiac, possibly cardiac or noncardiac, not "typical/atypical" (AHA/ACC
  2021). Pleuritic, positional, stabbing or palpation-reproducible pain LR 0.2-0.3 for ACS; radiation to one or both
  arms or exertional pain LR 2.3-4.7 (Swap 2005). History, exam and ECG alone neither confirm nor exclude ACS: use
  the HEART score (History, ECG, Age, Risk factors, Troponin; 0-3 low risk LR 0.20, 7-10 high risk LR 13; Fanaroff
  2015 JAMA RCE). Dissection: absence of sudden onset LR- 0.3, BP differential between arms LR+ 5.7 (Klompas 2002);
  raise the both-arm BP maneuver when onset was sudden or pain tearing. Red flags: rest pain over 20 minutes, tearing
  pain to the back, syncope, dyspnea with hypoxia.
