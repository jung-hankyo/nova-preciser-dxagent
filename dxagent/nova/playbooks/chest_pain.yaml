  - {id: estrogen, q: "여성 호르몬제를 드시나요?", item: "Estrogen (OCP/HRT)", sec: meds, p: 3, only: female}
  - {id: fh_heart, q: "가족 중 심장병 있는 분 있나요?", item: "FHx: heart disease", sec: fhx, p: 1}
  - {id: stress, q: "요즘 스트레스가 많으세요?", item: Stress, sec: shx, p: 3}
