id: chest_pain
title: {ko: 흉통, en: Chest pain}
status: draft
reviewer: ""
population: adult
pain: true
match:
  any: [가슴이 아파, 가슴이 아프, 가슴 통증, 흉통, 가슴이 답답, 가슴이 조이, 가슴이 쥐어, 가슴이 뻐근, 가슴이 따끔, 가슴이 찌르, 가슴이 조여, 가슴이 짓눌, 가슴을 누르, 가슴이 찢어, 가슴이 무거, 가슴이 찌릿]
  not: []
history:
  - {id: onset, q: "언제부터 아프셨어요?", item: Onset, p: 1}
  - {id: sudden, q: "갑자기 아프기 시작했나요?", item: Onset mode, p: 1}
  - {id: location, q: "가슴 어느 부위가 아프세요?", item: Location, p: 1}
  - {id: character, q: "어떤 느낌으로 아프세요?", item: Character, p: 1}
  - {id: radiation, q: "아픈 게 다른 곳으로 퍼지나요?", item: Radiation, p: 1}
  - {id: duration, q: "한 번 아프면 얼마나 오래가나요?", item: Duration, p: 1}
  - {id: severity, q: "통증은 10점 중 몇 점인가요?", item: NRS, p: 1}
  - id: exertion
