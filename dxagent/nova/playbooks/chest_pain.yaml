      - {id: threshold, q: "얼마나 움직이면 아프기 시작하나요?", item: Exertional threshold, known: "계단|층|미터|걸으|걸을|뛰"}
      - {id: crescendo, q: "요즘 더 자주 아프세요?", item: Crescendo pattern, known: "자주|잦아|점점|심해"}
  - {id: pleuritic, q: "숨을 깊이 쉬면 더 아프세요?", item: Pleuritic pain, p: 2}
  - {id: positional, q: "몸을 앞으로 숙이면 덜 아프세요?", item: Positional relief, p: 2}
  - {id: syncope, q: "정신을 잃은 적이 있나요?", item: Syncope, p: 2}
  - {id: reflux, q: "신물이 넘어오나요?", item: Acid regurgitation, p: 2}
  - {id: frequency, q: "얼마나 자주 아프세요?", item: Frequency, p: 3}
  - {id: tender, q: "아픈 곳을 누르면 더 아프세요?", item: Chest wall tenderness, p: 3}
  - {id: meal, q: "식사하고 나서 아픈 편인가요?", item: Meal-related, p: 3}
  - {id: dyspnea, q: "숨이 차세요?", item: Dyspnea, p: 1}
  - {id: diaphoresis, q: "아플 때 식은땀이 나나요?", item: Diaphoresis, p: 1}
  - {id: nausea, q: "속이 메스꺼우세요?", item: Nausea, p: 3}
  - {id: palpitation, q: "가슴이 두근거리세요?", item: Palpitation, p: 3}
  - {id: fever, q: "열이 나세요?", item: Fever, sec: ros, p: 2}
  - {id: leg, q: "한쪽 다리가 부은 적 있나요?", item: Unilateral leg swelling, sec: ros, p: 2}
  - {id: cough, q: "기침을 하시나요?", item: Cough, sec: ros, p: 3}
  - {id: hemoptysis, q: "가래에 피가 섞여 나오나요?", item: Hemoptysis, sec: ros, p: 3}
  - {id: vesicle, q: "아픈 부위에 물집이 생겼나요?", item: Vesicular rash, sec: ros, p: 3}
  - {id: trauma, q: "가슴을 부딪힌 적 있나요?", item: Chest trauma, sec: ros, p: 3}
  - {id: heart_dx, q: "심장병을 진단받은 적 있나요?", item: heart disease, sec: pmh, p: 1}
  - {id: lipid, q: "콜레스테롤이 높다고 들으셨어요?", item: dyslipidemia, sec: pmh, p: 1}
  - {id: immobile, q: "최근 오래 누워 지낸 적 있나요?", item: Immobilization, sec: pmh, p: 2}
  - {id: stroke, q: "뇌졸중을 앓은 적 있나요?", item: previous stroke, sec: pmh, p: 3}
