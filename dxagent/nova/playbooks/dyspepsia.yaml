tests:
  - {name: "Upper endoscopy (age 40 or more in Korea, alarm features, or persistent symptoms)", for: [Gastric cancer, Peptic ulcer disease, Gastroesophageal reflux disease, NSAID-induced gastropathy, Functional dyspepsia], why: "위암·궤양 배제(기능성은 정상 내시경)"}
  - {name: "Helicobacter pylori testing (urea breath test or biopsy, off PPI for 2 weeks)", for: [Helicobacter pylori gastritis, Peptic ulcer disease], why: "제균 치료 대상 확인"}
  - {name: "CBC", for: [Gastric cancer, Peptic ulcer disease, Irritable bowel syndrome], why: "빈혈(만성 출혈) 확인"}
  - {name: "Liver function tests, lipase", for: [Biliary colic, Chronic pancreatitis], why: "담도·췌장 원인 확인"}
  - {name: "Abdominal ultrasound (biliary-type pain)", for: [Biliary colic], why: "담석 확인"}
  - {name: "Abdominal CT (weight loss or suspected pancreatic disease)", for: [Pancreatic cancer, Chronic pancreatitis], why: "췌장 종양·석회화 확인"}
  - {name: "12-lead ECG (exertional symptoms or cardiac risk)", for: [Ischemic heart disease presenting as epigastric discomfort], why: "허혈성 심질환 배제"}
plan:
  treatment:
    - "위내시경과 H. pylori 검사 후 양성이면 제균 치료"
    - "궤양·역류 증상은 PPI, 기능성 소화불량은 PPI 또는 위장운동촉진제"
    - "NSAID는 중단하거나 PPI를 함께 처방"
    - "규칙적 식사, 과식·야식·음주 피하기"
  disposition: "경고 증상 없으면 외래 진료; 토혈·흑색변, 운동 시 가슴 불편감은 응급 평가"
  follow_up:
    - "치료 4~8주 후 증상 재평가"
    - "제균 치료 4주 이상 지나 요소호기검사로 제균 확인"
    - "위궤양은 8~12주 후 내시경으로 치유 확인"
  red_flags: ["토혈이나 검은 변", "삼키기 어려움", "체중 감소", "운동할 때 가슴 답답함"]
education:
  - "위내시경 검사를 해 보는 게 좋아요."
  - "식사는 규칙적으로 천천히 하세요."
  - "검은 변이나 피를 토하면 바로 오세요."
guidelines:
  - KR_EuropePMC/europepmc_PMC6955183.md
  - US_StatPearls/statpearls_article-20802.md
  - US_StatPearls/statpearls_article-26913.md
  - KR_EuropePMC/europepmc_PMC13284574.md
notes: >
  v0.8.0: attack duration added (episodic pain lasting 30 minutes to hours separates biliary colic from functional
  dyspepsia); radiation, bloating, nausea and bowel change moved to priority 3 to bring the plan within 40 turns
  (about 46 before); weight-loss follow-ups quantify an alarm feature. Korea: prompt endoscopy for dyspepsia at 40 or
  older (Korean FD guideline 2020, statement 1), and the national programme offers endoscopy every 2 years from 40;
  ask the date of the last endoscopy. Alarm features (weight loss, dysphagia, persistent vomiting, GI bleeding,
  anemia, mass, family history of gastric cancer) predict cancer poorly (Vakil 2006), so the Korean age rule drives
  endoscopy. Functional dyspepsia follows the Rome criteria (Rome V, 2026, for gut-brain interaction disorders);
  H. pylori per the Korean 2025 revised guideline. Exertional epigastric discomfort is ischemic heart disease until
  proven otherwise.
