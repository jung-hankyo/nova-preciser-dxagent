exams:
  - {name: 결막·공막 시진, item: H/E/E/N/T, p: 1}
  - {name: 갑상선 촉진, item: Neck, p: 1}
  - {name: 경부 림프절 촉진, item: Neck, p: 1}
  - {name: 전반적 외관 시진, item: General, p: 2}
  - {name: 심음 청진, item: Heart, p: 2}
  - {name: 간·비장 촉진, item: Abdomen, p: 2}
  - {name: 정동 평가, item: Mental status, p: 2}
  - {name: 심부건반사, item: Neuro, p: 3}
differential:
  - {en: Iron-deficiency anemia, ko: 철결핍빈혈}
  - {en: Hypothyroidism, ko: 갑상샘저하증}
  - {en: Depression, ko: 우울증}
  - {en: Diabetes mellitus, ko: 당뇨병}
  - {en: Obstructive sleep apnea or insufficient sleep, ko: 폐쇄성 수면무호흡·수면 부족}
  - {en: Chronic hepatitis or liver disease, ko: 만성 간염·간질환}
  - {en: Chronic kidney disease, ko: 만성 콩팥병}
  - {en: Malignancy, ko: 악성종양, cant_miss: true}
  - {en: Heart failure, ko: 심부전}
  - {en: Adrenal insufficiency, ko: 부신기능저하증}
  - {en: Medication side effect, ko: 약물 부작용}
  - {en: Myalgic encephalomyelitis/chronic fatigue syndrome (ME/CFS), ko: 근육통성 뇌척수염/만성피로증후군}
tests:
  - {name: "CBC, ferritin", for: [Iron-deficiency anemia, Malignancy], why: "빈혈·철결핍 확인"}
  - {name: "TSH", for: [Hypothyroidism, Myalgic encephalomyelitis/chronic fatigue syndrome (ME/CFS)], why: "갑상샘 기능 확인"}
  - {name: "Fasting glucose or HbA1c", for: [Diabetes mellitus], why: "당뇨병 확인"}
  - {name: "Liver function tests, creatinine, electrolytes", for: [Chronic hepatitis or liver disease, Chronic kidney disease, Adrenal insufficiency, Medication side effect], why: "간·신기능·전해질(저나트륨·고칼륨) 확인"}
  - {name: "HBsAg, anti-HCV", for: [Chronic hepatitis or liver disease], why: "B·C형 간염 선별(병력 부정과 무관하게)"}
  - {name: "ESR or CRP", for: [Malignancy, Myalgic encephalomyelitis/chronic fatigue syndrome (ME/CFS)], why: "염증·전신 질환 선별"}
  - {name: "Urinalysis", for: [Chronic kidney disease, Diabetes mellitus], why: "단백뇨·당뇨 확인"}
  - {name: "Depression screening (PHQ-9)", for: [Depression], why: "우울증 중증도·자살 사고 확인"}
  - {name: "Morning serum cortisol", for: [Adrenal insufficiency], why: "부신기능저하 선별"}
  - {name: "BNP or NT-proBNP (dyspnea or edema)", for: [Heart failure], why: "심부전 확인"}
  - {name: "Home sleep apnea test or polysomnography (snoring, witnessed apnea)", for: [Obstructive sleep apnea or insufficient sleep], why: "수면무호흡 확인"}
  - {name: "Age-appropriate cancer screening (national program)", for: [Malignancy], why: "연령별 암 선별"}
plan:
  treatment:
    - "혈액검사로 빈혈·갑상샘·혈당·간·신기능 확인 후 원인 치료"
    - "원인 질환이 없으면 수면 위생, 규칙적 생활과 활동량 조절"
    - "우울 선별 양성이면 PHQ-9 평가 후 상담·항우울제 고려, 자살 위험 시 즉시 정신건강의학과 연계"
  disposition: "대부분 외래 검사, 자살 생각·체중 감소·발열·출혈 등 경고 소견이 있으면 당일 평가나 의뢰"
  follow_up:
    - "1-2주 후 혈액검사 결과 확인"
    - "원인 불명이면 4-6주 후 증상 재평가"
  red_flags:
    - "죽고 싶은 생각"
    - "의도하지 않은 체중 감소"
    - "검은 변"
    - "지속되는 발열·식은땀"
education:
  - "피검사로 원인을 찾아볼게요."
  - "규칙적으로 자고 일어나세요."
  - "검사 결과를 보고 다시 설명할게요."
guidelines:
  - US_StatPearls/statpearls_article-21640.md
  - US_StatPearls/statpearls_article-23304.md
  - US_StatPearls/statpearls_article-20367.md
notes: >
  v0.8.0. Safety: a positive mood or anhedonia answer is followed by the suicide question (the playbook screened mood
  but never asked about suicide); anhedonia raised to p1 so both PHQ-2 items are always asked. Hepatitis: HBsAg
  prevalence about 2.9% in Korea and 77.8% of carriers unaware (KNHANES), so the standard TB/hepatitis item is raised
  to p1, the direct "B형 간염" question is added at p2, and HBsAg/anti-HCV are tested whatever the history says. Sleep
  hours and witnessed apnea are follow-ups. Demoted to p3 to stay within turns: timing, overwork, daytime sleepiness,
  appetite, polyuria (thirst at p1 covers diabetes). ME/CFS replaces "chronic fatigue syndrome" (IOM 2015: more than
  6 months of substantially reduced activity with fatigue not relieved by rest, post-exertional malaise, unrefreshing
  sleep, plus cognitive impairment or orthostatic intolerance; PEM item at p3). Separate fatigue from sleepiness and
  from weakness. Most outpatient fatigue is explained by sleep, mood, anemia, thyroid, diabetes, drugs. Red flags:
  weight loss, fever, night sweats, bleeding, lymphadenopathy, suicidal thoughts.
