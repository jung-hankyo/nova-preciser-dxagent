  - {id: rest, q: "쉬면 나아지나요?", item: Relief with rest, p: 1}
  - {id: daily, q: "일상생활이 힘들 정도인가요?", item: Functional impact, p: 1}
  - id: sleep
    q: "잠은 잘 주무세요?"
    item: Sleep
    p: 1
    then:
      - {id: sleep_hours, q: "하루에 몇 시간 주무세요?", item: Sleep hours, known: "시간"}
  - id: mood
    q: "기분이 우울하세요?"
    item: Depressed mood
    p: 1
    then:
      - {id: suicidal, q: "죽고 싶다는 생각이 드시나요?", item: Suicidal ideation, known: "죽고|자살", safety: true}
  - id: anhedonia
    q: "즐겁던 일이 재미없어졌나요?"
    item: Anhedonia
    p: 1
    then:
      - {id: suicidal, q: "죽고 싶다는 생각이 드시나요?", item: Suicidal ideation, known: "죽고|자살", safety: true}
  - {id: weight, q: "몸무게가 변했나요?", item: Weight change, p: 1}
  - {id: cold, q: "추위를 많이 타세요?", item: Cold intolerance, p: 1}
  - {id: thirst, q: "목이 자주 마르세요?", item: Polydipsia, p: 1}
  - {id: melena, q: "변이 검게 나온 적 있나요?", item: Melena, p: 1}
  - {id: menorrhagia, q: "생리량이 많은 편인가요?", item: Menorrhagia, sec: ob, p: 1, only: female}
  - id: snoring
    q: "코를 심하게 고세요?"
    item: Snoring
    p: 2
    then:
