  - {id: dyspnea, q: "숨이 차세요?", item: Dyspnea, p: 2}
  - {id: weakness, q: "근육에 힘이 빠지나요?", item: Muscle weakness, p: 2}
  - {id: stress, q: "요즘 스트레스를 받는 일이 있나요?", item: Psychosocial stress, p: 2}
  - {id: timing, q: "하루 중 언제 가장 피곤하세요?", item: Diurnal pattern, p: 3}
  - {id: sleepy, q: "낮에 졸음이 쏟아지나요?", item: Daytime sleepiness, p: 3}
  - {id: appetite, q: "입맛은 어떠세요?", item: Appetite, p: 3}
  - {id: polyuria, q: "소변을 자주 보세요?", item: Polyuria, p: 3}
  - {id: overwork, q: "요즘 무리하신 일이 있나요?", item: Overwork, p: 3}
  - {id: pem, q: "활동한 다음 날 더 피곤하세요?", item: Post-exertional malaise, p: 3}
  - {id: fever, q: "열이 나세요?", item: Fever, sec: ros, p: 2}
  - {id: night_sweat, q: "밤에 식은땀이 나세요?", item: Night sweats, sec: ros, p: 2}
  - {id: heat, q: "더위를 많이 타세요?", item: Heat intolerance, sec: ros, p: 3}
  - {id: bowel, q: "대변 보는 게 달라졌나요?", item: Bowel habit change, sec: ros, p: 3}
  - {id: jaundice, q: "눈이 노랗게 변했나요?", item: Jaundice, sec: ros, p: 3}
