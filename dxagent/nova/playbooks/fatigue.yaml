id: fatigue
title: {ko: 피로, en: Fatigue}
status: draft
reviewer: ""
population: adult
pain: false
match:
  any: [피곤, 피로, 기운이 없, 기력이 없, 무기력, 몸이 처지, 쉽게 지치, 쉽게 지쳐, 몸에 힘이 없]
  not: []
history:
