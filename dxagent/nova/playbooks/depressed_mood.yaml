id: depressed_mood
title: {ko: 우울감, en: Depressed mood}
status: draft
reviewer: ""
population: adult
pain: false
match:
  any: [우울, 기분이 가라앉, 기분이 처지, 의욕이 없, 기분이 안 좋, 죽고 싶, 살고 싶지 않, 슬프고, 슬퍼서, 재미가 없, 하기 싫, 자살, 눈물이 나, 마음이 힘들]
  not: []
history:
  - {id: onset, q: "언제부터 우울하셨어요?", item: Onset, p: 1}
  - {id: trigger, q: "계기가 된 일이 있나요?", item: Precipitating event, p: 1}
  - {id: daily, q: "거의 매일 우울하세요?", item: Pervasiveness, p: 1}
  - {id: anhedonia, q: "즐겁던 일이 재미없어졌나요?", item: Anhedonia, p: 1}
  - {id: sleep, q: "잠은 잘 주무세요?", item: Sleep, p: 1}
  - {id: appetite, q: "입맛은 어떠세요?", item: Appetite, p: 1}
  - {id: energy, q: "기운이 없으세요?", item: Energy, p: 1}
  - {id: concentration, q: "집중하기 힘드세요?", item: Concentration, p: 1}
  - {id: worthless, q: "자신이 쓸모없다고 느끼나요?", item: Worthlessness or guilt, p: 1}
  - {id: si, q: "죽고 싶다는 생각이 드시나요?", item: Suicidal ideation, p: 1}
  - {id: plan, q: "자살 방법을 생각해 본 적 있나요?", item: Suicide plan, p: 1}
  - {id: intent, q: "죽으려는 생각을 실행할 마음이 있나요?", item: Suicidal intent, p: 1}
  - id: prepare
    q: "죽으려고 무언가 준비한 적 있나요?"
    item: Suicidal preparatory behavior
    p: 1
    then:
      - {id: means, q: "그 물건을 지금 가지고 있나요?", item: Access to means, known: "버렸|가지고|집에|사 놨|사놨|모아", safety: true}
  - id: attempt
    q: "자살을 시도한 적 있나요?"
    item: Prior suicide attempt
    p: 1
    then:
      - {id: last_attempt, q: "마지막 시도는 언제였나요?", item: Time of last attempt, known: "년 전|달 전|개월|주 전|일 전|작년|올해|최근|어제|지난", safety: true}
  - {id: mania, q: "기분이 지나치게 들뜬 적 있나요?", item: Manic symptoms, p: 1}
  - {id: less_sleep, q: "잠을 적게 자도 힘이 넘친 적 있나요?", item: Decreased need for sleep, p: 2}
  - {id: weight, q: "체중이 변했나요?", item: Weight change, p: 2}
  - {id: hopeless, q: "앞날이 막막하게 느껴지나요?", item: Hopelessness, p: 2}
  - {id: psychosis, q: "남들이 못 듣는 소리가 들리나요?", item: Auditory hallucination, p: 2}
  - {id: support, q: "도움을 받을 사람이 있나요?", item: Social support, p: 2}
  - {id: anxiety, q: "불안하거나 초조한 편이세요?", item: Anxiety, p: 3}
  - {id: function, q: "일상생활이 힘드세요?", item: Functional impairment, p: 3}
  - {id: slowed, q: "행동이 느려졌다는 말을 듣나요?", item: Psychomotor retardation, p: 3}
  - {id: cold, q: "추위를 많이 타세요?", item: Cold intolerance, sec: ros, p: 3}
  - {id: postpartum, q: "최근 출산하셨나요?", item: Postpartum, sec: ob, p: 3, only: female}
  - {id: psych, q: "정신과 진료를 받은 적 있나요?", item: Psychiatric history, sec: pmh, p: 2}
  - {id: new_drug, q: "최근 새로 먹기 시작한 약이 있나요?", item: New medication, sec: meds, p: 3}
  - {id: fh_dep, q: "가족 중 우울증 있는 분 있나요?", item: "FHx: depression", sec: fhx, p: 3}
  - {id: fh_suicide, q: "가족 중 자살한 분이 있나요?", item: "FHx: suicide", sec: fhx, p: 3}
exams:
  - {name: 정동 평가, item: Mental status, p: 1}
  - {name: 전반적 외관 시진, item: General, p: 1}
  - {name: 의식·지남력 평가, item: General, p: 2}
  - {name: 갑상선 촉진, item: Neck, p: 2}
  - {name: 인지기능 선별검사, item: Neuro, p: 2}
  - {name: 병식 평가, item: Mental status, p: 2}
  - {name: 신체 계측, item: General, p: 3}
differential:
  - {en: Major depressive disorder, ko: 주요우울장애}
  - {en: Persistent depressive disorder, ko: 지속성 우울장애}
  - {en: "Bipolar disorder (depressive episode)", ko: 양극성 장애(우울 삽화)}
  - {en: Adjustment disorder with depressed mood, ko: 우울 기분을 동반한 적응장애}
  - {en: Normal grief, ko: 정상 애도 반응}
  - {en: Substance- or alcohol-induced depressive disorder, ko: 물질·알코올 유발 우울장애}
  - {en: Hypothyroidism, ko: 갑상샘저하증}
  - {en: Generalized anxiety disorder, ko: 범불안장애}
  - {en: High suicide risk, ko: 자살 고위험, cant_miss: true}
tests:
  - {name: "PHQ-9", for: [Major depressive disorder, Persistent depressive disorder, Adjustment disorder with depressed mood, Normal grief], why: "우울 증상 심각도 평가"}
  - {name: "Suicide risk assessment (C-SSRS)", for: [High suicide risk], why: "자살 사고·행동 위험도 평가"}
  - {name: "Mood Disorder Questionnaire", for: ["Bipolar disorder (depressive episode)"], why: "조증·경조증 병력 선별"}
  - {name: "TSH", for: [Hypothyroidism], why: "갑상선 기능 확인"}
  - {name: "CBC, glucose, electrolytes; vitamin B12 in older adults", for: [Major depressive disorder], why: "신체 원인 배제"}
  - {name: "Alcohol use screening (AUDIT)", for: [Substance- or alcohol-induced depressive disorder], why: "알코올 사용 평가"}
  - {name: "GAD-7", for: [Generalized anxiety disorder], why: "동반 불안 평가"}
  - {name: "12-lead ECG (before tricyclics or citalopram)", for: [safety], why: "QT 연장 확인"}
  - {name: "Urine β-hCG (women 12-55, before mood stabilizers)", for: [safety], why: "임신 확인(기분조절제 전)"}
plan:
  treatment:
    - "주요우울장애: SSRI 등 항우울제와 정신치료(인지행동치료) 병행"
    - "항우울제 전 조증·경조증 병력 확인, 양극성이면 기분조절제"
    - "자살 위험이 있으면 안전 계획 수립, 수단 제거, 보호자 연계"
  disposition: "자살 계획·의도·준비 행동이 있으면 당일 정신건강의학과 응급 진료(입원 고려); 없으면 외래 치료"
  follow_up:
    - "항우울제 시작 1-2주 안에 부작용과 자살 사고 재평가"
    - "4-6주 뒤 PHQ-9로 반응 평가, 관해 후 6-12개월 유지"
  red_flags: ["죽고 싶은 생각이 강해짐", "자해나 자살 준비", "잠을 안 자도 지나치게 들뜸", "남들이 못 듣는 소리가 들림"]
education:
  - "치료하면 충분히 좋아질 수 있어요."
  - "죽고 싶은 생각이 들면 바로 연락하세요."
  - "자살예방 상담전화는 109번이에요."
guidelines:
  - US_StatPearls/statpearls_article-24655.md
  - US_VA-DoD/vadod_mdd_vadodmddcpgfinal508.md
  - US_StatPearls/statpearls_article-20367.md
notes: >
  v0.8.0 (evidence review 2026-10): the C-SSRS behaviour item (preparatory acts) was added at p1 with a question on
  access to the means (stockpiled pills, charcoal briquettes: the target of means restriction), and a prior attempt is
  dated (Posner, Am J Psychiatry 2011). Decreased need for sleep added at p2 so that hypomania not called "elevated"
  is caught before an antidepressant. Orientation moved to p2 (relevant mainly in older adults); family history of
  depression to p3 (the standard family-history question covers it). PHQ-2 (pervasive low mood, anhedonia) stays p1:
  cutoff 2 or more, sensitivity 0.91, specificity 0.67 (Levis, JAMA 2020). Major depressive episode: 5 or more of 9
  symptoms for 2 weeks, including depressed mood or anhedonia. Always ask ideation, plan, intent, preparation, means
  and prior attempts directly. Korea's unified suicide prevention line is 109 (from 1 January 2024, replacing 1393
  and the other lines; press reports 2025).
