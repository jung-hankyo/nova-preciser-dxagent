  - US_StatPearls/statpearls_article-18600.md
  - US_StatPearls/statpearls_article-24762.md
notes: >
  v0.8.0 (evidence review): nipple discharge characterised by follow-ups (spontaneous, bloody, unilateral), the split
  between physiologic and pathologic discharge (ACR Appropriateness Criteria 2017); breast inspection (asymmetry,
  dimpling, peau d'orange, nipple retraction or eczema) named as its own maneuver before palpation; supraclavicular
  nodes in place of the general cervical nodes (regional spread); galactorrhea added with a prokinetic question
  (levosulpiride and domperidone raise prolactin, common in Korea). Triple assessment: clinical exam, imaging,
  tissue sampling. Imaging by age (ACR 2017): ultrasound first under 30, pregnant or lactating; mammography or
  ultrasound at 30-39; diagnostic mammography with ultrasound at 40 or more. Korean screening guideline (2015):
  biennial mammography at 40-69; dense breasts, common in Korean women, lower mammographic sensitivity, so ultrasound
  is usually added. BI-RADS 3: 6-month follow-up; 4-5: core biopsy. Concerning: hard irregular fixed mass, skin
  changes, spontaneous single-duct bloody discharge, axillary nodes, postmenopausal age, family history. Men with a
  breast lump have no playbook (population female).
