plan:
  treatment:
    - "삼중 평가(진찰·영상·조직검사) 결과에 따라 치료합니다."
    - "단순 낭종은 증상이 있으면 흡인하고, 섬유선종은 추적 관찰하거나 커지면 절제합니다."
    - "주기성 유방통은 잘 맞는 속옷과 안심 설명, 필요하면 국소 또는 경구 NSAID."
    - "유방염은 수유를 계속하며 항생제로 치료하고, 농양은 배농합니다."
  disposition: "외래 영상검사; BI-RADS 4-5나 병리 이상은 유방외과 의뢰, 고열과 파동 있는 농양은 당일 배농."
  follow_up:
    - "1-2주 뒤 영상·조직검사 결과를 설명합니다."
    - "BI-RADS 3은 6개월 뒤 추적 초음파를 합니다."
  red_flags: ["혹이 빨리 커짐", "피부 함몰이나 귤껍질 모양 변화", "한쪽 젖꼭지의 피 섞인 분비물", "고열과 유방 발적"]
education:
  - "유방 영상검사를 할게요."
  - "필요하면 조직검사를 할게요."
  - "혹이 커지거나 변하면 바로 오세요."
guidelines:
