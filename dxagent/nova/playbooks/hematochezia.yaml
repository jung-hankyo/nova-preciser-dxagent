notes: >
  v0.8.0: anal inspection (항문 시진) replaces liver and spleen palpation: a fissure is diagnosed by gentle inspection
  and a rectal exam may be too painful (ASCRS 2023; 90-99% of fissures are posterior midline, a lateral fissure
  suggests Crohn's disease, TB or malignancy). Crohn's disease or intestinal TB added (Korean pair, Lee 2006).
  Frequency, fatigue and a prior hemorrhoid label moved to priority 3 (a hemorrhoid label anchors the patient and the
  doctor); weight-loss and family-age follow-ups added. Bright red blood on the paper with anal pain suggests
  fissure; painless bright red blood after stool suggests hemorrhoids. Dark red blood mixed in stool, change in bowel
  habit or caliber, weight loss, anemia, age 45 or more (Korean CRC screening guideline 2025 revision: 45-74 years;
  national FIT from 50) or family history require colonoscopy, as does bleeding in a younger patient not explained by
  a seen anal lesion. Clots argue against an upper source (LR 0.05); BUN/creatinine over 30 favours one (LR 7.5,
  Srygley 2012). ACG 2023: stable patients may have colonoscopy electively; an Oakland score identifies low risk.
