plan:
  treatment:
    - "요로감염은 배양 후 항생제, 치료 후 소변검사로 혈뇨 소실 확인"
    - "요로결석은 진통제·수분, 작은 원위 요관결석은 알파차단제 배출 치료"
    - "횡문근융해증은 수액으로 소변량을 유지하고 칼륨·신기능 확인"
    - "핏덩어리로 소변이 막히면 도뇨관 삽입과 방광 세척"
  disposition: "양성 원인이 확인되지 않은 육안적 혈뇨는 나이와 관계없이 비뇨의학과 의뢰(방광내시경·CT 요로조영); 혈전 요폐·빈혈·신기능 저하는 응급"
  follow_up:
    - "치료 후 소변검사로 혈뇨 소실 확인"
    - "저위험 미세혈뇨는 6개월 내 소변검사 재검(AUA/SUFU 2025)"
    - "사구체성 혈뇨는 단백뇨·신기능·혈압을 신장내과에서 추적"
  red_flags: ["핏덩어리로 소변이 막힘", "어지러움", "고열과 옆구리 통증", "소변량이 크게 줄어듦"]
education:
  - "소변검사와 영상검사를 할게요."
  - "필요하면 방광내시경을 할게요."
  - "소변이 막히면 바로 오세요."
