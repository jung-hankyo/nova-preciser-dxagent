notes: >
  v0.8.0: the official presentation is "붉은색 소변" (red urine), which includes non-blood causes, so drugs
  (rifampin, phenazopyridine, others) and strenuous exercise were raised to priority 2, and red food (beet, red
  dragon fruit) and muscle pain (cola-coloured urine with myalgia after exertion: rhabdomyolysis, dipstick heme with
  no RBCs) were added; rhabdomyolysis is listed as can't-miss. Occupational chemicals raised to priority 1 (one of the
  few history items that changes the urothelial-cancer risk category); long-term herbal medicine added at p3
  (aristolochic acid: nephropathy and upper-tract urothelial cancer); weight loss and frequency moved to p3. Painless
  gross hematuria in a smoker or older adult is urothelial cancer until proven otherwise, even on anticoagulants:
  cystoscopy and CT urography for all gross hematuria without a benign cause (AUA/SUFU). Microhematuria (3 or more
  RBC/HPF) is risk-stratified (AUA/SUFU 2020, amended 2025: low/negligible risk repeats urinalysis; age alone no
  longer makes a woman high risk). Dysmorphic RBCs, red cell casts, proteinuria, edema or hypertension suggest a
  glomerular source; IgA nephropathy bleeds within days of a sore throat, post-streptococcal GN after 1-3 weeks.
