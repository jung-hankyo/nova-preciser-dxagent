  - {name: "PSA (men, after shared decision)", for: [Prostate cancer], why: "전립선암 선별"}
  - {name: "Repeat urinalysis after 48-72 hours of rest, after menses or off the suspect food or drug", for: [Exercise-induced hematuria, "Pseudohematuria (menstruation, food, drugs)"], why: "일시적·가성 혈뇨 확인"}
