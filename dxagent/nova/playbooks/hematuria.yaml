  - {name: "CT urography (gross or high-risk hematuria); renal ultrasound (intermediate-risk microhematuria)", for: ["Urothelial carcinoma (bladder, upper tract)", Renal cell carcinoma, Urolithiasis, Polycystic kidney disease], why: "상부요로 종양·결석·낭종 확인"}
