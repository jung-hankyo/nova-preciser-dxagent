notes: >
  v0.8.0: Rovsing sign replaced by McBurney point tenderness (Rovsing has the weakest evidence of the RLQ signs; psoas
  LR+ 2.4 and rigidity LR+ 3.8, Snyder AFP 2018); the focus call may add 요근 징후 or 폐쇄근 징후 for RLQ pain.
  "Pain before vomiting" is now a follow-up of the vomiting item (vomiting before pain argues against appendicitis,
  Wagner JAMA 1996). Relieving factors, duration, appetite, flatus, jaundice, weight loss, prior GI disease and
  vaginal discharge moved to priority 3 to keep the female plan within 40 turns (it ran to about 48-51). Abdominal
  percussion gave its slot to a bimanual pelvic exam for sexually active women (PID minimum criteria: cervical motion,
  uterine or adnexal tenderness, CDC 2021; ectopic pregnancy, ovarian torsion). Never had intercourse: no speculum or
  bimanual; transabdominal ultrasound; rectal exam only if a mass is suspected. Location guides the differential (RLQ
  appendicitis, RUQ biliary, epigastric pancreatitis/ulcer/MI, flank stone or pyelonephritis, lower abdomen pelvic
  causes). Alvarado below 5 makes appendicitis unlikely; it over-predicts in women (Ohle 2011). Exclude pregnancy in
  women 12-55 before imaging or drugs. Early analgesia does not impair diagnostic accuracy. Lipase over 3 times the
  upper limit supports pancreatitis.
  v0.8.0 (integration): relieving factors back at p2, a standard pain-history item; the plan cap may cut it,
  and the backfill after the time-out asks it when turns remain.
