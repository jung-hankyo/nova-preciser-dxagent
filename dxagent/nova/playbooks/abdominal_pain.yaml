  - {en: "Acute cholecystitis, biliary colic or cholangitis", ko: 급성 담낭염·담석 산통·담관염, cant_miss: true}
  - {en: Acute pancreatitis, ko: 급성 췌장염, cant_miss: true}
  - {en: Peptic ulcer disease or perforation, ko: 소화성 궤양·천공, cant_miss: true}
  - {en: Acute gastroenteritis, ko: 급성 위장관염}
  - {en: Ureteral stone, ko: 요관결석}
  - {en: Bowel obstruction, ko: 장폐색, cant_miss: true}
  - {en: Ectopic pregnancy, ko: 자궁외 임신, cant_miss: true}
  - {en: Pelvic inflammatory disease, ko: 골반염}
  - {en: Diverticulitis, ko: 게실염}
  - {en: Acute pyelonephritis, ko: 급성 신우신염}
  - {en: Mesenteric ischemia, ko: 장간막 허혈, cant_miss: true}
  - {en: Acute myocardial infarction (epigastric pain), ko: 급성 심근경색(명치 통증), cant_miss: true}
  - {en: Irritable bowel syndrome, ko: 과민성 장증후군}
