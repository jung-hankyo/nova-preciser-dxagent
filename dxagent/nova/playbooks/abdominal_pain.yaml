tests:
  - {name: "CBC, CRP", for: [Acute appendicitis, "Acute cholecystitis, biliary colic or cholangitis", Diverticulitis, Pelvic inflammatory disease, Irritable bowel syndrome], why: "염증 반응 확인"}
  - {name: "Lipase (amylase only if lipase is unavailable)", for: [Acute pancreatitis], why: "췌장염 확인(정상 상한 3배 이상)"}
  - {name: "Liver function tests (bilirubin, ALP, GGT)", for: ["Acute cholecystitis, biliary colic or cholangitis"], why: "담도 폐쇄·담관염 확인"}
  - {name: "Electrolytes, BUN, creatinine", for: [Acute gastroenteritis, Bowel obstruction, safety], why: "탈수 확인·조영제 전 신기능"}
  - {name: "Urinalysis", for: [Ureteral stone, Acute pyelonephritis], why: "혈뇨·농뇨 확인"}
  - {name: "Serum or urine hCG (women 12-55)", for: [Ectopic pregnancy, safety], why: "임신 배제(영상·약물 전)"}
  - {name: "Abdominal ultrasound", for: ["Acute cholecystitis, biliary colic or cholangitis", Acute appendicitis], why: "담낭·담관·충수 확인"}
  - {name: "Pelvic or transvaginal ultrasound (women)", for: [Ectopic pregnancy, "Ovarian torsion or ruptured ovarian cyst", Pelvic inflammatory disease], why: "자궁외 임신·난소 확인"}
  - {name: "Abdominal CT (contrast)", for: [Acute appendicitis, Diverticulitis, Bowel obstruction, Peptic ulcer disease or perforation, Ureteral stone], why: "충수염·게실염·폐색·천공 확인"}
  - {name: "CT angiography (suspected mesenteric ischemia or aortic aneurysm)", for: [Mesenteric ischemia, Ruptured abdominal aortic aneurysm], why: "혈관 원인 확인"}
  - {name: "Erect chest X-ray and plain abdominal X-ray", for: [Peptic ulcer disease or perforation, Bowel obstruction], why: "유리 공기·장폐색 확인"}
  - {name: "12-lead ECG and troponin (epigastric pain with cardiac risk)", for: [Acute myocardial infarction (epigastric pain)], why: "심근경색 배제"}
  - {name: "NAAT for chlamydia and gonorrhea (sexually active women)", for: [Pelvic inflammatory disease], why: "골반염 원인균 확인"}
plan:
  treatment:
    - "금식, 수액, 통증 조절(진통제는 진단을 늦추지 않음)"
    - "영상검사로 충수염·담낭염·천공·폐색 확인 시 외과 협진"
    - "hCG 양성이면 산부인과 협진, 골반염은 항생제 시작"
  disposition: "복막자극 징후, 활력징후 불안정, 임신 반응 양성 복통은 응급 평가; 원인 불명의 경미한 복통은 외래 재평가"
  follow_up:
    - "원인이 정해지지 않으면 24시간 내 재진하여 복부 재진찰"
    - "검사 결과 확인 후 원인 질환별 치료와 추적"
  red_flags: ["점점 심해지는 복통", "고열이나 반복되는 구토", "토혈이나 검은 변", "어지럼이나 실신"]
education:
  - "피검사와 복부 영상검사를 할게요."
  - "검사 전까지는 금식해 주세요."
  - "통증이 심해지면 바로 오세요."
