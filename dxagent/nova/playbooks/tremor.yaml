id: tremor
title: {ko: 떨림, en: Tremor}
status: draft
reviewer: ""
population: adult
pain: false
match:
  any: [손이 떨, 손떨림, 떨림, 몸이 떨리, 머리가 떨, 손이 덜덜, 떨려, 떨리]
  not: [가슴이 떨, 추워서 떨, 오한, 열이 나, 열이 있, 심장이 떨]
history:
  - {id: onset, q: "언제부터 떨리셨어요?", item: Onset, p: 1}
  - {id: site, q: "어디가 떨리세요?", item: Location, p: 1}
  - {id: rest, q: "가만히 있을 때 떨리나요?", item: Rest tremor, p: 1}
  - {id: action, q: "물건을 잡을 때 떨리나요?", item: Action tremor, p: 1}
  - {id: one_side, q: "한쪽만 떨리나요?", item: Laterality, p: 1}
  - {id: course, q: "점점 심해지고 있나요?", item: Course, p: 1}
  - {id: slow, q: "움직임이 느려졌나요?", item: Bradykinesia, p: 1}
  - {id: gait, q: "걸음이 짧아졌나요?", item: Shuffling gait, p: 1}
  - {id: turn_bed, q: "누워서 돌아눕기가 힘드세요?", item: Difficulty turning in bed, p: 2}
  - {id: alcohol_relief, q: "술을 마시면 덜 떨리나요?", item: Alcohol responsiveness, p: 2}
  - {id: stiff, q: "몸이 뻣뻣해졌나요?", item: Rigidity, p: 2}
  - {id: falls, q: "자주 넘어지시나요?", item: Falls, p: 2}
  - {id: writing, q: "글씨가 작아졌나요?", item: Micrographia, p: 2}
  - {id: posture, q: "팔을 앞으로 뻗으면 떨리나요?", item: Postural tremor, p: 3}
  - {id: trigger, q: "긴장하면 더 떨리나요?", item: Stress aggravation, p: 3}
  - {id: head_voice, q: "고개나 목소리도 떨리나요?", item: Head or voice tremor, p: 3}
  - {id: heat, q: "더위를 많이 타세요?", item: Heat intolerance, sec: ros, p: 2}
  - {id: palpitation, q: "가슴이 두근거리세요?", item: Palpitation, sec: ros, p: 2}
  - {id: weight, q: "최근 살이 빠지셨나요?", item: Weight loss, sec: ros, p: 2}
  - {id: anxiety, q: "불안하거나 초조한 편이세요?", item: Anxiety, sec: ros, p: 3}
  - {id: smell, q: "냄새를 잘 못 맡으세요?", item: Hyposmia, sec: ros, p: 3}
  - {id: rbd, q: "자면서 꿈대로 몸을 움직이나요?", item: REM sleep behavior, sec: ros, p: 3}
  - {id: constipation, q: "변비가 있으세요?", item: Constipation, sec: ros, p: 3}
  - {id: thyroid_dx, q: "갑상선 질환이 있으세요?", item: thyroid disease, sec: pmh, p: 2}
  - id: psych_drug
    q: "정신과 약을 드시나요?"
    item: Psychotropic drug
    sec: meds
    p: 1
    then:
      - {id: psych_timing, q: "약을 시작한 뒤에 떨림이 생겼나요?", item: Temporal relation to psychotropic, known: "뒤|후|나서|다음|이후"}
  - id: gi_drug
    q: "소화제나 위장약을 오래 드셨나요?"
    item: "Prokinetic drug (levosulpiride, metoclopramide)"
    sec: meds
    p: 1
    then:
      - {id: gi_timing, q: "위장약을 드신 뒤에 증상이 생겼나요?", item: Temporal relation to prokinetic, known: "뒤|후|나서|다음|이후"}
  - {id: asthma_drug, q: "천식약을 쓰시나요?", item: Beta-agonist, sec: meds, p: 3}
  - {id: vertigo_drug, q: "어지럼증 약을 오래 드셨나요?", item: Flunarizine or cinnarizine use, sec: meds, p: 3}
  - {id: caffeine, q: "커피는 하루 몇 잔 드세요?", item: Caffeine, sec: shx, p: 2}
  - {id: fh_tremor, q: "가족 중 손이 떨리는 분 있나요?", item: "FHx: tremor", sec: fhx, p: 1}
exams:
  - {name: 떨림·서동 관찰, item: Neuro, p: 1}
  - {name: 자세성 떨림, item: Neuro, p: 1}
  - {name: 근긴장도 평가, item: Neuro, p: 1}
  - {name: 보행 관찰, item: Neuro, p: 1}
  - {name: 소뇌 협조운동 검사, item: Neuro, p: 2}
  - {name: 갑상선 촉진, item: Neck, p: 2}
  - {name: 심부건반사, item: Neuro, p: 3}
  - {name: 요골동맥 맥박 촉진, item: V/S, p: 3}
differential:
  - {en: Essential tremor, ko: 본태성 떨림}
  - {en: Parkinson disease, ko: 파킨슨병}
  - {en: Drug-induced tremor or parkinsonism, ko: 약물 유발 떨림·파킨슨증}
  - {en: "Enhanced physiologic tremor (anxiety, caffeine)", ko: 증강된 생리적 떨림(불안·카페인)}
  - {en: Hyperthyroidism, ko: 갑상샘항진증}
  - {en: Alcohol withdrawal, ko: 알코올 금단}
  - {en: Cerebellar tremor, ko: 소뇌성 떨림}
  - {en: Wilson disease, ko: 윌슨병, cant_miss: true}
  - {en: Dystonic tremor, ko: 근긴장이상 떨림}
tests:
  - {name: "TSH, free T4", for: [Hyperthyroidism, "Enhanced physiologic tremor (anxiety, caffeine)"], why: "갑상선 기능 확인"}
  - {name: "Electrolytes, glucose, liver function tests, GGT", for: [Alcohol withdrawal, "Enhanced physiologic tremor (anxiety, caffeine)"], why: "대사·알코올 관련 원인 확인"}
  - {name: "Serum ceruloplasmin, 24-hour urine copper (onset before 40)", for: [Wilson disease], why: "윌슨병 배제"}
  - {name: "Brain MRI (asymmetric, cerebellar or atypical features)", for: [Cerebellar tremor, Dystonic tremor], why: "소뇌·구조적 병변 확인"}
  - {name: "Dopamine transporter scan (if parkinsonism is uncertain)", for: [Parkinson disease, Drug-induced tremor or parkinsonism, Essential tremor], why: "퇴행성 파킨슨증과 약물 유발·본태성 떨림 감별"}
  - {name: "12-lead ECG, heart rate (before propranolol)", for: [safety], why: "서맥·전도 장애 확인(베타차단제 전)"}
plan:
  treatment:
    - "본태성 떨림: 생활에 지장 있으면 프로프라놀롤 또는 프리미돈(천식·서맥 확인 후)"
    - "약물 유발 파킨슨증: 원인 약(레보설피리드·메토클로프라미드 등) 중단 후 경과 관찰"
    - "파킨슨병 의심: 신경과 의뢰, 일상 기능 저하 시 레보도파 등 도파민 치료"
    - "갑상샘항진증·카페인 등 원인이 확인되면 그 원인 치료"
  disposition: "대부분 외래 진료; 파킨슨증이나 비전형 소견(소뇌 징후·급속 진행·40세 이전 발병)은 신경과 의뢰"
  follow_up:
    - "1-3개월 뒤 떨림 정도와 약 반응·부작용 확인"
    - "원인 약 중단 후 3-6개월에 파킨슨 증상 회복 여부 확인"
  red_flags: ["자주 넘어짐", "삼키기 어려움", "고열과 심한 근육 강직", "갑작스러운 악화나 의식 변화"]
education:
  - "갑상선 피검사를 해 볼게요."
  - "커피와 술은 줄이는 게 좋아요."
  - "위장약은 의사와 상의해 조절하세요."
  - "검사 결과를 보고 치료를 정할게요."
guidelines:
  - US_StatPearls/statpearls_article-30563.md
  - US_StatPearls/statpearls_article-26674.md
notes: >
  v0.8.0 (evidence review 2026-10): trouble turning in bed added at p2 (LR+ 13 for Parkinson disease; Rao, JAMA 2003).
  The prokinetic question moved to p1 with the psychotropic one, each followed by its timing: Korean older adults on
  levosulpiride or metoclopramide were about three times more likely to start levodopa (OR 3.32 and 3.04; Huh, J Clin
  Med 2019), a prescribing cascade from drug-induced parkinsonism. Head or voice tremor (essential tremor) added at p3;
  postural tremor history (examined anyway) and stress aggravation (enhanced physiologic tremor, low yield) moved to
  p3, deep tendon reflexes to p3. Rest tremor with bradykinesia plus rigidity or rest tremor = parkinsonism (MDS 2015,
  Postuma); bilateral postural-action tremor, family history and alcohol response = essential tremor (MDS 2018
  consensus: isolated action tremor of both upper limbs for at least 3 years). Flunarizine and cinnarizine are other
  Korean causes of drug-induced parkinsonism. A spiral-drawing test is not in the exam vocabulary.
