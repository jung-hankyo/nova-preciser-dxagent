differential:
  - {en: "Prerenal acute kidney injury (dehydration, heart failure, cirrhosis)", ko: 신전성 급성 신손상(탈수·심부전·간경변)}
  - {en: "Drug-induced acute kidney injury (NSAID, ACE inhibitor or ARB, diuretic, contrast)", ko: 약물 유발 급성 신손상(NSAID·ACE억제제·ARB·이뇨제·조영제)}
  - {en: Acute tubular necrosis (sepsis or shock), ko: 급성 세뇨관 괴사(패혈증·쇼크), cant_miss: true}
  - {en: Postrenal obstruction (urinary retention or bilateral ureteral obstruction), ko: 신후성 폐색(요폐·양측 요관 폐색), cant_miss: true}
  - {en: Acute glomerulonephritis (post-infectious or rapidly progressive), ko: 급성 사구체신염(감염 후·급속 진행성), cant_miss: true}
  - {en: Rhabdomyolysis, ko: 횡문근융해증, cant_miss: true}
  - {en: Hemorrhagic fever with renal syndrome, ko: 신증후군출혈열, cant_miss: true}
  - {en: Hemolytic uremic syndrome, ko: 용혈성 요독 증후군, cant_miss: true}
tests:
  - {name: "Serum creatinine, BUN, electrolytes (potassium), bicarbonate", for: ["Prerenal acute kidney injury (dehydration, heart failure, cirrhosis)", "Drug-induced acute kidney injury (NSAID, ACE inhibitor or ARB, diuretic, contrast)", Acute tubular necrosis (sepsis or shock), Postrenal obstruction (urinary retention or bilateral ureteral obstruction), safety], why: "급성 신손상 단계(KDIGO)·고칼륨·산증 확인"}
  - {name: "Urinalysis with microscopy (casts, RBC, WBC, protein)", for: [Acute glomerulonephritis (post-infectious or rapidly progressive), Acute tubular necrosis (sepsis or shock), Rhabdomyolysis, "Drug-induced acute kidney injury (NSAID, ACE inhibitor or ARB, diuretic, contrast)"], why: "원주·적혈구로 원인 구분(잠혈 양성·적혈구 없음은 근색소뇨)"}
  - {name: "Urine sodium and fractional excretion of sodium (urea if on diuretics)", for: ["Prerenal acute kidney injury (dehydration, heart failure, cirrhosis)", Acute tubular necrosis (sepsis or shock)], why: "신전성(FENa 1% 미만)과 세뇨관 괴사 구분"}
  - {name: "Bladder scan (post-void residual) and renal ultrasound", for: [Postrenal obstruction (urinary retention or bilateral ureteral obstruction)], why: "요폐·수신증 확인"}
  - {name: "Creatine kinase", for: [Rhabdomyolysis], why: "횡문근융해 확인"}
  - {name: "CBC with platelets and smear, LDH, haptoglobin", for: [Hemolytic uremic syndrome, Hemorrhagic fever with renal syndrome], why: "혈소판 감소·용혈 확인"}
  - {name: "Hantavirus antibody (fever, thrombocytopenia, outdoor exposure)", for: [Hemorrhagic fever with renal syndrome], why: "신증후군출혈열 확인"}
  - {name: "ASO, C3, C4, ANCA, anti-GBM antibody", for: [Acute glomerulonephritis (post-infectious or rapidly progressive)], why: "사구체신염 원인 확인"}
  - {name: "Stool culture and Shiga toxin test (bloody diarrhea)", for: [Hemolytic uremic syndrome], why: "장출혈성 대장균 확인"}
  - {name: "Blood cultures and lactate (fever or hypotension)", for: [Acute tubular necrosis (sepsis or shock)], why: "패혈증 확인"}
  - {name: "12-lead ECG (potassium elevated or unknown)", for: [safety], why: "고칼륨혈증 심전도 변화 확인"}
plan:
  treatment:
    - "탈수에 의한 신전성 손상은 수액으로 보충하고 소변량·체중 확인"
    - "요폐는 즉시 도뇨관 삽입, 수신증은 비뇨의학과에서 원인 해소"
    - "NSAID·ACE억제제·ARB·이뇨제 등 신독성 약물 중단 또는 용량 조정, 조영제 피함"
    - "고칼륨·폐부종·산증이 교정되지 않으면 신장내과 협진하여 투석 고려"
  disposition: "크레아티닌 상승이나 6시간 이상 소변량 0.5 mL/kg/h 미만(KDIGO), 무뇨, 고칼륨은 입원 또는 응급 평가; 경미한 탈수는 수액 후 24~48시간 내 재검"
  follow_up:
    - "24~48시간 내 크레아티닌·전해질·소변량 재확인"
    - "회복 후 3개월 내 신기능 재평가(급성 신손상 후 만성 콩팥병 위험)"
  red_flags: ["소변이 전혀 나오지 않음", "숨이 차거나 몸이 많이 부음", "의식이 흐려짐", "콜라색 소변이나 피가 섞인 설사"]
education:
  - "피검사와 소변검사를 할게요."
  - "소염진통제는 당분간 피해 주세요."
  - "소변이 전혀 안 나오면 바로 오세요."
