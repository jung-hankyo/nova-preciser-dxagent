notes: >
  New in v0.8.0: the uncovered half of the official "소변량 변화" presentation (polyuria.yaml covers the other half).
  First separate retention (an urge to void that cannot be passed, a palpable bladder: catheterise) from low
  production, then sort prerenal (vomiting, diarrhea, poor intake, orthostatic symptoms, dry mucosa; heart failure or
  cirrhosis), intrinsic (sepsis, nephrotoxins, glomerulonephritis with cola urine, edema and foamy urine,
  rhabdomyolysis after exertion with myalgia) and postrenal causes. Definitions: oliguria under 400 mL a day in adults
  (anuria under 100 mL); KDIGO 2012 AKI: creatinine rise of 0.3 mg/dL or more within 48 hours, 1.5 times baseline
  within 7 days, or urine output under 0.5 mL/kg/h for 6 hours (Korean AKI guideline, Korean J Med 2015). FENa under
  1% suggests prerenal, over 2% tubular necrosis; use urea excretion on diuretics. The ACE inhibitor/ARB, diuretic
  and NSAID combination is a classic drug cause. Korea: hemorrhagic fever with renal syndrome (Hantaan virus; fever,
  thrombocytopenia, then oliguria; outdoor work, farming or military field training; peaks October to December,
  KDCA). Children: dehydration from gastroenteritis (capillary refill LR 4.1), post-streptococcal GN, and HUS after
  bloody diarrhea. A child's history goes to the guardian; questions here are worded without a subject so they suit
  both.
