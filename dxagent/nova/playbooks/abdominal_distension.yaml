notes: >
  v0.8.0: JVP (경정맥압 측정) replaces abdominal percussion: shifting dullness is itself percussion, and a raised JVP
  points to cardiac (or constrictive) rather than hepatic ascites. Shifting dullness (LR+ 2.7, sensitive; absent LR-
  about 0.3) is kept over the fluid wave (LR+ 6.0, specific) (Williams & Simel JAMA 1992). A direct hepatitis B
  question was added at priority 1: HBV is the leading cause of cirrhosis in Korea, HBsAg prevalence is about 2.9%
  and 77.8% of carriers did not know their status (PMC4835708, PMC4398152); "간 질환" misses carriers. Weight-gain follow-ups
  quantify fluid gain; appetite moved to priority 3. Fluid (gradual, constant, shifting dullness, edema, liver
  disease) versus gas (intermittent, meals, flatus) versus obstruction (pain, vomiting, no flatus) versus mass or
  pregnancy. SAAG 1.1 g/dL or more = portal hypertension (cirrhosis, heart failure); below 1.1 = peritoneal disease
  (malignancy, TB: high ADA, lymphocytes). Ascitic PMN 250/mm3 or more = SBP. Fever, abdominal pain or confusion in a
  cirrhotic patient need paracentesis. KASL 2026 ascites guideline for salt restriction and diuretics; HCC
  surveillance every 6 months with ultrasound and AFP in cirrhosis or chronic hepatitis B.
