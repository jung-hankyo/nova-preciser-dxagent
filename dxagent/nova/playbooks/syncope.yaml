id: syncope
title: {ko: 실신, en: Syncope}
status: draft
reviewer: ""
population: adult
pain: false
match:
  any: [쓰러, 기절, 정신을 잃, 의식을 잃, 실신, 눈앞이 캄캄, 눈앞이 깜깜, 정신이 나갔, 의식이 없어졌, 의식이 없었]
