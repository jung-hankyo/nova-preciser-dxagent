  - {name: 요골동맥 맥박 촉진, item: V/S, p: 1}
  - {name: 의식·지남력 평가, item: General, p: 1}
  - {name: 사지 근력 검사, item: Neuro, p: 2}
  - {name: 결막·공막 시진, item: H/E/E/N/T, p: 2}
  - {name: 구강 점막 시진, item: H/E/E/N/T, p: 2}
