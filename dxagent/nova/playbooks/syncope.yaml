  - {id: situation, q: "그때 무엇을 하고 계셨어요?", item: Situation, p: 1}
  - {id: posture, q: "서 있다가 쓰러지셨나요?", item: Posture, p: 1}
  - {id: prodrome, q: "쓰러지기 전에 어떤 느낌이었나요?", item: Prodrome, p: 1}
  - {id: exertion, q: "운동하다가 쓰러지셨나요?", item: Exertional syncope, p: 1}
  - {id: palpitation, q: "쓰러지기 전에 두근거렸나요?", item: Palpitation, p: 1}
  - {id: chest_pain, q: "그때 가슴이 아팠나요?", item: Chest pain, p: 1}
  - {id: dyspnea, q: "숨이 차세요?", item: Dyspnea, p: 1}
  - {id: loc_duration, q: "정신을 잃은 시간은 얼마였나요?", item: LOC duration, p: 1}
