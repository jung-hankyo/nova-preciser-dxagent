  - {id: abd_pain, q: "그때 배가 아팠나요?", item: Abdominal pain, p: 2}
  - {id: headache, q: "그때 머리가 아팠나요?", item: Headache, p: 2}
  - {id: injury, q: "쓰러지면서 다치셨나요?", item: Injury, p: 2}
  - {id: incontinence, q: "그때 소변을 지렸나요?", item: Incontinence, p: 3}
  - {id: supine, q: "누워 있을 때 정신을 잃었나요?", item: Supine syncope, p: 3}
  - {id: weakness, q: "팔다리에 힘이 빠지나요?", item: Focal weakness, p: 3}
