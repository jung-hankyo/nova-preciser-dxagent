  - {en: "Structural heart disease (aortic stenosis, hypertrophic cardiomyopathy)", ko: 구조적 심질환(대동맥판 협착·비대심근병증), cant_miss: true}
  - {en: Pulmonary embolism, ko: 폐색전증, cant_miss: true}
  - {en: Gastrointestinal bleeding, ko: 위장관 출혈, cant_miss: true}
  - {en: Aortic dissection, ko: 대동맥 박리, cant_miss: true}
  - {en: Subarachnoid hemorrhage, ko: 지주막하 출혈, cant_miss: true}
  - {en: Ectopic pregnancy, ko: 자궁외 임신, cant_miss: true}
  - {en: Seizure, ko: 뇌전증 발작}
  - {en: Hypoglycemia, ko: 저혈당}
  - {en: Psychogenic pseudosyncope, ko: 심인성 가성실신}
tests:
  - {name: "12-lead ECG", for: [Cardiac arrhythmia, "Structural heart disease (aortic stenosis, hypertrophic cardiomyopathy)", Pulmonary embolism, Vasovagal syncope, Situational syncope], why: "부정맥·전도장애·좌심실비대 확인"}
  - {name: "Orthostatic vital signs", for: [Orthostatic hypotension], why: "기립 시 혈압 저하 확인"}
  - {name: "CBC, glucose, electrolytes", for: [Gastrointestinal bleeding, Hypoglycemia, Orthostatic hypotension], why: "빈혈·저혈당·탈수 확인"}
  - {name: "Echocardiography (murmur or known heart disease)", for: ["Structural heart disease (aortic stenosis, hypertrophic cardiomyopathy)"], why: "대동맥판 협착·비대심근병증 확인"}
  - {name: "Holter monitoring or implantable loop recorder", for: [Cardiac arrhythmia], why: "증상 시 리듬 포착"}
  - {name: "Tilt-table test (recurrent unexplained syncope)", for: [Vasovagal syncope, Psychogenic pseudosyncope], why: "반사성 실신·가성실신 확인"}
  - {name: "EEG (if seizure is suspected)", for: [Seizure], why: "뇌전증 확인"}
  - {name: "Head CT (headache at the event)", for: [Subarachnoid hemorrhage], why: "지주막하 출혈 확인"}
  - {name: "CT angiography of the aorta (chest, back or abdominal pain)", for: [Aortic dissection], why: "대동맥 박리 확인"}
  - {name: "D-dimer or CT pulmonary angiography", for: [Pulmonary embolism], why: "폐색전증 배제·확진"}
  - {name: "Urine hCG (women of childbearing age)", for: [Ectopic pregnancy, safety], why: "임신 확인(영상·약물 전)"}
plan:
  treatment:
    - "반사성 실신: 전구 증상 시 바로 앉거나 눕기, 다리 꼬기·주먹 쥐기 등 물리적 대항 요법, 수분·염분 섭취"
    - "기립성 저혈압: 원인 약물 조정, 천천히 일어나기"
    - "부정맥·구조적 심질환 확인 시 심장내과 의뢰(심박조율기·제세동기 등)"
  disposition: "운동 중·누운 자세 실신, 실신 전 두근거림, 흉통·호흡곤란, 심장병, 비정상 심전도면 입원·응급 평가, 저위험 반사성 실신은 외래"
  follow_up:
    - "1-2주 후 홀터 등 검사 결과 확인"
    - "재발 빈도와 운전·고위험 작업 가능 여부 재평가"
  red_flags:
    - "운동 중 실신"
    - "실신 전 가슴 두근거림"
    - "가슴 통증·호흡곤란 동반"
    - "심한 두통이나 복통 동반"
education:
  - "심전도 검사를 먼저 할게요."
  - "원인을 알 때까지 운전은 피하세요."
  - "어지러우면 바로 앉거나 누우세요."
  - "다시 쓰러지면 바로 오세요."
guidelines:
  - US_StatPearls/statpearls_article-29805.md
  - US_StatPearls/statpearls_article-31039.md
  - US_StatPearls/statpearls_article-26349.md
notes: >
  v0.8.0. ESC 2018 major high-risk symptoms added: new abdominal pain (ruptured AAA, ectopic pregnancy) and headache
  (SAH) at p2, dyspnea raised to p1. Tongue biting asked for the event and the side of the tongue at p1 (tongue biting
  LR+ 8.2 for seizure vs syncope, Brigo 2012 Seizure; lateral biting specificity about 100% vs psychogenic events,
  Brigo 2012 Epilepsy Behav). Follow-ups: seconds of jerking (over 15-30 s favors seizure) and age at sudden death in
  the family. Demoted to p3: incontinence (LR+ 0.88, no value), focal weakness (the limb power maneuver covers it),
  antihypertensives (the standard medication item lists them); supine syncope at p3. Facial strength replaced by the
  rectal exam at p3 (GI bleeding on rectal exam is an ESC high-risk finding; stated from memory, ESC table text not
  retrieved). Aortic dissection, SAH, ectopic pregnancy and psychogenic pseudosyncope added. ESC 2018 major high-risk
  features: new chest discomfort, breathlessness, abdominal pain or headache; syncope during exertion or supine;
  sudden palpitation immediately followed by syncope; structural heart disease. Minor (high risk only with structural
  heart disease or abnormal ECG): no or under 10 s prodrome, family history of young sudden death, syncope while
  sitting. Low risk: typical reflex prodrome, prolonged standing, hot crowded places, meals, cough, defecation or
  micturition. Everyone: history, examination with standing BP, ECG. Prolonged confusion and prolonged tonic-clonic
  movements favor seizure; brief myoclonic jerks are common in syncope.
