plan:
  treatment:
    - "원인 의심 약물·한약·술 즉시 중단"
    - "담관염 의심 시 금식·수액·항생제 후 담도 배액(ERCP)"
    - "B형간염 급성 악화는 항바이러스제(KASL), 급성 A형간염은 대증 치료"
    - "INR 상승과 의식 변화가 있으면 간이식 가능 센터로 의뢰"
  disposition: "발열·복통 동반(담관염 의심), INR 상승이나 의식 변화(급성 간부전)는 입원; 무통성 황달은 신속히 영상검사"
  follow_up:
    - "1~2주 내 간기능·INR 재검"
    - "만성 B형간염·간경변은 6개월마다 초음파·AFP 간암 감시"
  red_flags: ["고열과 오한", "의식이 흐려짐", "토혈이나 검은 변", "심한 복통"]
