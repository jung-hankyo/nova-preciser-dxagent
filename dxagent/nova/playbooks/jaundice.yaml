notes: >
  v0.8.0: palpable gallbladder (담낭 촉진, Courvoisier sign: specificity about 83-90% for malignant obstruction,
  sensitivity low) replaces mental-status assessment (asterixis already screens for encephalopathy). A direct
  hepatitis B question added at priority 1 (HBsAg about 2.9%, 77.8% of carriers unaware), with a follow-up on stopped
  antivirals (a common trigger of a flare); raw food raised to p2 with a follow-up on the food (raw or salted
  shellfish: hepatitis A in young Korean adults; raw freshwater fish: clonorchiasis); a herbal start-date follow-up
  dates the exposure for drug-induced liver injury (herbal products are the largest DILI cause in Korea, Suk 2012).
  Dark urine with pale stool and pruritus indicates cholestasis. Charcot's triad (fever, RUQ pain, jaundice) is
  specific (99%) but present in under half (sensitivity 46%); fever or chills with cholestasis is enough to suspect
  cholangitis (Tokyo Guidelines 2018 need systemic inflammation, cholestasis and imaging). Painless jaundice with
  weight loss in older adults suggests malignancy. Ask about alcohol, drugs and herbal remedies.
