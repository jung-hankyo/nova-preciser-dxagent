  - {name: "Pelvic ultrasound", for: [Polycystic ovary syndrome, Androgen-secreting tumor, "Turner syndrome or Mullerian agenesis (primary amenorrhea)", "Outflow tract obstruction (imperforate hymen, transverse vaginal septum)"], why: "자궁·난소 구조 확인(성경험 없으면 경복부; 초경 후 8년 이내는 PCOS 진단에 쓰지 않음)"}
  - {name: "Progestin challenge test", for: [Functional hypothalamic amenorrhea, Asherman syndrome], why: "에스트로겐 상태·유출로 확인(임신 배제 후)"}
  - {name: "Hysteroscopy", for: [Asherman syndrome], why: "소파술 후 무월경에서 자궁강 유착 확인"}
  - {name: "Pituitary MRI", for: [Hyperprolactinemia or prolactinoma, Sheehan syndrome], why: "약물 원인 없는 고프로락틴혈증, 두통·시야 결손 시"}
  - {name: "Morning cortisol, free T4", for: [Sheehan syndrome], why: "산후 출혈 병력 시 뇌하수체 기능 확인"}
  - {name: "Karyotype", for: ["Turner syndrome or Mullerian agenesis (primary amenorrhea)", Primary ovarian insufficiency], why: "원발 무월경·40세 전 난소부전"}
  - {name: "75 g OGTT, lipids", for: [Polycystic ovary syndrome], why: "PCOS의 당대사·지질 위험 평가"}
plan:
  treatment:
    - "hCG 음성을 확인한 뒤 원인별로 치료합니다."
    - "PCOS: 체중 5-10% 감량과 운동, 월경 조절은 복합 경구피임약이나 주기적 프로게스틴."
    - "기능성 시상하부 무월경: 열량 섭취를 늘리고 과도한 운동을 줄입니다."
    - "고프로락틴혈증: 원인 약물(위장운동촉진제·항정신병약)을 처방의와 조정하고, 프로락틴종이면 도파민 작용제(카버골린)."
  disposition: "대부분 외래 검사·치료; 시야 결손이나 심한 두통은 당일 뇌하수체 영상 의뢰, 원발 무월경·40세 전 난소부전·빠른 남성화는 전문의 의뢰."
  follow_up:
    - "2주 뒤 호르몬 검사 결과를 확인합니다."
    - "3개월 뒤 월경과 체중을 재평가하고, PCOS는 매년 대사 위험을 검사합니다."
  red_flags: ["시야가 좁아짐", "심한 두통", "목소리가 굵어지는 등 빠른 남성화", "임신 양성에 복통·출혈"]
education:
  - "먼저 임신 검사를 해 볼게요."
  - "호르몬 피검사를 할게요."
  - "검사 결과에 맞춰 치료할게요."
guidelines:
  - US_StatPearls/statpearls_article-17441.md
  - US_EuropePMC/europepmc_PMC5399492.md
  - US_StatPearls/statpearls_article-23208.md
notes: >
  v0.8.0 (evidence review): sexual-activity item added as the pelvic-exam gate (adults only; contraception as its
  follow-up); never had intercourse: no speculum or bimanual; transabdominal ultrasound; rectal exam only if a mass is
  suspected; primary amenorrhea in a girl without sexual experience: external genital inspection (외음부 시진) and
  Tanner staging instead. Regularity and cycle length merged into one question; weight change quantified (kg over
  months). Prokinetic question added: levosulpiride, domperidone and metoclopramide are D2 antagonists widely
  prescribed in Korea and raise prolactin (Huh 2019 on the Korean prokinetic cascade). Nausea and cold intolerance
  demoted (pregnancy and thyroid are settled by hCG and TSH). PCOS (International guideline, Teede 2023): adults need
  2 of irregular cycles, hyperandrogenism, ultrasound or AMH; adolescents need both irregular cycles and
  hyperandrogenism, with no ultrasound or AMH within 8 years of menarche. Irregular cycles: 1-3 years after menarche
  under 21 or over 45 days; more than 3 years after menarche under 21 or over 35 days or fewer than 8 cycles a year;
  any cycle over 90 days after the first year; primary amenorrhea by 15 or 3 years after thelarche. Secondary
  amenorrhea: no menses for 3 months with regular cycles (6 months if irregular). Functional hypothalamic amenorrhea is
  a diagnosis of exclusion; the progestin challenge is accepted (Endocrine Society 2017).
