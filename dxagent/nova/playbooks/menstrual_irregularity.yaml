  - {name: "TSH, prolactin", for: [Thyroid dysfunction, Hyperprolactinemia or prolactinoma, "Drug-induced hyperprolactinemia (antipsychotics, levosulpiride, domperidone, metoclopramide)"], why: "갑상샘·프로락틴 확인"}
