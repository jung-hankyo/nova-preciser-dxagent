  - {id: diuretic, q: "이뇨제를 드시나요?", item: Diuretic, sec: meds, p: 3}
  - {id: fh_arthritis, q: "가족 중 관절염 있는 분 있나요?", item: "FHx: arthritis", sec: fhx, p: 2}
