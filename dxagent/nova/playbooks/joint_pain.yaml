id: joint_pain
title: {ko: 관절 통증, en: Joint pain}
status: draft
reviewer: ""
population: adult
pain: true
match:
  any: [관절이 아파, 관절이 아프, 관절통, 관절이 붓, 무릎이 아파, 무릎이 아프, 손가락 마디, 마디가 아, 마디가 붓, 발가락이 아, 엄지발가락, 어깨가 아파, 어깨가 아프, 손목이 아, 발목이 아, 무릎이 붓, 무릎이 부, 무릎이 시, 손가락이 아, 손가락이 붓, 손가락이 부, 발가락이 붓, 발가락이 부, 관절, 통풍]
  not: []
history:
