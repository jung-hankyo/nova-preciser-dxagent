  - id: sudden
    q: "갑자기 아프기 시작했나요?"
    item: Onset mode
    p: 1
    then:
      - {id: peak_time, q: "가장 심해질 때까지 얼마나 걸렸나요?", item: Time to maximal pain, known: "시간|하루|밤사이|자고 일어나|분 만에|분만에"}
  - {id: joints, q: "어느 관절이 아프세요?", item: Location, p: 1}
  - {id: number, q: "아픈 관절이 몇 군데인가요?", item: Number of joints, p: 1}
  - {id: symmetry, q: "양쪽 관절이 같이 아픈가요?", item: Symmetry, p: 1}
  - {id: swelling, q: "관절이 붓나요?", item: Swelling, p: 1}
  - {id: red_hot, q: "관절이 빨갛게 변했나요?", item: Redness, p: 1}
  - id: morning
    q: "아침에 관절이 뻣뻣한가요?"
    item: Morning stiffness
    p: 1
    then:
      - {id: stiff_duration, q: "뻣뻣함은 얼마나 오래가나요?", item: Morning stiffness duration, known: "분 정도|분쯤|분 동안|분이면|시간|금방|잠깐|오전"}
  - {id: activity, q: "움직이면 더 아픈가요?", item: Activity relation, p: 1}
  - {id: trauma, q: "다친 적이 있나요?", item: Trauma, p: 1}
  - {id: fever, q: "열이 나세요?", item: Fever, p: 1}
  - {id: severity, q: "통증은 10점 중 몇 점인가요?", item: NRS, p: 1}
  - {id: rest, q: "쉬면 나아지나요?", item: Relief with rest, p: 2}
  - {id: rash, q: "피부에 발진이 생겼나요?", item: Rash, p: 2}
  - {id: infection, q: "최근 설사를 한 적 있나요?", item: Preceding diarrhea, p: 2}
  - {id: urethritis, q: "소변볼 때 아픈 적 있었나요?", item: Urethritis, p: 2}
  - {id: injection, q: "최근 관절에 주사를 맞았나요?", item: Recent intra-articular injection, p: 2}
  - {id: weight, q: "최근 살이 빠지셨나요?", item: Weight loss, sec: ros, p: 2}
  - {id: fatigue, q: "쉽게 피곤하세요?", item: Fatigue, sec: ros, p: 3}
  - {id: oral_ulcer, q: "입 안이 자주 허나요?", item: Oral ulcer, sec: ros, p: 3}
  - {id: sicca, q: "입이 자주 마르세요?", item: Dry mouth, sec: ros, p: 3}
  - {id: raynaud, q: "추우면 손가락이 하얘지나요?", item: Raynaud phenomenon, sec: ros, p: 3}
