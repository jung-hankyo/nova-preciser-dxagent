tests:
  - {name: "Electrolytes, BUN, creatinine", for: [Severe dehydration, Viral gastroenteritis], why: "탈수·전해질·신기능 확인"}
  - {name: "CBC, CRP", for: ["Inflammatory (bloody) bacterial colitis (Shigella, Campylobacter, Salmonella, EHEC)", Inflammatory bowel disease, Clostridioides difficile infection], why: "염증 반응 확인"}
  - {name: "Stool culture or multiplex PCR (fever, bloody or mucoid stool, severe pain, sepsis, immunosuppression, over 7 days)", for: [Bacterial gastroenteritis or food poisoning, "Inflammatory (bloody) bacterial colitis (Shigella, Campylobacter, Salmonella, EHEC)"], why: "원인균 확인(IDSA 2017 기준)"}
  - {name: "Clostridioides difficile toxin or PCR (antibiotics within 3 months, 3 or more loose stools a day)", for: [Clostridioides difficile infection], why: "C. difficile 확인"}
  - {name: "Stool ova and parasites or antigen (travel, persistent over 2 weeks)", for: [Parasitic infection (Giardia or amebiasis)], why: "기생충 확인"}
  - {name: "Fecal calprotectin (chronic diarrhea)", for: [Irritable bowel syndrome, Inflammatory bowel disease], why: "기능성과 염증성 구분"}
  - {name: "Colonoscopy with biopsy (chronic, bloody or alarm features, age 45 or more)", for: [Inflammatory bowel disease, Intestinal tuberculosis, Colorectal cancer], why: "염증성 장질환·장결핵·대장암 확인"}
  - {name: "Chest X-ray and interferon-gamma release assay (suspected intestinal TB)", for: [Intestinal tuberculosis], why: "결핵 감염 확인"}
  - {name: "TSH (chronic diarrhea)", for: [Hyperthyroidism], why: "갑상샘항진증 확인"}
  - {name: "Lactose hydrogen breath test or 2-week lactose-free trial", for: [Lactose intolerance], why: "유당불내증 확인"}
plan:
  treatment:
    - "경구수액(ORS)으로 수분 보충, 중등도 이상 탈수는 정맥 수액"
    - "대부분 항생제 불필요; 고열 동반 혈변, 패혈증, 면역저하는 대변 검사 후 경험적 항생제"
    - "장출혈성 대장균 의심(혈변, 열 없음) 시 항생제·지사제 피함"
    - "C. difficile은 원인 항생제 중단 후 경구 반코마이신 또는 피닥소마이신"
  disposition: "경구 섭취 가능하고 탈수 경미하면 외래; 중등도 이상 탈수, 고열 동반 혈변, 노인·면역저하 중증은 입원"
  follow_up:
    - "48~72시간 내 증상과 소변량 재확인"
    - "2주 이상 지속되면 기생충·대변 염증 표지자, 4주 이상이면 대장내시경"
  red_flags: ["소변이 줄거나 어지러움", "피가 섞인 설사", "38도 이상의 고열", "심한 복통"]
education:
  - "물과 이온음료를 충분히 드세요."
  - "피가 섞이거나 열이 나면 오세요."
  - "손을 자주 깨끗이 씻으세요."
guidelines:
  - KR_EuropePMC/europepmc_PMC6609748.md
  - US_StatPearls/statpearls_article-20483.md
  - US_StatPearls/statpearls_article-19525.md
  - US_StatPearls/statpearls_article-23774.md
notes: >
  v0.8.0: stool occult blood removed (a colorectal screening test with no role in acute diarrhea); stool culture or
  multiplex PCR is ordered on the IDSA 2017 triggers (fever, bloody or mucoid stool, severe cramping or tenderness,
  sepsis; consider in the elderly and immunocompromised), and oral rehydration is given whether or not tested.
  Immunosuppression added (an IDSA testing trigger that widens the differential: CMV, Cryptosporidium); intestinal
  TB added (the classic Korean mimic of Crohn's disease: fever, night sweats, weight loss, prior or family TB; Lee
  2006); skin turgor moved to priority 3 (no proven value in adults, McGee 1999). Acute under 2 weeks (mostly
  infectious), persistent 2-4 weeks (parasites such as Giardia, C. difficile), chronic over 4 weeks (IBS by Rome V
  2026 criteria, IBD, intestinal TB, malabsorption, hyperthyroidism, cancer). Dysentery (blood, fever, tenesmus)
  suggests invasive bacteria; antibiotics within 3 months suggest C. difficile (IDSA/SHEA). Avoid antimotility drugs
  and antibiotics in suspected Shiga toxin-producing E. coli.
