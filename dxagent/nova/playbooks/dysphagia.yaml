  - {name: "Videofluoroscopic swallowing study (oropharyngeal dysphagia)", for: [Oropharyngeal dysphagia from stroke or neuromuscular disease], why: "흡인·구인두 기능 확인"}
  - {name: "Brain MRI or neuromuscular work-up (neurological signs)", for: [Oropharyngeal dysphagia from stroke or neuromuscular disease], why: "뇌졸중·신경근육질환 확인"}
  - {name: "Thyroid ultrasound or chest CT (neck mass or suspected compression)", for: [Goiter or extrinsic compression], why: "외부 압박 확인"}
  - {name: "CBC", for: [Esophageal cancer], why: "빈혈 확인"}
plan:
  treatment:
    - "내시경 결과에 따라 협착·고리는 내시경 확장술"
    - "호산구 식도염은 PPI 또는 삼키는 국소 스테로이드, 필요 시 식이 제한"
    - "식도이완불능증은 풍선 확장술이나 근절개술 의뢰"
    - "구인두 삼킴곤란은 삼킴 재활과 음식 형태 조절"
  disposition: "음식이 걸려 내려가지 않거나 침도 삼키지 못하면 응급 내시경; 그 외 외래에서 신속히 내시경"
  follow_up:
    - "내시경·조직검사 결과 확인 후 원인별 치료"
    - "호산구 식도염은 치료 8~12주 후 조직검사로 반응 확인"
    - "체중과 영양 상태 추적"
  red_flags: ["침도 삼키지 못함", "음식이 걸려 내려가지 않음", "토혈이나 검은 변", "사레 후 기침과 발열"]
education:
  - "위내시경 검사를 해 볼게요."
  - "음식은 작게 잘라 천천히 드세요."
  - "물도 못 넘기면 바로 오세요."
guidelines:
  - US_StatPearls/statpearls_article-20803.md
  - US_StatPearls/statpearls_article-21327.md
  - US_StatPearls/statpearls_article-17083.md
notes: >
  v0.8.0: food impaction (p2) and atopy (p3) added for eosinophilic esophagitis, which often first presents as an
  emergency food impaction in a young atopic man (ACG 2025 EoE guideline: esophageal symptoms plus 15 or more
  eosinophils per high-power field after excluding other causes); nasal regurgitation (p2) added for oropharyngeal
  dysphagia (stroke, myasthenia, ALS); weight-loss follow-ups quantify the cancer flag. Oropharyngeal (difficulty
  starting a swallow, coughing, nasal regurgitation) versus esophageal (food sticks after swallowing). Progressive
  solid-food dysphagia with weight loss in a smoker or drinker suggests cancer; solids and liquids from the start
  suggest a motility disorder such as achalasia; intermittent solid-food dysphagia with impaction suggests EoE or a
  ring. A bedside water-swallow screen is not in the maneuver vocabulary.
