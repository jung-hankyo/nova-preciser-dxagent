differential:
  - {en: Benign prostatic hyperplasia, ko: 양성 전립선 비대증}
  - {en: Overactive bladder, ko: 과민성 방광}
  - {en: Stress urinary incontinence, ko: 복압성 요실금}
  - {en: Pelvic organ prolapse, ko: 골반장기탈출증}
  - {en: Urinary tract infection, ko: 요로감염}
  - {en: Prostate cancer, ko: 전립선암, cant_miss: true}
  - {en: Bladder cancer or carcinoma in situ, ko: 방광암·상피내암, cant_miss: true}
  - {en: Chronic prostatitis, ko: 만성 전립선염}
  - {en: Urethral stricture, ko: 요도 협착}
  - {en: "Neurogenic bladder (diabetes, spinal cord disease)", ko: 신경인성 방광(당뇨·척수 질환)}
  - {en: Drug-induced urinary retention, ko: 약물 유발 요폐}
  - {en: Acute urinary retention, ko: 급성 요폐, cant_miss: true}
  - {en: Cauda equina syndrome or spinal cord compression, ko: 마미 증후군·척수 압박, cant_miss: true}
  - {en: Diabetes mellitus (polyuria), ko: 당뇨병(다뇨)}
tests:
  - {name: "Urinalysis, urine culture", for: [Urinary tract infection, Chronic prostatitis, Bladder cancer or carcinoma in situ, Diabetes mellitus (polyuria)], why: "감염·혈뇨·당뇨 확인"}
  - {name: "Post-void residual (bladder ultrasound)", for: [Acute urinary retention, Benign prostatic hyperplasia, "Neurogenic bladder (diabetes, spinal cord disease)", Drug-induced urinary retention, Pelvic organ prolapse], why: "잔뇨·요폐 확인"}
  - {name: "PSA (men, after shared decision)", for: [Prostate cancer, Benign prostatic hyperplasia], why: "전립선암 선별·전립선 크기 추정"}
  - {name: "Creatinine (retention, high residual or suspected renal impairment)", for: [Acute urinary retention], why: "폐쇄성 신기능 저하 확인"}
  - {name: "Frequency-volume chart (voiding diary)", for: [Overactive bladder, Diabetes mellitus (polyuria)], why: "다뇨·야간다뇨와 방광 용량 구분"}
  - {name: "Uroflowmetry, IPSS questionnaire", for: [Benign prostatic hyperplasia, Urethral stricture], why: "배출 장애 정도 평가"}
  - {name: "Glucose or HbA1c", for: [Diabetes mellitus (polyuria), "Neurogenic bladder (diabetes, spinal cord disease)"], why: "당뇨 확인"}
  - {name: "Urodynamic study (before surgery or unclear mixed symptoms)", for: [Stress urinary incontinence, "Neurogenic bladder (diabetes, spinal cord disease)"], why: "요실금 유형·방광 기능 확인"}
  - {name: "Emergency lumbar spine MRI (saddle anesthesia, new retention with back pain or leg weakness)", for: [Cauda equina syndrome or spinal cord compression], why: "마미 증후군 확인"}
  - {name: "Cystoscopy and urine cytology (hematuria)", for: [Bladder cancer or carcinoma in situ], why: "방광암 확인"}
plan:
  treatment:
    - "전립선비대증: 알파차단제, 전립선이 크면 5알파환원효소억제제 병용"
    - "과민성 방광: 방광 훈련·카페인 줄이기, 부족하면 항무스카린제 또는 베타3 작용제"
    - "복압성 요실금: 골반저근 운동, 효과 없으면 수술 상담"
    - "급성 요폐는 즉시 도뇨, 원인 약물(감기약 등) 중단"
  disposition: "대부분 외래 치료; 소변이 전혀 안 나오면 응급 도뇨, 회음부 감각 저하나 다리 근력 저하는 응급 MRI(마미 증후군)"
  follow_up:
    - "약물 시작 4~12주 후 증상 점수·잔뇨로 반응 평가"
    - "PSA 이상, 혈뇨, 직장수지검사 이상은 비뇨의학과 의뢰"
  red_flags: ["소변이 전혀 안 나옴", "엉덩이 주변 감각 저하", "다리에 힘이 빠짐", "열과 옆구리 통증"]
education:
  - "배뇨 일기를 써 보세요."
  - "자기 전에는 물을 줄여 보세요."
  - "소변이 전혀 안 나오면 바로 오세요."
guidelines:
  - KR_EuropePMC/europepmc_PMC4778754.md
  - US_StatPearls/statpearls_article-18212.md
  - US_StatPearls/statpearls_article-30850.md
  - KR_Journals/kr_journal_10.32587_jnic.2019.00136.md
notes: >
  v0.8.0: back pain added (the usual anchor symptom of cauda equina syndrome; saddle anesthesia and leg numbness are
  asked); a cough stress test for women replaces the leg exam (observed leakage on coughing confirms stress
  incontinence, AUA/SUFU SUI guideline 2017, amended 2023); bladder cancer or carcinoma in situ added as can't-miss
  (hematuria and irritative storage symptoms in a smoker); creatinine only for retention, a high residual or renal
  concern (AUA BPH 2021/2023 initial evaluation: history, exam with DRE, IPSS, urinalysis); fluid intake and thirst
  moved to priority 3; pad-count follow-ups quantify incontinence. The bimanual exam is limited to sexually active
  women: never had intercourse, no speculum or bimanual; transabdominal ultrasound; rectal exam only if a mass is
  suspected. Separate voiding (weak stream, hesitancy, straining) from storage symptoms (frequency, urgency, nocturia)
  and type incontinence (stress versus urge). Cold medicines with antihistamines or decongestants commonly
  precipitate retention in men with BPH.
