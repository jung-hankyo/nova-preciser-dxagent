differential:
  - {en: "Acute viral rhinosinusitis (common cold)", ko: 급성 바이러스성 비부비동염(감기)}
  - {en: Allergic rhinitis, ko: 알레르기 비염}
  - {en: Acute bacterial rhinosinusitis, ko: 급성 세균성 비부비동염}
  - {en: Chronic rhinosinusitis with or without nasal polyps, ko: 만성 비부비동염(비용종 동반 여부)}
  - {en: "Nonallergic or drug-induced rhinitis (decongestant spray overuse)", ko: 비알레르기성·약물성 비염(비충혈제거제 남용)}
  - {en: Nasal septal deviation, ko: 비중격 만곡증}
  - {en: "Complicated sinusitis (orbital, intracranial or invasive fungal)", ko: 합병 부비동염(안와·두개내 침범·침습성 진균), cant_miss: true}
  - {en: Sinonasal or nasopharyngeal tumor, ko: 비강·비인두 종양, cant_miss: true}
tests:
  - {name: "No imaging for uncomplicated acute rhinosinusitis", for: ["Acute viral rhinosinusitis (common cold)", Acute bacterial rhinosinusitis], why: "임상 진단(10일 이상 지속·이중 악화·고열 기준)"}
  - {name: "Skin prick test or serum specific IgE", for: [Allergic rhinitis, "Nonallergic or drug-induced rhinitis (decongestant spray overuse)"], why: "알레르기 원인 확인(음성이면 비알레르기성)"}
  - {name: "Nasal endoscopy", for: [Chronic rhinosinusitis with or without nasal polyps, Nasal septal deviation, Sinonasal or nasopharyngeal tumor], why: "비용종·구조 이상·종물 확인"}
  - {name: "Paranasal sinus CT (chronic disease after failed treatment)", for: [Chronic rhinosinusitis with or without nasal polyps], why: "만성 부비동염 범위 확인"}
  - {name: "Contrast-enhanced CT or MRI of sinuses, orbits and brain (red flags)", for: ["Complicated sinusitis (orbital, intracranial or invasive fungal)"], why: "안와·두개내 합병증 확인"}
  - {name: "CBC, CRP, glucose (red flags, diabetes or immunosuppression)", for: ["Complicated sinusitis (orbital, intracranial or invasive fungal)", Acute bacterial rhinosinusitis], why: "중증 감염·위험인자 확인"}
  - {name: "Nasopharyngoscopy with biopsy, EBV serology (unilateral obstruction, bleeding, adult middle-ear effusion)", for: [Sinonasal or nasopharyngeal tumor], why: "비강·비인두 종양 확인"}
  - {name: "Blood pressure and glucose (before oral decongestants or systemic steroids)", for: [safety], why: "고혈압·당뇨 확인(약물 전)"}
plan:
  treatment:
    - "감기·급성 바이러스성: 생리식염수 세척과 대증 치료, 항생제는 불필요"
    - "알레르기 비염: 비강 스테로이드 분무가 일차, 필요 시 2세대 항히스타민제와 원인 회피"
    - "급성 세균성 부비동염(10일 이상 지속·이중 악화·고열): 경과 관찰 또는 아목시실린(±클라불란산)"
    - "약물성 비염: 비충혈제거제를 끊고 비강 스테로이드로 대체"
  disposition: "대부분 외래 치료; 눈 주위 부종·시력 저하·복시·심한 두통·의식 변화는 즉시 응급실(합병 부비동염), 한쪽 코막힘이나 반복 코피는 이비인후과 내시경 의뢰"
  follow_up:
    - "급성은 7일 뒤 호전이 없거나 악화하면 재평가"
    - "만성·알레르기 비염은 4-8주 치료 후 증상과 분무 방법 확인"
  red_flags: ["눈 주위가 붓고 빨개짐", "물체가 겹쳐 보이거나 시력 저하", "심한 두통이나 목 경직", "한쪽 코에서 피가 반복됨"]
education:
  - "생리식염수로 코를 자주 씻으세요."
  - "코 뚫는 스프레이는 사흘 넘게 쓰지 마세요."
  - "눈 주위가 붓거나 겹쳐 보이면 바로 오세요."
guidelines:
  - KR_EuropePMC/europepmc_PMC9880301.md
  - US_StatPearls/statpearls_article-29065.md
  - US_StatPearls/statpearls_article-17370.md
  - KR_EuropePMC/europepmc_PMC8901942.md
notes: >
  New in v0.8.0 (official presentation 콧물/코막힘; evidence review 2026-10). Duration and course separate the causes:
  under 10 days and improving = viral; acute bacterial rhinosinusitis when symptoms persist 10 days or more without
  improvement or worsen after initial improvement (double worsening), or with severe onset (39 °C or more with purulent
  discharge or facial pain for 3-4 days; IDSA 2012, Chow); no imaging for uncomplicated acute rhinosinusitis; watchful
  waiting or amoxicillin with or without clavulanate (AAO-HNS adult sinusitis guideline 2015, Rosenfeld). Chronic
  rhinosinusitis: 12 weeks or more with two of obstruction, discharge, facial pain and smell loss (one being
  obstruction or discharge), confirmed by endoscopy or CT (EPOS 2020, Fokkens). Allergic rhinitis: sneezing, itch,
  watery discharge, seasonal or perennial triggers (house dust mite is the leading allergen in Korea); intranasal
  corticosteroid first (KAAACI allergic rhinitis guideline 2023). A positive nasal-spray answer is characterised
  (immediate relief = decongestant, and for how long): rebound congestion after more than a few days of use. Red flags
  (EPOS 2020): periorbital oedema or erythema, displaced globe, diplopia or ophthalmoplegia, reduced vision, severe
  headache, frontal swelling, meningism, neurological signs = complicated sinusitis; unilateral obstruction, bleeding,
  crusting or cacosmia = tumor (nasopharyngeal carcinoma in Korea: also an adult unilateral middle-ear effusion).
  Diabetes or immunosuppression with facial pain and black crusts = invasive fungal sinusitis. Adults only: children's
  nasal openings stay with the pediatric playbooks (a unilateral foul discharge in a child = foreign body). Openings
  that start with cough or throat pain route to those playbooks; this one takes openings that start with the nose.
