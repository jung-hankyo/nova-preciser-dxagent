  - {name: 하지 말초 진찰, item: Extremities, p: 1}
  - {name: 전반적 외관 시진, item: General, p: 2}
  - {name: 흉부 타진, item: Chest, p: 2}
  - {name: 결막·공막 시진, item: H/E/E/N/T, p: 2}
  - {name: 간경정맥 역류 검사, item: Neck, p: 3}
