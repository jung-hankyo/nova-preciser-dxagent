    p: 1
    then:
      - {id: heart_kind, q: "어떤 심장병이라고 들으셨어요?", item: Type of heart disease, known: "심부전|협심|심근경색|판막|부정맥|스텐트|심방세동|심장이 커|심장 기능"}
