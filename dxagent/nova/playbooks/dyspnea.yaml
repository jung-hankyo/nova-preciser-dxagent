  - {id: sudden, q: "갑자기 숨이 차기 시작했나요?", item: Onset mode, p: 1}
  - {id: tolerance, q: "얼마나 걸으면 숨이 차세요?", item: Exercise tolerance, p: 1}
  - {id: at_rest, q: "가만히 있어도 숨이 차세요?", item: Dyspnea at rest, p: 1}
  - {id: course, q: "점점 심해지고 있나요?", item: Course, p: 1}
  - {id: orthopnea, q: "누우면 숨이 더 차세요?", item: Orthopnea, p: 1}
  - {id: pnd, q: "자다가 숨이 차서 깬 적 있나요?", item: PND, p: 1}
  - {id: wheeze, q: "숨쉴 때 쌕쌕 소리가 나나요?", item: Wheezing, p: 1}
  - {id: cough, q: "기침을 하시나요?", item: Cough, p: 1}
  - {id: chest_pain, q: "가슴도 아프세요?", item: Chest pain, p: 1}
  - {id: leg_edema, q: "다리가 붓나요?", item: Leg edema, p: 1}
  - {id: sputum, q: "가래가 나오나요?", item: Sputum, p: 2}
  - {id: hemoptysis, q: "가래에 피가 섞여 나오나요?", item: Hemoptysis, p: 2}
  - {id: unilateral_leg, q: "한쪽 다리만 부은 적 있나요?", item: Unilateral leg swelling, p: 2}
