  - {name: "Chest X-ray", for: [Heart failure, Pneumonia, Pneumothorax, Pleural effusion, Interstitial lung disease, Chronic obstructive pulmonary disease], why: "폐부종·폐렴·기흉·흉수 확인"}
  - {name: "12-lead ECG", for: [Acute coronary syndrome, Heart failure, Pulmonary embolism], why: "허혈·부정맥·우심 부하 확인"}
  - {name: "BNP or NT-proBNP", for: [Heart failure], why: "심부전 확인·배제"}
  - {name: "Cardiac troponin", for: [Acute coronary syndrome], why: "심근 손상 확인"}
  - {name: "CBC", for: [Anemia, Pneumonia], why: "빈혈·감염 확인"}
  - {name: "Spirometry with bronchodilator test", for: [Chronic obstructive pulmonary disease, Asthma, Interstitial lung disease], why: "폐쇄성·제한성 장애 확인"}
  - {name: "Echocardiography", for: [Heart failure, Pleural effusion], why: "박출률·판막 확인"}
  - {name: "D-dimer or CT pulmonary angiography", for: [Pulmonary embolism], why: "폐색전증 배제·확진"}
  - {name: "High-resolution chest CT", for: [Interstitial lung disease], why: "간질성 폐질환 확인"}
plan:
  treatment:
    - "산소포화도·흉부 사진·BNP로 원인 확인 후 원인별 치료"
    - "심부전: 이뇨제로 울혈 조절, 심초음파로 박출률 확인 후 표준 약물"
    - "COPD·천식: 폐기능검사 확인 후 흡입 기관지확장제·흡입 스테로이드"
    - "금연, 독감·폐렴구균 예방접종"
  disposition: "안정 시 호흡곤란·산소포화도 저하·흉통 동반이면 응급실, 만성·안정적이면 외래 검사"
  follow_up:
    - "1-2주 후 검사 결과와 치료 반응 확인"
    - "만성 질환은 1-3개월마다 증상·체중·폐기능 점검"
  red_flags:
    - "쉬어도 숨이 참"
    - "입술이 파래짐"
    - "가슴 통증 동반"
    - "갑자기 심해지는 호흡곤란"
education:
  - "흉부 사진과 피검사를 할게요."
  - "검사 결과를 보고 치료를 정할게요."
  - "숨이 많이 차면 바로 오세요."
guidelines:
  - US_StatPearls/statpearls_article-20808.md
  - KR_EuropePMC/europepmc_PMC5614939.md
  - US_StatPearls/statpearls_article-26083.md
  - US_StatPearls/statpearls_article-17920.md
notes: >
  v0.8.0. Past TB raised to p1 through the standard "Tbc / hepatitis" item (post-TB destroyed lung is a common cause
  of chronic dyspnea in older Koreans; TB notification 35.2/100,000 in 2024, second in the OECD). Smoking years for
  pack-years (COPD: 10 pack-years or more) are asked by the engine after a positive smoking answer; palpitation demoted to p3 to stay within the turn plan. The kind
  of heart or lung disease is a follow-up of a positive history (prior heart failure LR+ 5.8). Hepatojugular reflux
  replaces chest inspection at p3 for an equivocal JVP; estrogen added at p3 for PE. Priorities follow the JAMA RCE
  (Wang 2005): prior HF LR+ 5.8, PND LR+ 2.6, S3 LR+ 11, absent exertional dyspnea LR- 0.48, absent rales LR- 0.51,
  BNP < 100 pg/mL LR- 0.11. Orthopnea, PND, edema and weight gain point to heart failure; wheeze with triggers to
  asthma; smoking with chronic sputum to COPD; sudden onset with pleuritic pain or unilateral leg swelling to
  pulmonary embolism.
