  - {en: Heart failure, ko: 심부전}
  - {en: Chronic obstructive pulmonary disease, ko: 만성 폐쇄성 폐질환}
  - {en: Asthma, ko: 천식}
  - {en: Pneumonia, ko: 폐렴}
  - {en: Pulmonary embolism, ko: 폐색전증, cant_miss: true}
  - {en: Acute coronary syndrome, ko: 급성 관상동맥증후군, cant_miss: true}
  - {en: Pneumothorax, ko: 기흉, cant_miss: true}
  - {en: Anemia, ko: 빈혈}
  - {en: Interstitial lung disease, ko: 간질성 폐질환}
  - {en: Pleural effusion, ko: 흉막삼출}
  - {en: Anxiety with hyperventilation, ko: 불안·과호흡}
tests:
